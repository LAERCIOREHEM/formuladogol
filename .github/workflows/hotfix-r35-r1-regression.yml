name: HOTFIX R35-R1 — Regression & LIVE Certification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-r35-r1-regression.yml'
      - 'tests/test_r35_r1_libertadores.mjs'
  workflow_run:
    workflows:
      - Deploy site (GitHub Pages)
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical R35-R1 — table zone and mathematical regression
        run: |
          set -euo pipefail
          node --test tests/test_r35_r1_libertadores.mjs
      - name: Independent LIVE Pages certification — R35
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request
          base='https://formuladogol.com.br'
          error=''
          for attempt in range(1,29):
              try:
                  def get(path):
                      url=base+path+('?r35r1='+str(int(time.time()))+'-'+str(attempt))
                      req=urllib.request.Request(url,headers={
                          'User-Agent':'FDG-R35-R1-Verified-Publication/1.0',
                          'Cache-Control':'no-cache, no-store',
                          'Pragma':'no-cache'
                      })
                      with urllib.request.urlopen(req,timeout=14) as r:
                          assert r.status==200,('HTTP',r.status,url)
                          return r.read().decode('utf-8')
                  odds=json.loads(get('/dados-br/probabilidades-brasileirao.json'))
                  html=get('/index.html')
                  copa=json.loads(get('/dados-br/competicoes-af-previsao/copa-do-brasil.json'))
                  flu=next(x for x in odds['clubes'] if x['clube']=='Fluminense')
                  cru=next(x for x in odds['clubes'] if x['clube']=='Cruzeiro')
                  final=[e for e in copa['eventos'] if int(e.get('fase_ordem') or 0)==900]
                  assert len(final)==1
                  assert {final[0]['mandante']['nome'],final[0]['visitante']['nome']}=={'Palmeiras','Grêmio'}
                  assert odds['simulacao']['quantidade']==2_000_000
                  assert flu['probabilidades_pct']['libertadores']==100
                  assert flu['probabilidades_detalhes']['libertadores']['certeza_estrutural'] is True
                  assert flu['probabilidades_detalhes']['libertadores']['exibicao']=='100%'
                  assert flu['situacao_matematica']['limite_posicao_pior']==6
                  assert cru['probabilidades_detalhes']['g4']['certeza_estrutural'] is True
                  assert 'function vagasLibertadores2027(tabela)' in html
                  assert 'fdg-vagas-libertadores-r35r1' in html
                  assert 'zona-libertadores-condicional' in html
                  assert 'tabela-vaga-badge' in html
                  print(json.dumps({
                      'status':'R35_R1_LIVE_VERIFIED',
                      'site':base,'attempt':attempt,
                      'g6_finalists':['Palmeiras','Grêmio'],
                      'fluminense':{'libertadores':'100% MATEMATICO',
                         'pior_colocacao':6},
                      'cruzeiro':{'g4':'100% MATEMATICO'},
                      'simulacoes_preservadas':2_000_000,
                      'faixas':'DINAMICAS + CONDICIONAIS',
                      'regression':'PASS'
                  },ensure_ascii=False,indent=2))
                  break
              except Exception as exc:
                  error=str(exc)
                  print('R35_R1_WAIT',attempt,error[:280])
                  if attempt<28:time.sleep(10)
          else:
              raise SystemExit('R35_R1_LIVE_NOT_VERIFIED: '+error)
          PY
