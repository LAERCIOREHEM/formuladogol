name: Health Pages Confirmed Outage Regression CI

on:
  pull_request:
    paths:
      - 'cloudflare/push-worker/src/health-monitor.js'
      - 'cloudflare/push-worker/src/health-action-center.js'
      - 'cloudflare/push-worker/tests/test-pages-availability-guard.mjs'
      - '.github/workflows/health-pages-false-red-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: cloudflare/push-worker
        run: npm install --no-audit --no-fund
      - name: Validate Worker syntax and Pages false RED regression
        working-directory: cloudflare/push-worker
        run: |
          node --check src/health-monitor.js
          node --check src/health-action-center.js
          node tests/test-pages-availability-guard.mjs
      - name: Full sports and health regressions
        working-directory: cloudflare/push-worker
        run: npm run test:sports
