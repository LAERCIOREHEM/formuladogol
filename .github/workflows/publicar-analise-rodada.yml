name: Publicar análise editorial da rodada

on:
  workflow_dispatch:
    inputs:
      rodada:
        description: 'Rodada específica (vazio = detectar automaticamente)'
        required: false
        type: string
      forcar:
        description: 'Publicar mesmo fora da janela editorial'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-write-main
  cancel-in-progress: false
  queue: max

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar o main mais recente
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar gerador e dados editoriais
        run: |
          set -euo pipefail
          python -m py_compile scripts/editorial_ia.py scripts/gerar_analise_rodada.py scripts/gerar_marcos_af_previsao.py scripts/validar_artefatos_analises.py
          python scripts/editorial_ia.py --self-test
          python scripts/gerar_analise_rodada.py --self-test
          python scripts/gerar_marcos_af_previsao.py --self-test
          python scripts/gerar_marcos_af_previsao.py
          python scripts/gerar_marcos_af_previsao.py --validar
          python -m json.tool dados-br/config-analises.json >/dev/null
          python scripts/validar_artefatos_analises.py

      - name: Detectar fechamento e gerar análise jornalística
        env:
          RODADA: ${{ inputs.rodada }}
          FORCAR: ${{ inputs.forcar }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EDITORIAL_MODEL: ${{ vars.OPENAI_EDITORIAL_MODEL || 'gpt-5.6-sol' }}
          OPENAI_EDITORIAL_REASONING: high
        shell: bash
        run: |
          set -euo pipefail
          args=(--usar-ia)
          if [[ -n "${RODADA:-}" ]]; then args+=(--rodada "$RODADA"); fi
          if [[ "${FORCAR:-false}" == "true" ]]; then args+=(--forcar); fi
          python scripts/gerar_analise_rodada.py "${args[@]}"

      - name: Validar artefatos gerados
        run: |
          set -euo pipefail
          python -m json.tool dados-br/analises.json >/dev/null
          python scripts/validar_artefatos_analises.py

      - name: Publicar no repositório com push robusto
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=(analises css/br-analises.css dados-br/analises.json dados-br/marcos-af-previsao.json sitemap.xml news-sitemap.xml feed.xml)
          EXISTING=()
          for f in "${FILES[@]}"; do [[ -e "$f" ]] && EXISTING+=("$f"); done
          FILES=("${EXISTING[@]}")

          if [[ ${#FILES[@]} -eq 0 ]] || [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "Nenhuma análise nova ou atualização editorial."
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          for f in "${FILES[@]}"; do
            mkdir -p "$TMP_DIR/$(dirname "$f")"
            cp -a "$f" "$TMP_DIR/$f"
          done

          for i in 1 2 3 4 5; do
            echo "Tentativa de push $i/5..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            for f in "${FILES[@]}"; do
              rm -rf "$f"
              mkdir -p "$(dirname "$f")"
              cp -a "$TMP_DIR/$f" "$f"
            done

            if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
              echo "Outro run já publicou os mesmos artefatos."
              exit 0
            fi

            git add -- "${FILES[@]}"
            git commit -m "Publicar análise editorial do Brasileirão"
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejeitado; nova tentativa sobre origin/main atualizado."
            sleep 3
          done

          echo "::error title=Falha ao publicar editorial::Não foi possível enviar o commit ao main após 5 tentativas."
          exit 1

      - name: Disparar deploy após publicação
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
          echo "Deploy disparado para o editorial recém-publicado."
