name: Publicar análise editorial da rodada

on:
  workflow_dispatch:
    inputs:
      rodada:
        description: 'Rodada específica (vazio = detectar automaticamente)'
        required: false
        type: string
      forcar:
        description: 'Publicar mesmo fora da janela editorial'
        required: false
        default: false
        type: boolean
      sem_ia:
        description: 'Usar somente o texto determinístico de contingência'
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows:
      - 'Atualizar Brasileirao (ESPN)'
      - 'Buscar melhores momentos Brasileirão oficiais'
    types: [completed]
  schedule:
    # Retentativas independentes do workflow pesado: 03:18 e 07:18 em Brasília.
    - cron: '18 6,10 * * *'

permissions:
  contents: write

concurrency:
  group: repo-write-main
  cancel-in-progress: false

jobs:
  publicar:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar o main mais recente
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar gerador e dados editoriais
        run: |
          python -m py_compile scripts/gerar_analise_rodada.py
          python scripts/gerar_analise_rodada.py --self-test
          python -m json.tool dados-br/config-analises.json >/dev/null

      - name: Detectar e gerar análise
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
          RODADA: ${{ inputs.rodada }}
          FORCAR: ${{ inputs.forcar }}
          SEM_IA: ${{ inputs.sem_ia }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${RODADA:-}" ]]; then args+=(--rodada "$RODADA"); fi
          if [[ "${FORCAR:-false}" == "true" ]]; then args+=(--forcar); fi
          if [[ "${SEM_IA:-false}" == "true" ]]; then args+=(--sem-ia); fi
          python scripts/gerar_analise_rodada.py "${args[@]}"

      - name: Validar artefatos gerados
        run: |
          python -m json.tool dados-br/analises.json >/dev/null
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          manifest = json.loads(Path('dados-br/analises.json').read_text(encoding='utf-8'))
          assert manifest['total_artigos'] == len(manifest['artigos']) >= 1
          for artigo in manifest['artigos']:
              assert artigo.get('hash_editorial')
              assert isinstance(artigo.get('editorial'), dict)
              pagina = Path('analises') / artigo['slug']
              texto = pagina.read_text(encoding='utf-8')
              Parser().feed(texto)
              assert 'NewsArticle' in texto
              assert f'data-fdg-analise-rodada="{artigo["rodada"]}"' in texto
              assert artigo['titulo'] in texto
              assert 'analysis-round-nav' in texto
              assert 'analysis-copy-section' in texto
              assert texto.count('analysis-game-card') == artigo['jogos_concluidos']
              assert '0,000%' not in texto
              assert 'Padrão dos percentuais' in texto
          Parser().feed(Path('analises/index.html').read_text(encoding='utf-8'))
          for xml in ('sitemap.xml', 'news-sitemap.xml', 'feed.xml'):
              ET.parse(xml)
          print(f"OK: {len(manifest['artigos'])} análise(s) validada(s).")
          PY

      - name: Publicar no repositório
        shell: bash
        run: |
          set -euo pipefail
          arquivos=(analises css/br-analises.css dados-br/analises.json sitemap.xml news-sitemap.xml feed.xml)
          if [[ -z "$(git status --porcelain -- "${arquivos[@]}")" ]]; then
            echo "Nenhuma análise nova ou atualização editorial."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${arquivos[@]}"
          git commit -m "Publicar análise editorial do Brasileirão"
          git push origin HEAD:main
