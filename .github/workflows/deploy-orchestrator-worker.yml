name: Deploy Orchestrator Worker
run-name: Deploy Orchestrator · ${{ github.event_name == 'push' && 'active' || inputs.mode || 'shadow' }}

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/orchestrator-worker/**'
      - 'scripts/orquestrar_workflows.py'
      - '.github/workflows/orquestrador-inteligente.yml'
      - '.github/workflows/af-previsao-fastlane-pos-final.yml'
      - '.github/workflows/publicar-analise-rodada.yml'
      - '.github/workflows/atualizar-brasileirao.yml'
      - 'scripts/fdg_reliability.py'
      - 'scripts/validar_snapshot_esportivo.py'
      - 'scripts/validar_publicacao_brasileirao.py'
      - 'scripts/registrar_slo_confiabilidade.py'
      - 'scripts/gerar_estado_confiabilidade.py'
      - 'tests/incidents/**'
      - 'docs/operations/**'
      - '.github/workflows/atualizar-publicos-brasileirao.yml'
      - '.github/workflows/auditar-transmissoes-ia.yml'
      - '.github/workflows/buscar-transmissoes-aovivo-brasileirao.yml'
      - 'scripts/buscar_transmissoes_aovivo_brasileirao.py'
      - 'dados-br/config-orquestrador.json'
      - '.github/workflows/deploy-orchestrator-worker.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo do orquestrador Cloudflare"
        required: true
        default: "shadow"
        type: choice
        options: [shadow, active]

permissions:
  contents: read

concurrency:
  group: fdg-orchestrator-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FDG_ORCHESTRATOR_GITHUB_TOKEN: ${{ secrets.FDG_ORCHESTRATOR_GITHUB_TOKEN }}
      REQUESTED_MODE: ${{ github.event_name == 'push' && 'active' || inputs.mode || 'shadow' }}
    defaults:
      run:
        working-directory: cloudflare/orchestrator-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar credenciais
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'ERRO: secret CLOUDFLARE_API_TOKEN ausente.'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'ERRO: secret CLOUDFLARE_ACCOUNT_ID ausente.'; exit 1; }
          test -n "${FDG_ORCHESTRATOR_GITHUB_TOKEN:-}" || { echo 'ERRO: secret FDG_ORCHESTRATOR_GITHUB_TOKEN ausente.'; exit 1; }
          case "${REQUESTED_MODE}" in shadow|active) ;; *) echo 'ERRO: mode inválido.'; exit 1 ;; esac

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar permissões do token GitHub
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.github.com/repos/LAERCIOREHEM/formuladogol'
          COMMON=(-fsS --max-time 15 -H "Authorization: Bearer ${FDG_ORCHESTRATOR_GITHUB_TOKEN}" -H 'X-GitHub-Api-Version: 2026-03-10')
          curl "${COMMON[@]}" -H 'Accept: application/vnd.github+json' "${API}/actions/workflows?per_page=1" >/dev/null || {
            echo 'ERRO: o token precisa de Actions: Read and write para disparar workflows.'
            exit 1
          }
          curl "${COMMON[@]}" -H 'Accept: application/vnd.github.raw+json' "${API}/contents/dados-br/config-analises.json?ref=main" >/tmp/fdg-config-analises.json || {
            echo 'ERRO: o token precisa de Contents: Read-only para ler artefatos internos do orquestrador.'
            exit 1
          }
          node -e 'JSON.parse(require("fs").readFileSync("/tmp/fdg-config-analises.json","utf8")); console.log("Token GitHub OK: Actions + Contents(read).")'

      - name: Validar código e contratos
        run: npm run validate

      - name: Calcular identidade da governança continental
        shell: bash
        run: |
          set -euo pipefail
          FP="$(python3 - <<'PY'
          import sys
          from pathlib import Path
          root = Path.cwd().resolve().parents[1]
          sys.path.insert(0, str(root / 'scripts'))
          from orquestrar_workflows import editorial_continental_guard_fingerprint
          print(editorial_continental_guard_fingerprint())
          PY
          )"
          [[ "$FP" =~ ^[0-9a-f]{64}$ ]] || { echo 'ERRO: fingerprint continental inválido.'; exit 1; }
          echo "FDG_CONTINENTAL_GUARD_FINGERPRINT=$FP" >> "$GITHUB_ENV"

      - name: Renderizar configuração segura SHADOW
        env:
          FDG_ORCHESTRATOR_MODE: shadow
        run: npm run render-config

      - name: Validar contrato canônico antes do deploy
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(node --input-type=module -e "import('./src/contract.js').then(({ORCHESTRATOR_CONTRACT:c})=>process.stdout.write(c.version))")"
          echo "EXPECTED_ORCHESTRATOR_VERSION=$EXPECTED" >> "$GITHUB_ENV"
          EXPECTED_VERSION="$EXPECTED" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { ORCHESTRATOR_CONTRACT } from './src/contract.js';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const rendered = fs.readFileSync('wrangler.generated.jsonc', 'utf8');
          const expected = process.env.EXPECTED_VERSION;
          const cfg = JSON.parse(fs.readFileSync('../../dados-br/config-orquestrador.json','utf8'));
          const problems = [];
          if (expected !== ORCHESTRATOR_CONTRACT.version) problems.push(`env=${expected} contract=${ORCHESTRATOR_CONTRACT.version}`);
          if (pkg.version !== expected) problems.push(`package=${pkg.version}`);
          if (!rendered.includes(`\"ORCHESTRATOR_VERSION\": \"${expected}\"`)) problems.push('Wrangler renderizado diverge');
          if (!rendered.includes(`\"${ORCHESTRATOR_CONTRACT.cron}\"`)) problems.push('Wrangler cron diverge');
          if (Number(cfg.schema_version) !== Number(ORCHESTRATOR_CONTRACT.configSchemaVersion)) problems.push(`config schema=${cfg.schema_version}`);
          if (problems.length) { console.error('ERRO: contract drift: '+problems.join('; ')); process.exit(1); }
          console.log(`Contrato canônico sincronizado: version=${expected}; schema=${cfg.schema_version}.`);
          NODE

      - name: Deploy base SHADOW + Durable Object + Cron Trigger
        run: npx wrangler deploy --config wrangler.generated.jsonc

      - name: Gravar token GitHub somente como secret do Worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FDG_ORCHESTRATOR_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN --config wrangler.generated.jsonc

      - name: Ativar somente quando solicitado
        if: ${{ github.event_name == 'push' || inputs.mode == 'active' }}
        env:
          FDG_ORCHESTRATOR_MODE: active
        shell: bash
        run: |
          set -euo pipefail
          npm run render-config
          npx wrangler deploy --config wrangler.generated.jsonc

      - name: Smoke test de health
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${REQUESTED_MODE}"
          URL='https://orchestrator.formuladogol.com.br/health'
          for i in $(seq 1 20); do
            BODY="$(curl -fsS --max-time 10 "$URL" 2>/dev/null || true)"
            if HEALTH_BODY="$BODY" EXPECTED_MODE="$EXPECTED" EXPECTED_VERSION="$EXPECTED_ORCHESTRATOR_VERSION" node --input-type=module <<'NODE'
          import { ORCHESTRATOR_CONTRACT } from './src/contract.js';
          const body = process.env.HEALTH_BODY || '';
          const expectedMode = process.env.EXPECTED_MODE || '';
          const expectedVersion = process.env.EXPECTED_VERSION || '';
          let p;
          try { p = JSON.parse(body); } catch { process.exit(1); }
          const expected = {
            ok: true,
            service: ORCHESTRATOR_CONTRACT.service,
            version: expectedVersion,
            mode: expectedMode,
            cron: ORCHESTRATOR_CONTRACT.cron,
            ...ORCHESTRATOR_CONTRACT.health,
          };
          const problems = [];
          for (const [key, value] of Object.entries(expected)) {
            if (JSON.stringify(p?.[key]) !== JSON.stringify(value)) problems.push(`${key}=${JSON.stringify(p?.[key])}`);
          }
          if (problems.length) {
            console.error('health contract drift: ' + problems.slice(0, 12).join('; '));
            process.exit(1);
          }
          process.exit(0);
          NODE
            then
              echo "Health OK em modo $EXPECTED; Reliability Control Plane v1 + AF Fastlane + Editorial Closure confirmados."
              printf '%s\n' "$BODY"
              exit 0
            fi
            echo "Tentativa $i/20: health ainda não refletiu o contrato esperado."
            sleep 6
          done
          echo "ERRO: health não confirmou modo $EXPECTED e Reliability Control Plane v1 e contratos dependentes em $URL"
          curl -fsS --max-time 10 "$URL" || true
          echo
          exit 1

      - name: Confirmar estado persistente
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://orchestrator.formuladogol.com.br/status | tee /tmp/orchestrator-status.json
          node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync("/tmp/orchestrator-status.json","utf8"));
            if(!p.ok || p.engine!=="fdg-cloudflare-orchestrator") process.exit(1);
            console.log(`Estado OK; mode=${p.mode}; lastTickAt=${p.lastTickAt||"ainda aguardando primeiro cron"}`);
          '

      - name: Resumo
        shell: bash
        run: |
          {
            echo '## Orquestrador Cloudflare'
            echo ''
            echo "- **Modo:** \`${REQUESTED_MODE}\`"
            echo '- **Worker:** `formula-do-gol-orchestrator`'
            echo "- **Versão:** \`${EXPECTED_ORCHESTRATOR_VERSION}\` (derivada de contract.js)"
            echo '- **AF pós-FINAL:** `Fastlane v1`'
            echo '- **Editorial:** `Closure Guarantee v1 · SLA alvo 15 min`'
            echo '- **Reliability:** `Control Plane v1 · Sporting Integrity Guard · diagnostics · trace · SLO`'
            echo '- **Cron:** `*/5 * * * *`'
            echo '- **Health:** https://orchestrator.formuladogol.com.br/health'
            echo '- **Status:** https://orchestrator.formuladogol.com.br/status'
          } >> "$GITHUB_STEP_SUMMARY"
