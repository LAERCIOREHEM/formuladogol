name: Reparar integridade continental 2026
run-name: Reparar Quartas continentais · verdade factual + AF + editorial

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-write-main
  cancel-in-progress: false

jobs:
  reparar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-af-previsao.txt

      - name: Instalar dependências do AF
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-af-previsao.txt

      - name: Validar código antes de tocar nos dados
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/atualizar_competicoes_af_previsao.py \
            scripts/af_previsao_continental.py \
            scripts/reconciliar_af_continental.py \
            scripts/gerar_analise_continental.py \
            scripts/editorial_ia.py \
            scripts/buscar_melhores_momentos_continentais.py \
            scripts/reparar_integridade_continental_20260918.py
          python scripts/atualizar_competicoes_af_previsao.py --self-test
          python scripts/af_previsao_continental.py --self-test
          python scripts/gerar_analise_continental.py --self-test
          python scripts/editorial_ia.py --self-test
          python scripts/buscar_melhores_momentos_continentais.py --self-test
          python scripts/reparar_integridade_continental_20260918.py --self-test
          python -m json.tool dados-br/correcoes/continentais-2026-quartas-canonico.json >/dev/null

      - name: Restaurar verdade esportiva e invalidar derivados contaminados
        run: |
          set -euo pipefail
          python scripts/reparar_integridade_continental_20260918.py --apply --validate-before-af

      - name: Recalcular AF-Previsão integralmente
        id: af
        run: |
          set -euo pipefail
          python scripts/reconciliar_af_continental.py --force --max-attempts 1
          python scripts/reparar_integridade_continental_20260918.py --validate-after-af

      - name: Sincronizar histórico e marcos públicos do AF
        run: |
          set -euo pipefail
          python scripts/gerar_probabilidades_brasileirao.py --sincronizar-historico-publicado
          python scripts/gerar_marcos_af_previsao.py
          python scripts/gerar_marcos_af_previsao.py --validar
          python scripts/avaliar_af_previsao.py --strict

      - name: Reconciliar melhores momentos oficiais das Quartas
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${YOUTUBE_API_KEY:-}" ]]; then
            python scripts/buscar_melhores_momentos_continentais.py --fase-ordem 700
          else
            echo "::warning title=YouTube API ausente::Links automáticos inválidos foram removidos; somente vínculos validados serão exibidos."
          fi

      - name: Gerar novamente o editorial das Quartas
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EDITORIAL_MODEL: ${{ vars.OPENAI_EDITORIAL_MODEL || 'gpt-5.6-sol' }}
          OPENAI_EDITORIAL_REASONING: high
        run: |
          set -euo pipefail
          python scripts/gerar_analise_continental.py --usar-ia --fase-ordem 700
          python scripts/validar_artefatos_analises.py
          python scripts/reparar_integridade_continental_20260918.py --validate-article

      - name: Validar que o reparo não editou probabilidades manualmente
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.atualizar_competicoes_af_previsao import load_existing_snapshots, snapshots_state_hash

          p = json.loads(Path('dados-br/probabilidades-brasileirao.json').read_text(encoding='utf-8'))
          assert p.get('status') == 'ok'
          assert int((p.get('simulacao') or {}).get('quantidade') or 0) == 2_000_000, 'AF não foi recalculado com 2 milhões de simulações'
          current = snapshots_state_hash(load_existing_snapshots())
          assert (p.get('integracao_continental') or {}).get('hash_snapshots') == current
          print('OK: probabilidades são saída de novo AF 2M sobre os snapshots corrigidos.')
          PY

      - name: Publicar transação de reparo
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ALLOWED=(
            dados-br/competicoes-af-previsao/libertadores.json
            dados-br/competicoes-af-previsao/sul-americana.json
            dados-br/auditoria-competicoes-af-previsao.json
            dados-br/probabilidades-brasileirao.json
            dados-br/probabilidades-por-pontuacao.json
            dados-br/probabilidades-jogos.json
            dados-br/auditoria-probabilidades-jogos.json
            dados-br/probabilidades-bolao.json
            dados-br/auditoria-probabilidades.json
            dados-br/historico-probabilidades.json
            dados-br/marcos-af-previsao.json
            dados-br/avaliacao-af-previsao.json
            dados-br/historico-probabilidades-continentais.json
            dados-br/melhores-momentos-continentais.json
            dados-br/analises.json
            analises
            sitemap.xml
            news-sitemap.xml
            feed.xml
          )

          CHANGED="$(git status --porcelain)"
          if [[ -z "$CHANGED" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração restante."
            exit 0
          fi

          # Só arquivos derivados esperados podem ser commitados por este reparo.
          python - <<'PY'
          import subprocess
          allowed_prefixes = (
              'dados-br/competicoes-af-previsao/libertadores.json',
              'dados-br/competicoes-af-previsao/sul-americana.json',
              'dados-br/auditoria-competicoes-af-previsao.json',
              'dados-br/probabilidades-brasileirao.json',
              'dados-br/probabilidades-por-pontuacao.json',
              'dados-br/probabilidades-jogos.json',
              'dados-br/auditoria-probabilidades-jogos.json',
              'dados-br/probabilidades-bolao.json',
              'dados-br/auditoria-probabilidades.json',
              'dados-br/historico-probabilidades.json',
              'dados-br/marcos-af-previsao.json',
              'dados-br/avaliacao-af-previsao.json',
              'dados-br/historico-probabilidades-continentais.json',
              'dados-br/melhores-momentos-continentais.json',
              'dados-br/analises.json',
              'analises/', 'sitemap.xml', 'news-sitemap.xml', 'feed.xml',
          )
          rows = subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          unexpected=[]
          for row in rows:
              path=row[3:].strip()
              if ' -> ' in path:
                  path=path.split(' -> ',1)[1]
              if not any(path == p or path.startswith(p) for p in allowed_prefixes):
                  unexpected.append(path)
          if unexpected:
              raise SystemExit('arquivos inesperados na transação: ' + ', '.join(unexpected))
          print('OK: allowlist de arquivos derivados.')
          PY

          git add -- "${ALLOWED[@]}"
          git commit -m "Reparar integridade das Quartas continentais 2026"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Disparar deploy do site
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Resumo
        if: success()
        run: |
          echo "Reparo concluído: verdade esportiva -> AF 2M -> melhores momentos validados -> editorial -> commit -> deploy."
          echo "Não é necessário Deploy Orchestrator Worker nem Deploy Push Worker."
