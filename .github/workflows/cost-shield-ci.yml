name: CF-COST-SHIELD R1 — Regression
on:
  pull_request:
    paths:
      - 'cloudflare/push-worker/**'
      - 'cloudflare/orchestrator-worker/**'
      - '.github/workflows/cost-shield-ci.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/push-worker/**'
      - 'cloudflare/orchestrator-worker/**'
      - '.github/workflows/cost-shield-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cloudflare/push-worker/src/cost-shield.js
      - run: node --check cloudflare/push-worker/src/index.js
      - run: node --check cloudflare/push-worker/src/sports-monitor.js
      - run: node --check cloudflare/orchestrator-worker/src/index.js
      - run: node --test cloudflare/push-worker/tests/test-cost-shield.mjs
