name: CF-COST-SHIELD R2 — Production Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cost-shield-r2-production-smoke.yml'
      - 'cloudflare/push-worker/src/cost-shield.js'
      - 'cloudflare/push-worker/src/index.js'
      - 'cloudflare/push-worker/src/ai-router.js'
      - 'cloudflare/push-worker/src/sports-monitor.js'
      - 'cloudflare/orchestrator-worker/src/cost-shield-client.js'
      - 'cloudflare/orchestrator-worker/src/cost-governance.js'
      - 'cloudflare/orchestrator-worker/src/index.js'
      - 'cloudflare/orchestrator-worker/src/orchestrator-state.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify production R2 continuity without paid provider probes
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, json, time, urllib.request
          PUSH='https://push.formuladogol.com.br'
          ORCH='https://orchestrator.formuladogol.com.br'
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={
                  'Accept':'application/json','User-Agent':'FDG-R2-Production-Smoke'}),timeout=12) as response:
                  return json.load(response)
          shield=orch=None
          for attempt in range(1,35):
              try:
                  shield=get(PUSH+'/v1/cost-shield/status')
                  orch=get(ORCH+'/status')
                  valid=shield.get('version')==2 and shield.get('halted') is False and orch.get('ok') is True
                  quota_ready=isinstance(shield.get('providerUsage'),dict)
                  if valid and quota_ready:
                      print('R2 coordinator, quotas and orchestrator reachable, attempt',attempt)
                      break
                  print('R2 settling',attempt,'mode='+str(shield.get('mode')),
                        'reason='+str(shield.get('reason')),
                        'billingError='+str(shield.get('billingError')),
                        'providerUsage='+str(shield.get('providerUsage')))
              except Exception as e:
                  print('R2 rollout pending, attempt',attempt,str(e)[:130])
              time.sleep(12)
          else:
              raise RuntimeError('R2 cost coordinator, atomic provider quotas and/or orchestrator not converged in production: shield='+str(shield))
          assert shield['essentialSportsAllowed'] is True
          assert isinstance(shield.get('optionalAllowed'),bool)
          assert isinstance(shield.get('secondaryAllowed'),bool)
          assert shield.get('mode') in ('normal','observe','optional_paused','secondary_paused','unverified')
          assert isinstance(shield.get('providerUsage'),dict)
          monitor=get(PUSH+'/v1/monitor/status')
          dispatch=get(PUSH+'/v1/dispatch/status')
          assert monitor.get('ok') is True and monitor.get('lastBootstrapAt',0)>0
          assert dispatch.get('ok') is True
          assert isinstance(dispatch.get('activeSubscriptions'),int)
          # The scores endpoint is read-only, independent of costly search
          # probes, and may legitimately contain no games on a quiet date.
          import zoneinfo
          day=datetime.datetime.now(zoneinfo.ZoneInfo('America/Sao_Paulo')).strftime('%Y%m%d')
          live=get(PUSH+'/v1/live/state?league=bra.1&dates='+day+'&fresh=1')
          assert live.get('ok') is True and isinstance(live.get('data',{}).get('events'),list)
          print(json.dumps({
              'result':'CF-COST-SHIELD_R2_PRODUCTION_VERIFIED',
              'shield':{k:shield.get(k) for k in (
                  'version','mode','billingVerified','billingError','essentialSportsAllowed',
                  'optionalAllowed','secondaryAllowed','dailyUsd','cycleUsd',
                  'monthlyProjectedUsd','lastSuccessAt','providerUsage')},
              'monitor':{k:monitor.get(k) for k in ('ok','watchCount','activeGames',
                  'lastBootstrapAt','lastPollAt','lastPollError')},
              'dispatch':{k:dispatch.get(k) for k in ('activeSubscriptions','pendingEvents','deliveries')},
              'orchestrator':{k:orch.get(k) for k in ('ok','mode','costShieldMode','lastTickAt','result')},
              'scoreboard':{'date':day,'events':len(live['data']['events']),'source':live.get('source')}
          },ensure_ascii=False,indent=2))
          PY
