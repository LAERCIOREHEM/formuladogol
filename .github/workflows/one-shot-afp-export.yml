name: AFP-R1 owner authorized derived export
on:
  push:
    branches: [ops/afp-r1-experimental-export]
    paths: [.github/workflows/one-shot-afp-export.yml]
permissions:
  contents: write
  actions: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable private preview, decrypt in runner, export only derived scores
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_KEY: ${{ secrets.FDG_RESEARCH_ARCHIVE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          w="$(mktemp -d "$RUNNER_TEMP/afp-export.XXXXXXXX")"
          trap 'rm -rf "$w"' EXIT
          test "${#ARCHIVE_KEY}" -ge 32
          gh api repos/LAERCIOREHEM/formuladogol/actions/runs/46063800576 > "$w/run.json"
          jq -e '.status=="completed" and .conclusion=="success" and .head_sha=="00b61a6371e48fb66c614f50cf7baca5bb640a96" and .head_branch=="main"' "$w/run.json" >/dev/null
          gh api repos/LAERCIOREHEM/formuladogol/actions/artifacts/15229713126 > "$w/meta.json"
          jq -e '.name=="fdg-afp-r1-incremental-encrypted-preview" and .expired==false and .workflow_run.id==46063800576 and .digest=="sha256:e961baad5ba48ccceecb2b080d79200f1964bf54a0ad7d932326a4ffb4f19591"' "$w/meta.json" >/dev/null
          gh api repos/LAERCIOREHEM/formuladogol/actions/artifacts/15229713126/zip > "$w/source.zip"
          printf '%s  %s\n' e961baad5ba48ccceecb2b080d79200f1964bf54a0ad7d932326a4ffb4f19591 "$w/source.zip" | sha256sum -c --status
          python - "$w" <<'PY'
          import pathlib,sys,zipfile
          w=pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(w/"source.zip") as z:
              assert z.namelist()==["afp-preview.tar.gpg"]
              (w/"preview.gpg").write_bytes(z.read(z.namelist()[0]))
          PY
          printf '%s\n' "$ARCHIVE_KEY" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --output "$w/preview.tar" --decrypt "$w/preview.gpg" 2>"$w/gpg.log"
          python - "$w" <<'PY'
          import pathlib,sys,tarfile
          w=pathlib.Path(sys.argv[1])
          with tarfile.open(w/"preview.tar") as t:
              matches=[m for m in t.getmembers() if m.name.removeprefix("./")=="ranking.json" and m.isfile()]
              assert len(matches)==1 and 0<matches[0].size<20000000
              (w/"ranking.json").write_bytes(t.extractfile(matches[0]).read())
          PY
          python research/fdg2027/afp-r1/export_experimental.py "$w/ranking.json" research/fdg2027/afp-r1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/fdg2027/afp-r1/approved-ranking.json research/fdg2027/afp-r1/approved-release.json
          git diff --cached --stat
          git commit -m "AFP-R1: derived public scores only, experimental release"
          git push origin HEAD:refs/heads/ops/afp-r1-experimental-export
