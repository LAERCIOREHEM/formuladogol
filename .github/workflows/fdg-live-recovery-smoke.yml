name: FDG — Essential Live Recovery Production Smoke

on:
  push:
    paths:
      - '.github/workflows/fdg-live-recovery-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify shield and ESPN live routes (no paid AI)
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://push.formuladogol.com.br
          curl -fsS --retry 3 --retry-delay 3 --max-time 12 "$BASE/v1/cost-shield/status" -o /tmp/fdg-shield.json
          curl -fsS --retry 3 --retry-delay 3 --max-time 15 "$BASE/v1/monitor/status" -o /tmp/fdg-monitor.json
          curl -fsS --retry 3 --retry-delay 3 --max-time 20 "$BASE/v1/live/state?league=bra.1&dates=20261119&fresh=1" -o /tmp/fdg-live.json
          curl -fsS --retry 3 --retry-delay 3 --max-time 12 "https://formuladogol.com.br/dados-br/agenda-clubes-br.json" -o /tmp/fdg-agenda.json
          curl -fsS --retry 3 --retry-delay 3 --max-time 12 "$BASE/v1/dispatch/status" -o /tmp/fdg-dispatch.json
          python3 - <<'PY'
          import json
          shield=json.load(open('/tmp/fdg-shield.json'))
          monitor=json.load(open('/tmp/fdg-monitor.json'))
          live=json.load(open('/tmp/fdg-live.json'))
          agenda=json.load(open('/tmp/fdg-agenda.json'))
          dispatch=json.load(open('/tmp/fdg-dispatch.json'))
          agenda_today=[{'id':str(row.get('event_id')),'kickoff':row.get('data_iso')}
                      for row in agenda.get('jogos',[]) if str(row.get('data_iso','')).startswith('2026-11-19')]
          ids={str(x.get('id','')) for x in live.get('data',{}).get('events',[])}
          required={'401841308','401841317'}
          game_rows=[
              {'id':str(e.get('id')),'date':e.get('date'),'status':e.get('status'),
               'teams':[{'name':c.get('team',{}).get('displayName'),'score':c.get('score')}
                        for comp in e.get('competitions',[]) for c in comp.get('competitors',[])]}
              for e in live.get('data',{}).get('events',[])
              if str(e.get('id')) in required
          ]
          tracked={str(m.get('eventId','')):m.get('state') for m in monitor.get('matches',[])}
          live_now=[str(g.get('id')) for g in game_rows
                    if g.get('status',{}).get('type',{}).get('state')=='in']
          diagnostics={
              'shield': {k:shield.get(k) for k in ('version','halted','reason','lastCheckedAt','lastSuccessAt')},
              'monitor': {**{k:monitor.get(k) for k in ('ok','watchCount','matchCount','lastBootstrapAt','lastPollAt','lastPollCompletedAt','activeGames','lastPollError','lastAgendaError','espnPollingSuppressed','scoreboardSources','sourceAttempts')}, 'trackedMatchStates':{x:tracked.get(x) for x in sorted(required)}}, 'agendaToday':agenda_today, 'pushDispatch':{
                'activeSubscriptions':dispatch.get('activeSubscriptions'),
                'pendingEvents':dispatch.get('pendingEvents'),
                'deliveries':dispatch.get('deliveries'),
                'recentGoals':dispatch.get('recentGoals',[])[-8:]},
              'live': {'ok':live.get('ok'),'source':live.get('source'),'stale':live.get('stale'),
                       'fetchAt':live.get('fetchedAt'),'eventCount':len(live.get('data',{}).get('events',[])),
                       'expectedEventIdsPresent':sorted(ids.intersection(required)), 'gameSources':{id:live.get('selectedSources',{}).get(id) for id in sorted(required)}, 'sourceAttempts':live.get('attempts'), 'games':game_rows},
          }
          print(json.dumps(diagnostics,indent=2,ensure_ascii=False))
          assert live.get('ok') is True and required.issubset(ids), 'Live ESPN scoreboard sem ambas as partidas'
          assert int(monitor.get('watchCount') or 0)>=2, 'SportsMonitor sem agenda'
          assert int(monitor.get('lastBootstrapAt') or 0)>0, 'SportsMonitor sem bootstrap'
          assert all(tracked.get(x)=='in' for x in live_now), 'ESPN LIVE, mas SportsMonitor não acompanha a partida: '+str(tracked)
          assert int(shield.get('version') or 0)==1, 'COST SHIELD desconhecido'
          assert shield.get('reason') not in ('cycle_limit','hourly_limit','rolling_24h_limit',
                    'd1_daily_rows_read','d1_daily_rows_written'), 'Limite financeiro real foi atingido'
          print('LIVE RECOVERY PRODUCTION VERIFIED')
          PY
