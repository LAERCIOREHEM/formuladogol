name: Atualizar públicos do Brasileirão
run-name: Públicos · incremental

on:
  # Sem schedule próprio. O orquestrador dispara somente quando existe partida
  # FINAL sem público e o backoff da pendência venceu.
  workflow_dispatch:
    inputs:
      reabrir_esgotados:
        description: "Zerar o marcador de esgotado (use após corrigir a causa das falhas, ex.: allowlist de fontes)"
        type: boolean
        default: false
      dry_run:
        description: 'Testar coleta sem publicar arquivos'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-write-main
  cancel-in-progress: false

jobs:
  atualizar:
    name: Completar públicos pendentes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar main mais recente
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar coletor e artefatos
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/atualizar_publicos_brasileirao.py \
            scripts/completar_publicos_ia.py \
            scripts/gerar_estatisticas_competicao_brasileirao.py
          python scripts/atualizar_publicos_brasileirao.py --self-test
          python scripts/completar_publicos_ia.py --self-test
          python -m json.tool resultados.json >/dev/null
          python -m json.tool dados-br/jogos-detalhes.json >/dev/null
          python -m json.tool dados-br/publicos-complementares.json >/dev/null
          python -m json.tool dados-br/auditoria-publicos.json >/dev/null

      - name: Buscar somente públicos ainda ausentes
        id: coleta
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REABRIR: ${{ inputs.reabrir_esgotados }}
        run: |
          set -euo pipefail
          cp dados-br/publicos-complementares.json /tmp/publicos-antes.json

          # ORDEM INVERTIDA: a camada de IA vem PRIMEIRO.
          # O coletor determinístico varre o sitemap do ge e, na prática, gasta
          # ~90s em ge_artigos + ~8s na CBF para achar zero público, porque a
          # matéria consolidada da rodada só sai quando a rodada inteira termina.
          # A busca por partida acha a ficha técnica poucas horas após o apito.
          # Rodando a IA antes, o determinístico só precisa varrer o que sobrou.
          if [[ "${REABRIR:-false}" == "true" ]]; then
            python scripts/completar_publicos_ia.py --reabrir-esgotados --dry-run >/dev/null 2>&1 || true
            python - <<'PY'
          import json, pathlib
          caminho = pathlib.Path('dados-br/estado-publicos-ia.json')
          try:
              estado = json.loads(caminho.read_text(encoding='utf-8'))
          except Exception:
              estado = {}
          estado['jogos'] = {}
          estado['esgotados'] = []
          caminho.write_text(json.dumps(estado, ensure_ascii=False, indent=2) + "\n", encoding='utf-8')
          print('Marcadores de esgotado zerados a pedido do disparo manual.')
          PY
          fi

          set +e
          python scripts/completar_publicos_ia.py \
            --grace-horas 2 \
            --max-jogos 10 \
            --max-tentativas 8 2>&1 | tee /tmp/camada-ia.log
          IA_RC=${PIPESTATUS[0]}
          set -e

          python scripts/atualizar_publicos_brasileirao.py --max-rodadas 3
          if [[ "$IA_RC" != "0" ]]; then
            echo "Camada de IA terminou com codigo $IA_RC; seguindo com o deterministico."
          fi
          if grep -q "OPENAI_API_KEY ausente" /tmp/camada-ia.log; then
            echo "::error::OPENAI_API_KEY nao chegou ao runner. Cadastre em Settings > Secrets and variables > Actions > Repository secrets."
          fi

          # A camada de IA grava complementos e propaga para jogos-detalhes, mas
          # não reescreve a auditoria. Sem esta reconsolidação (offline, sem rede)
          # auditoria-publicos.json fica defasada e as asserções de cobertura da
          # etapa seguinte acusam divergência.
          python scripts/atualizar_publicos_brasileirao.py --sem-rede

          NOVOS="$(python - <<'PY'
          import json
          antes = json.load(open('/tmp/publicos-antes.json', encoding='utf-8'))
          depois = json.load(open('dados-br/publicos-complementares.json', encoding='utf-8'))
          mudou = (antes.get('jogos') or {}) != (depois.get('jogos') or {})
          print('true' if mudou else 'false')
          PY
          )"
          echo "novos=$NOVOS" >> "$GITHUB_OUTPUT"
          if [[ "$NOVOS" == "true" ]]; then
            echo "Há público novo; atualizando somente os derivados necessários."
          else
            echo "Nenhum público novo encontrado nesta tentativa. O snapshot publicado não será tocado."
          fi

      - name: Regenerar somente a visão de público das Estatísticas
        if: steps.coleta.outputs.novos == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # O próprio coletor já propagou os novos números para jogos-detalhes.json
          # sem reconsultar a ESPN e sem mexer na auditoria técnica dos detalhes.
          python scripts/gerar_estatisticas_competicao_brasileirao.py
          python - <<'PY'
          import json
          from pathlib import Path
          aud = json.loads(Path('dados-br/auditoria-publicos.json').read_text(encoding='utf-8'))
          det = json.loads(Path('dados-br/jogos-detalhes.json').read_text(encoding='utf-8'))
          est = json.loads(Path('dados-br/estatisticas-competicao.json').read_text(encoding='utf-8'))
          assert isinstance(aud.get('partidas_fisicas_sem_publico'), list)
          assert isinstance(det.get('jogos'), dict)
          publico = est.get('publico') or {}
          resumo = est.get('resumo') or {}
          assert isinstance(publico.get('ranking'), list), 'estatisticas-competicao.publico.ranking ausente/inválido'
          assert int(resumo.get('jogos_finalizados') or 0) == int(aud.get('total_jogos_finalizados') or 0), 'finalizados divergentes entre estatísticas e auditoria de público'
          assert int(resumo.get('jogos_com_publico') or 0) == int(aud.get('total_com_publico_ou_complemento') or 0), 'cobertura de público divergente'
          assert int(resumo.get('jogos_com_renda') or 0) == int(aud.get('total_com_renda') or 0), 'cobertura de renda divergente'
          assert int(resumo.get('jogos_com_publico') or 0) > 0
          print(
              'Cobertura após coleta: '
              f"{aud.get('total_partidas_fisicas_com_publico')}/{aud.get('total_partidas_fisicas')} partidas físicas; "
              f"renda {resumo.get('jogos_com_renda')}/{resumo.get('jogos_finalizados')}"
          )
          PY

      - name: Resumir tentativa
        if: always()
        env:
          NOVOS: ${{ steps.coleta.outputs.novos }}
        shell: bash
        run: |
          {
            echo "## Públicos do Brasileirão"
            echo ""
            if [[ "${NOVOS:-false}" == "true" ]]; then
              echo "- **Resultado:** novos públicos encontrados e derivados atualizados"
            else
              echo "- **Resultado:** nenhuma informação nova; snapshot preservado"
            fi
            echo ""
            echo "### Camada de IA"
            echo ""
            echo '```'
            if [[ -s /tmp/camada-ia.log ]]; then
              tail -n 40 /tmp/camada-ia.log
            else
              echo "camada de IA não produziu saída"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Commitar públicos novos e o estado da camada de IA
        id: publish
        env:
          NOVOS_PUBLICOS: ${{ steps.coleta.outputs.novos }}
        # Commita também quando NÃO houve público novo: o contador de tentativas
        # da camada de IA precisa persistir, senão o marcador de "esgotado" nunca
        # avança e o orquestrador redispara este workflow para sempre.
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=(
            "dados-br/publicos-complementares.json"
            "dados-br/estado-publicos-ia.json"
            "dados-br/auditoria-publicos.json"
            "dados-br/jogos-detalhes.json"
            "dados-br/estatisticas-competicao.json"
          )

          if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "Origin já contém o mesmo conteúdo."
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          for f in "${FILES[@]}"; do
            mkdir -p "$TMP_DIR/$(dirname "$f")"
            cp -a "$f" "$TMP_DIR/$f"
          done

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            for f in "${FILES[@]}"; do
              mkdir -p "$(dirname "$f")"
              cp -a "$TMP_DIR/$f" "$f"
            done
            if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
              echo "Origin/main já possui os novos públicos."
              exit 0
            fi
            git add -- "${FILES[@]}"
            if [[ "${NOVOS_PUBLICOS:-false}" == "true" ]]; then
              MSG="Atualizar públicos do Brasileirão - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')"
            else
              MSG="Registrar tentativa da camada de IA de público - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')"
            fi
            git commit -m "$MSG"
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "ERRO: push dos públicos falhou após 5 tentativas." >&2
          exit 1

      - name: Disparar deploy após público publicado
        if: ${{ steps.publish.outputs.published == 'true' && steps.coleta.outputs.novos == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
          echo "Deploy disparado para os novos públicos."
