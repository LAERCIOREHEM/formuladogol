name: Atualizar públicos do Brasileirão
run-name: Públicos · ${{ inputs.modo || 'automatico' }} · ${{ inputs.event_id || 'geral' }}

on:
  # Sem schedule próprio. O orquestrador dispara somente quando existe partida
  # FINAL com lacuna de público/renda e o backoff da pendência venceu.
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo da coleta: automático, partida específica ou backlog"
        required: true
        default: automatico
        type: choice
        options:
          - automatico
          - partida
          - backlog
      event_id:
        description: "event_id ESPN (obrigatório no modo partida)"
        required: false
        default: ''
        type: string
      reabrir_esgotados:
        description: "Compatibilidade: zerar manualmente o backoff de público/renda (normalmente desnecessário no schema v2)"
        type: boolean
        default: false
      dry_run:
        description: 'Testar coleta sem publicar arquivos'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-write-main
  cancel-in-progress: false

jobs:
  atualizar:
    name: Completar público/renda pendentes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar main mais recente
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar coletor e artefatos
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/atualizar_publicos_brasileirao.py \
            scripts/completar_publicos_ia.py \
            scripts/gerar_estatisticas_competicao_brasileirao.py
          python scripts/atualizar_publicos_brasileirao.py --self-test
          python scripts/completar_publicos_ia.py --self-test
          python -m json.tool resultados.json >/dev/null
          python -m json.tool dados-br/jogos-detalhes.json >/dev/null
          python -m json.tool dados-br/publicos-complementares.json >/dev/null
          python -m json.tool dados-br/auditoria-publicos.json >/dev/null

      - name: Buscar lacunas de público e renda
        id: coleta
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PUBLICOS_MODEL: ${{ vars.OPENAI_PUBLICOS_MODEL || vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          REABRIR: ${{ inputs.reabrir_esgotados }}
          MODO: ${{ inputs.modo || 'automatico' }}
          EVENT_ID: ${{ inputs.event_id }}
        run: |
          set -euo pipefail
          cp dados-br/publicos-complementares.json /tmp/publicos-antes.json

          case "${MODO:-automatico}" in automatico|partida|backlog) ;; *) echo "::error::Modo inválido: $MODO"; exit 2 ;; esac
          if [[ "${MODO:-automatico}" == "partida" && -z "${EVENT_ID:-}" ]]; then
            echo "::error::O modo partida exige event_id."
            exit 2
          fi

          # Fluxo correto: coletor determinístico PRIMEIRO; IA somente como fallback
          # para o que continuar faltando. A IA usa web_search amplo e obrigatório,
          # validando a URL efetivamente lida sem se limitar a uma lista fixa de domínios.
          if [[ "${REABRIR:-false}" == "true" ]]; then
            python scripts/completar_publicos_ia.py --reabrir-esgotados --dry-run >/dev/null 2>&1 || true
            python - <<'PY'
          import json, pathlib
          caminho = pathlib.Path('dados-br/estado-publicos-ia.json')
          try:
              estado = json.loads(caminho.read_text(encoding='utf-8'))
          except Exception:
              estado = {}
          alvo = __import__('os').environ.get('EVENT_ID', '').strip()
          jogos = estado.get('jogos') if isinstance(estado.get('jogos'), dict) else {}
          if alvo:
              jogos.pop(alvo, None)
              estado['jogos'] = jogos
              print(f'Backoff zerado somente para {alvo}.')
          else:
              estado['jogos'] = {}
              print('Backoff zerado para todas as pendências.')
          estado['esgotados'] = []
          caminho.write_text(json.dumps(estado, ensure_ascii=False, indent=2) + "\n", encoding='utf-8')
          PY
          fi

          # Fonte documental determinística/primária. Em modo partida o coletor
          # fica preso ao event_id escolhido; nenhuma lacuna antiga compete com ele.
          DET_CMD=(python scripts/atualizar_publicos_brasileirao.py --max-rodadas 3)
          if [[ "${MODO:-automatico}" == "partida" ]]; then
            DET_CMD+=(--event-id "$EVENT_ID" --max-rodadas 1)
          fi
          "${DET_CMD[@]}"

          IA_CMD=(python scripts/completar_publicos_ia.py --grace-horas 0.5 --modo "${MODO:-automatico}")
          case "${MODO:-automatico}" in
            partida) IA_CMD+=(--event-id "$EVENT_ID" --max-jogos 1) ;;
            automatico) IA_CMD+=(--max-jogos 1) ;;
            backlog) IA_CMD+=(--max-jogos 10) ;;
          esac

          set +e
          "${IA_CMD[@]}" 2>&1 | tee /tmp/camada-ia.log
          IA_RC=${PIPESTATUS[0]}
          set -e

          if [[ "$IA_RC" != "0" ]]; then
            echo "Camada de IA terminou com codigo $IA_RC; seguindo com o deterministico."
          fi
          if grep -q "OPENAI_API_KEY ausente" /tmp/camada-ia.log; then
            echo "::error::OPENAI_API_KEY nao chegou ao runner. Cadastre em Settings > Secrets and variables > Actions > Repository secrets."
          fi

          # A camada de IA grava complementos e propaga para jogos-detalhes, mas
          # não reescreve a auditoria. Sem esta reconsolidação (offline, sem rede)
          # auditoria-publicos.json fica defasada e as asserções de cobertura da
          # etapa seguinte acusam divergência.
          python scripts/atualizar_publicos_brasileirao.py --sem-rede

          NOVOS="$(python - <<'PY'
          import json
          antes = json.load(open('/tmp/publicos-antes.json', encoding='utf-8'))
          depois = json.load(open('dados-br/publicos-complementares.json', encoding='utf-8'))
          mudou = (antes.get('jogos') or {}) != (depois.get('jogos') or {})
          print('true' if mudou else 'false')
          PY
          )"
          echo "novos=$NOVOS" >> "$GITHUB_OUTPUT"
          if [[ "$NOVOS" == "true" ]]; then
            echo "Há público novo; atualizando somente os derivados necessários."
          else
            echo "Nenhum público novo encontrado nesta tentativa. O snapshot publicado não será tocado."
          fi

      - name: Regenerar somente a visão de público das Estatísticas
        if: steps.coleta.outputs.novos == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # O próprio coletor já propagou os novos números para jogos-detalhes.json
          # sem reconsultar a ESPN e sem mexer na auditoria técnica dos detalhes.
          python scripts/gerar_estatisticas_competicao_brasileirao.py
          python - <<'PY'
          import json
          from pathlib import Path
          aud = json.loads(Path('dados-br/auditoria-publicos.json').read_text(encoding='utf-8'))
          det = json.loads(Path('dados-br/jogos-detalhes.json').read_text(encoding='utf-8'))
          est = json.loads(Path('dados-br/estatisticas-competicao.json').read_text(encoding='utf-8'))
          assert isinstance(aud.get('partidas_fisicas_sem_publico'), list)
          assert isinstance(aud.get('sem_renda'), list), 'auditoria-publicos.sem_renda ausente'
          assert isinstance(det.get('jogos'), dict)
          publico = est.get('publico') or {}
          resumo = est.get('resumo') or {}
          assert isinstance(publico.get('ranking'), list), 'estatisticas-competicao.publico.ranking ausente/inválido'
          assert int(resumo.get('jogos_finalizados') or 0) == int(aud.get('total_jogos_finalizados') or 0), 'finalizados divergentes entre estatísticas e auditoria de público'
          assert int(resumo.get('jogos_com_publico') or 0) == int(aud.get('total_com_publico_ou_complemento') or 0), 'cobertura de público divergente'
          assert int(resumo.get('jogos_com_renda') or 0) == int(aud.get('total_com_renda') or 0), 'cobertura de renda divergente'
          assert int(resumo.get('jogos_com_publico') or 0) > 0
          print(
              'Cobertura após coleta: '
              f"{aud.get('total_partidas_fisicas_com_publico')}/{aud.get('total_partidas_fisicas')} partidas físicas; "
              f"renda {resumo.get('jogos_com_renda')}/{resumo.get('jogos_finalizados')}"
          )
          PY

      - name: Resumir tentativa
        if: always()
        env:
          NOVOS: ${{ steps.coleta.outputs.novos }}
          MODO: ${{ inputs.modo || 'automatico' }}
          EVENT_ID: ${{ inputs.event_id }}
        shell: bash
        run: |
          {
            echo "## Públicos do Brasileirão"
            echo ""
            echo "- **Modo:** \`${MODO:-automatico}\`"
            if [[ -n "${EVENT_ID:-}" ]]; then echo "- **event_id alvo:** \`$EVENT_ID\`"; fi
            if [[ "${NOVOS:-false}" == "true" ]]; then
              echo "- **Resultado:** novos dados encontrados e derivados atualizados"
            else
              echo "- **Resultado:** nenhuma informação nova; snapshot preservado"
            fi
            echo ""
            echo "### Diagnóstico OpenAI/Web Search"
          } >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          prefix = 'FDG_DIAGNOSTICO_JSON='
          log = pathlib.Path('/tmp/camada-ia.log').read_text(encoding='utf-8', errors='replace') if pathlib.Path('/tmp/camada-ia.log').exists() else ''
          rows = [line[len(prefix):] for line in log.splitlines() if line.startswith(prefix)]
          if not rows:
              print('- Diagnóstico estruturado: **indisponível**')
          else:
              try:
                  d = json.loads(rows[-1])
              except Exception:
                  print('- Diagnóstico estruturado: **inválido**')
              else:
                  print(f"- OpenAI chamada: **{'SIM' if d.get('openai_called') else 'NÃO'}**")
                  if d.get('model'): print(f"- Modelo: `{d.get('model')}`")
                  print(f"- Web Search: **{'SIM' if d.get('web_search') else 'NÃO'}**")
                  print(f"- Buscas executadas: **{int(d.get('web_search_calls') or 0)}**")
                  print(f"- Referências retornadas: **{int(d.get('source_rows') or 0)}**")
                  print(f"- Resultado: **{d.get('resultado') or 'sem diagnóstico'}**")
                  queries = d.get('search_queries') or []
                  if queries:
                      print('- Consultas realmente executadas:')
                      for q in queries[:12]: print(f"  - `{q}`")
                  urls = d.get('urls') or []
                  if urls:
                      print('- Fontes efetivamente retornadas/lidas:')
                      for url in urls[:12]: print(f"  - {url}")
                  rejeitados = d.get('rejeitados') or []
                  if rejeitados:
                      print('- Rejeições/ausências:')
                      for row in rejeitados[:10]:
                          print(f"  - `{row.get('event_id') or '?'}`: {'; '.join(row.get('motivos') or [])}")
          PY

          {
            echo ""
            echo "### Log final da camada de IA"
            echo '```'
            if [[ -s /tmp/camada-ia.log ]]; then tail -n 35 /tmp/camada-ia.log; else echo "camada de IA não produziu saída"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Commitar públicos novos e o estado da camada de IA
        id: publish
        env:
          NOVOS_PUBLICOS: ${{ steps.coleta.outputs.novos }}
        # Commita também quando NÃO houve dado novo: o estado por campo contém o
        # próximo backoff de público/renda e evita consultas em loop, sem abandonar
        # definitivamente nenhuma lacuna documental.
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=(
            "dados-br/publicos-complementares.json"
            "dados-br/estado-publicos-ia.json"
            "dados-br/auditoria-publicos.json"
            "dados-br/jogos-detalhes.json"
            "dados-br/estatisticas-competicao.json"
          )

          if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "Origin já contém o mesmo conteúdo."
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          for f in "${FILES[@]}"; do
            mkdir -p "$TMP_DIR/$(dirname "$f")"
            cp -a "$f" "$TMP_DIR/$f"
          done

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            for f in "${FILES[@]}"; do
              mkdir -p "$(dirname "$f")"
              cp -a "$TMP_DIR/$f" "$f"
            done
            if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
              echo "Origin/main já possui os novos públicos."
              exit 0
            fi
            git add -- "${FILES[@]}"
            if [[ "${NOVOS_PUBLICOS:-false}" == "true" ]]; then
              MSG="Atualizar públicos do Brasileirão - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')"
            else
              MSG="Registrar tentativa da camada de IA de público - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')"
            fi
            git commit -m "$MSG"
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "ERRO: push dos públicos falhou após 5 tentativas." >&2
          exit 1

      - name: Disparar deploy após público publicado
        if: ${{ steps.publish.outputs.published == 'true' && steps.coleta.outputs.novos == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
          echo "Deploy disparado para os novos públicos."
