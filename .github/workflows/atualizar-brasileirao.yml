name: Atualizar Brasileirao (ESPN)

on:
  # Execução operacional exclusiva por workflow_dispatch. O cron-job.org
  # chama este mesmo gatilho; o botão "Run workflow" continua disponível.
  # Não há schedule interno nem push automático, evitando execuções duplicadas.
  workflow_dispatch:
    inputs:
      forcar_af:
        description: 'Uso excepcional: refazer o AF mesmo sem mudança; normalmente deixe desmarcado'
        required: false
        default: false
        type: boolean
      reconstruir_fontes:
        description: 'Reconstruir a temporada completa das três copas (uso excepcional)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

# GRUPO GLOBAL DE ESCRITA (repo-write-main) — o mesmo dos demais workflows
# que dao git push no main. Serializa as escritas -> zero corrida de push.
concurrency:
  group: repo-write-main
  cancel-in-progress: false
  queue: max

jobs:
  atualizar:
    name: Buscar dados ESPN e publicar JSONs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-af-previsao.txt

      - name: Instalar dependências do AF-Previsão e coleta web
        run: python -m pip install --disable-pip-version-check -r requirements-af-previsao.txt

      - name: Mostrar horario da execucao
        run: |
          echo "Horario UTC:"
          date -u '+%d/%m/%Y %H:%M:%S UTC'
          echo "Horario Brasilia:"
          TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M:%S BRT'

      - name: Validar sintaxe e parsers estatísticos
        run: |
          python -m py_compile \
            atualizar_espn.py \
            fontes_brasileirao.py \
            scripts/atualizar_transmissoes_tv_brasileirao.py \
            scripts/gerar_agenda_clubes_brasileirao.py \
            scripts/gerenciar_status_brasileirao.py \
            scripts/gerar_auditoria_calendario.py \
            scripts/buscar_lideres_jogadores_espn.py \
            scripts/atualizar_publicos_brasileirao.py \
            scripts/buscar_detalhes_jogos_brasileirao.py \
            scripts/gerar_estatisticas_brasileirao.py \
            scripts/gerar_estatisticas_competicao_brasileirao.py \
            scripts/gerar_auditoria_estatisticas_brasileirao.py \
            scripts/af_previsao_backtest.py \
            scripts/af_previsao_continental.py \
            scripts/atualizar_competicoes_af_previsao.py \
            scripts/validar_python_embutido_workflow.py \
            scripts/gerar_probabilidades_brasileirao.py \
            scripts/reconciliar_af_continental.py \
            scripts/gerar_probabilidades_jogos.py \
            scripts/gerar_acuracia_af_previsao.py \
            scripts/gerar_balanco_acuracia_temporada.py \
            scripts/avaliar_af_previsao.py \
            scripts/gerar_analise_copa_do_brasil.py \
            scripts/buscar_melhores_momentos_copa_do_brasil.py \
            scripts/validar_artefatos_analises.py
          python scripts/validar_python_embutido_workflow.py --self-test
          python scripts/validar_python_embutido_workflow.py .github/workflows/atualizar-brasileirao.yml
          python atualizar_espn.py --selftest
          python fontes_brasileirao.py --selftest
          python scripts/atualizar_transmissoes_tv_brasileirao.py --selftest
          python scripts/gerar_agenda_clubes_brasileirao.py --self-test
          python scripts/gerenciar_status_brasileirao.py --selftest
          python scripts/gerar_auditoria_calendario.py --self-test
          python scripts/buscar_lideres_jogadores_espn.py --self-test
          python scripts/atualizar_publicos_brasileirao.py --self-test
          python scripts/buscar_detalhes_jogos_brasileirao.py --self-test
          python scripts/gerar_auditoria_estatisticas_brasileirao.py --self-test
          python scripts/atualizar_competicoes_af_previsao.py --self-test
          python scripts/af_previsao_continental.py --self-test
          python scripts/gerar_probabilidades_brasileirao.py --self-test
          python scripts/gerar_probabilidades_jogos.py --self-test
          python scripts/gerar_acuracia_af_previsao.py --self-test
          python scripts/gerar_balanco_acuracia_temporada.py --self-test
          python scripts/avaliar_af_previsao.py --self-test
          python scripts/gerar_analise_copa_do_brasil.py --self-test
          python scripts/buscar_melhores_momentos_copa_do_brasil.py --self-test
          python scripts/validar_artefatos_analises.py
          python -m json.tool dados-br/config-transmissoes-tv.json > /dev/null
          python -m json.tool dados-br/auditoria-transmissoes-tv.json > /dev/null
          python -m json.tool dados-br/publicos-complementares.json > /dev/null

      - name: Registrar estado esportivo anterior do AF-Previsão
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          arquivos = {
              'tabela': 'tabela.json',
              'resultados': 'resultados.json',
              'calendario': 'dados-br/calendario-completo.json',
              'copa_do_brasil': 'dados-br/competicoes-af-previsao/copa-do-brasil.json',
              'libertadores': 'dados-br/competicoes-af-previsao/libertadores.json',
              'sul_americana': 'dados-br/competicoes-af-previsao/sul-americana.json',
              'config': 'dados-br/config-af-previsao.json',
              'bolao': 'dados-br/participantes-bolao-classificacao.json',
          }

          def carregar(caminho):
              path = Path(caminho)
              if not path.exists():
                  return None
              data = json.loads(path.read_text(encoding='utf-8'))
              if caminho == 'tabela.json':
                  return data.get('tabela') or []
              if caminho == 'resultados.json':
                  return data.get('resultados') or []
              if caminho.endswith('calendario-completo.json'):
                  return data.get('partidas') or data.get('jogos') or []
              if 'competicoes-af-previsao' in caminho:
                  return {
                      'status': data.get('status'),
                      'competicao': data.get('competicao'),
                      'fase_atual': data.get('fase_atual'),
                      'eventos': data.get('eventos') or [],
                  }
              return data

          estado = {chave: carregar(caminho) for chave, caminho in arquivos.items()}
          bruto = json.dumps(estado, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          digest = hashlib.sha256(bruto).hexdigest()
          Path('/tmp/af_estado_antes.sha256').write_text(digest, encoding='utf-8')
          print(f'Estado anterior do AF: {digest}')
          PY

      - name: Congelar probabilidades pré-jogo para auditoria
        shell: bash
        run: |
          # Não bloqueia a atualização esportiva: em caso de problema, o último
          # histórico válido permanece intacto e o workflow segue normalmente.
          if ! python scripts/gerar_acuracia_af_previsao.py --capturar-pre-jogo; then
            echo "::warning title=Acurácia preservada::Falha ao congelar probabilidades pré-jogo; o último histórico válido será mantido."
          fi

      # --- DADOS DO BRASILEIRAO ---
      # A ESPN permanece como fonte principal. Somente quando a auditoria não
      # fecha, o coletor tenta summary ESPN, CBF oficial, API-Football opcional
      # e, por último, override manual. Os quatro JSONs são gravados juntos.
      - name: Atualizar tabela, jogos, resultados e eventos
        id: espn
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_LEAGUE_ID: ${{ secrets.API_FOOTBALL_LEAGUE_ID }}
        run: python atualizar_espn.py

      - name: Informar preservação por dessincronia temporária da ESPN
        if: steps.espn.outputs.sincronizado != 'true'
        env:
          ESPN_TENTATIVAS: ${{ steps.espn.outputs.tentativas }}
          ESPN_MOTIVO: ${{ steps.espn.outputs.motivo }}
        run: |
          printf '::warning::A ESPN não sincronizou standings e scoreboard após %s tentativa(s).\n' "${ESPN_TENTATIVAS:-0}"
          printf '::warning::%s\n' "${ESPN_MOTIVO:-Motivo não informado pelo coletor.}"
          echo "A base do Brasileirão será preservada; as copas e o AF-Previsão continuarão pela rota independente."

      - name: Registrar alerta de snapshot preservado
        if: steps.espn.outputs.sincronizado != 'true'
        env:
          BR_STATUS: ${{ steps.espn.outputs.status }}
          BR_MOTIVO: ${{ steps.espn.outputs.motivo }}
          BR_FALLBACKS: ${{ steps.espn.outputs.fallbacks }}
          BR_TENTATIVAS: ${{ steps.espn.outputs.tentativas }}
          BR_SINCRONIZADO: ${{ steps.espn.outputs.sincronizado }}
          BR_WORKFLOW: Atualizar Brasileirao (ESPN)
          BR_SITE: Fórmula do Gol
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
        run: python scripts/gerenciar_status_brasileirao.py --from-env --notify

      - name: Gerar auditoria estrutural do calendário
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_auditoria_calendario.py

      - name: Complementar públicos ausentes por fonte documental
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/atualizar_publicos_brasileirao.py

      - name: Buscar incrementalmente estatísticas dos jogos finalizados
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/buscar_detalhes_jogos_brasileirao.py --refresh-hours 48

      - name: Buscar líderes oficiais de gols e assistências
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/buscar_lideres_jogadores_espn.py

      - name: Gerar estatísticas e Ranking Vivo de desempenho
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_estatisticas_brasileirao.py

      - name: Atualizar competições que alteram as vagas continentais
        id: continental
        env:
          FORCAR_AF: ${{ inputs.forcar_af }}
          RECONSTRUIR_FONTES: ${{ inputs.reconstruir_fontes }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            --max-age-minutes 45
            --live-cache-minutes 5
            --live-window-hours 4
            --full-refresh-hours 168
            --past-days 21
            --future-days 120
          )
          if [[ "${FORCAR_AF:-false}" == "true" ]]; then
            ARGS+=(--force --max-age-minutes 0)
          fi
          if [[ "${RECONSTRUIR_FONTES:-false}" == "true" ]]; then
            ARGS+=(--full --force --max-age-minutes 0)
          fi
          python scripts/atualizar_competicoes_af_previsao.py "${ARGS[@]}"

      - name: Impedir publicação com resultado continental vencido e não incorporado
        if: ${{ always() && steps.continental.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json

          with open('dados-br/auditoria-competicoes-af-previsao.json', encoding='utf-8') as handle:
              audit = json.load(handle)
          blocking = list(audit.get('falhas_bloqueantes') or [])
          if blocking:
              raise SystemExit(
                  'ERRO: atualização continental possui pendência factual bloqueante; '
                  'o site não será publicado com probabilidades antigas. ' + ' | '.join(blocking)
              )
          print('Coleta continental sem pendência factual bloqueante.')
          PY

      - name: Gerar agenda dos clubes do Brasileirão
        if: ${{ always() && steps.continental.outcome == 'success' }}
        run: |
          python scripts/gerar_agenda_clubes_brasileirao.py
          python -m json.tool dados-br/agenda-clubes-br.json > /dev/null

      - name: Atualizar transmissões oficiais da agenda
        if: ${{ always() && steps.continental.outcome == 'success' }}
        run: python scripts/atualizar_transmissoes_tv_brasileirao.py

      - name: Verificar se o estado esportivo exige novo AF-Previsão
        if: ${{ always() && steps.continental.outcome == 'success' }}
        id: af_gate
        env:
          FORCAR_AF: ${{ inputs.forcar_af }}
          BR_SINCRONIZADO: ${{ steps.espn.outputs.sincronizado }}
          CONTINENTAL_READY: ${{ steps.continental.outputs.continental_ready }}
          CONTINENTAL_CHANGED: ${{ steps.continental.outputs.continental_changed }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from scripts.gerar_probabilidades_brasileirao import (
              continental_collection_readiness,
              current_publication_freshness,
          )

          arquivos = {
              'tabela': 'tabela.json',
              'resultados': 'resultados.json',
              'calendario': 'dados-br/calendario-completo.json',
              'copa_do_brasil': 'dados-br/competicoes-af-previsao/copa-do-brasil.json',
              'libertadores': 'dados-br/competicoes-af-previsao/libertadores.json',
              'sul_americana': 'dados-br/competicoes-af-previsao/sul-americana.json',
              'config': 'dados-br/config-af-previsao.json',
              'bolao': 'dados-br/participantes-bolao-classificacao.json',
          }

          def carregar(caminho):
              path = Path(caminho)
              if not path.exists():
                  return None
              data = json.loads(path.read_text(encoding='utf-8'))
              if caminho == 'tabela.json':
                  return data.get('tabela') or []
              if caminho == 'resultados.json':
                  return data.get('resultados') or []
              if caminho.endswith('calendario-completo.json'):
                  return data.get('partidas') or data.get('jogos') or []
              if 'competicoes-af-previsao' in caminho:
                  return {
                      'status': data.get('status'),
                      'competicao': data.get('competicao'),
                      'fase_atual': data.get('fase_atual'),
                      'eventos': data.get('eventos') or [],
                  }
              return data

          estado = {chave: carregar(caminho) for chave, caminho in arquivos.items()}
          bruto = json.dumps(estado, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          depois = hashlib.sha256(bruto).hexdigest()
          antes_path = Path('/tmp/af_estado_antes.sha256')
          antes = antes_path.read_text(encoding='utf-8').strip() if antes_path.exists() else ''
          obrigatorios = [
              Path('dados-br/probabilidades-brasileirao.json'),
              Path('dados-br/probabilidades-por-pontuacao.json'),
              Path('dados-br/probabilidades-bolao.json'),
              Path('dados-br/probabilidades-jogos.json'),
          ]
          faltando = any(not item.exists() for item in obrigatorios)
          forcar = str(os.environ.get('FORCAR_AF', '')).lower() == 'true'
          vigencia = current_publication_freshness()
          coleta = continental_collection_readiness(30)
          base_valida = bool(vigencia.get('estado_pronto'))
          continental_pronto = (
              str(os.environ.get('CONTINENTAL_READY', '')).lower() == 'true'
              and bool(coleta.get('pronto'))
          )
          desatualizado = not bool(vigencia.get('atualizado'))
          continental_changed = str(os.environ.get('CONTINENTAL_CHANGED', '')).lower() == 'true'
          solicitado = forcar or faltando or continental_changed or antes != depois or desatualizado
          executar = solicitado and base_valida and continental_pronto
          motivos_vigencia = '; '.join(vigencia.get('motivos') or [])
          motivos_coleta = '; '.join(coleta.get('motivos') or [])

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'run_af={str(executar).lower()}\n')
              output.write(f'run_requested={str(solicitado).lower()}\n')
              output.write(f'base_valida={str(base_valida).lower()}\n')
              output.write(f'continental_pronto={str(continental_pronto).lower()}\n')
              output.write(f'continental_changed={str(os.environ.get("CONTINENTAL_CHANGED", "false")).lower()}\n')
              output.write(f'estado_antes={antes}\n')
              output.write(f'estado_depois={depois}\n')
              output.write(f'af_desatualizado={str(desatualizado).lower()}\n')
              output.write(f'hash_af_esperado={vigencia.get("hash_esperado") or ""}\n')
              output.write(f'hash_af_publicado={vigencia.get("hash_publicado") or ""}\n')

          if not base_valida:
              motivo = 'base local preservada do Brasileirão não passou na auditoria: ' + (motivos_vigencia or 'motivo não informado')
          elif not continental_pronto:
              motivo = 'coleta das copas não foi confirmada: ' + (motivos_coleta or 'motivo não informado')
          elif forcar:
              motivo = 'execução manual com forcar_af=true e coleta continental forçada'
          elif faltando:
              motivo = 'artefato obrigatório ausente'
          elif continental_changed:
              motivo = 'a situação esportiva das competições continentais mudou'
          elif antes != depois:
              motivo = 'resultado, tabela, calendário, competição continental ou configuração mudou'
          elif desatualizado:
              motivo = 'AF publicado não representa o estado atual: ' + (motivos_vigencia or 'divergência detectada')
          else:
              motivo = 'nenhuma mudança esportiva relevante e AF publicado vigente'
          print(f'Executar AF-Previsão: {executar} — {motivo}')
          print(f'Base do Brasileirão sincronizada nesta execução: {os.environ.get("BR_SINCRONIZADO") == "true"}')
          PY

      - name: Reconciliar AF-Previsão com o estado esportivo atual
        if: steps.af_gate.outputs.run_af == 'true'
        id: af_generate
        env:
          FORCAR_AF: ${{ inputs.forcar_af }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--max-attempts 2)
          if [[ "${FORCAR_AF:-false}" == "true" ]]; then
            ARGS+=(--force)
          fi
          python scripts/reconciliar_af_continental.py "${ARGS[@]}"

      - name: Confirmar vigência do AF após a tentativa de geração
        if: steps.af_gate.outputs.run_af == 'true'
        env:
          AF_UPDATED: ${{ steps.af_generate.outputs.af_updated }}
        run: |
          python - <<'PY'
          import os
          from scripts.gerar_probabilidades_brasileirao import current_publication_freshness

          result = current_publication_freshness()
          updated = os.environ.get('AF_UPDATED') == 'true'
          reasons = '; '.join(result.get('motivos') or [])
          if updated and not result.get('atualizado'):
              raise SystemExit(
                  'ERRO: o AF foi marcado como atualizado, mas não corresponde aos dados atuais: '
                  + (reasons or 'divergência sem detalhe')
              )
          if result.get('atualizado'):
              print(
                  'AF vigente confirmado: '
                  f"{result.get('partidas_concluidas_atuais')} concluídos; "
                  f"hash {result.get('hash_esperado')}"
              )
          else:
              print(
                  '::warning title=AF-Previsão pendente de nova tentativa::'
                  + (reasons or 'as fontes auxiliares ainda não estão sincronizadas')
              )
              print('A publicação anterior será preservada e a mudança continental não será commitada isoladamente.')
          PY

      - name: Sincronizar histórico com o AF efetivamente publicado
        if: steps.af_gate.outputs.base_valida == 'true'
        run: python scripts/gerar_probabilidades_brasileirao.py --sincronizar-historico-publicado

      - name: Auditar histórico e preparar avaliação final do AF-Previsão
        if: steps.af_generate.outputs.af_updated == 'true'
        run: python scripts/avaliar_af_previsao.py --strict

      - name: Atualizar melhores momentos oficiais da Copa do Brasil
        if: ${{ steps.continental.outcome == 'success' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/buscar_melhores_momentos_copa_do_brasil.py

      - name: Gerar editorial pós-oitavas da Copa do Brasil no mesmo ciclo
        if: ${{ steps.continental.outcome == 'success' && (steps.af_gate.outputs.run_af != 'true' || steps.af_generate.outcome == 'success') }}
        env:
          OPENAI_API_KEY: ''
        run: |
          set -euo pipefail
          # Determinístico por desenho: publicação do dado esportivo não pode
          # depender de disponibilidade de LLM. Se as oitavas ainda não tiverem
          # terminado, o gerador apenas informa que a fase não está elegível.
          python scripts/gerar_analise_copa_do_brasil.py \
            --sem-ia \
            --falhar-se-snapshot-atrasado \
            --tolerancia-snapshot-horas 4
          python scripts/validar_artefatos_analises.py

      - name: Informar preservação temporária do AF e retentativa automática
        if: steps.af_gate.outputs.run_af == 'true' && steps.af_generate.outputs.af_updated != 'true'
        env:
          AF_REASON: ${{ steps.af_generate.outputs.af_reason }}
        run: |
          printf '::warning::Último AF válido preservado nesta execução: %s\n' "${AF_REASON:-fonte auxiliar temporariamente indisponível}"
          echo "A mudança continental não será publicada sem o AF correspondente."

      - name: Informar preservação do último AF-Previsão
        if: steps.af_gate.outputs.run_af != 'true' && steps.af_gate.outputs.run_requested != 'true'
        run: echo "Nenhuma mudança esportiva relevante; último AF-Previsão válido preservado sem repetir 2 milhões de simulações."

      - name: Informar bloqueio seguro do recálculo
        if: steps.af_gate.outputs.run_requested == 'true' && steps.af_gate.outputs.run_af != 'true'
        run: |
          echo "::warning::O AF precisava de recálculo, mas a base local ou a coleta continental não passou nas travas de segurança."
          echo "Nenhum cenário novo será publicado até todas as fontes necessárias estarem íntegras."

      - name: Gerar estatísticas gerais da competição
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_estatisticas_competicao_brasileirao.py

      - name: Auditar estatísticas do Brasileirão
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_auditoria_estatisticas_brasileirao.py

      - name: Gerar auditoria de cobertura da aba Resultados
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_auditoria_cobertura_resultados.py

      - name: Registrar saúde da atualização e alertar em fallback
        if: steps.espn.outputs.sincronizado == 'true'
        env:
          BR_STATUS: ${{ steps.espn.outputs.status }}
          BR_MOTIVO: ${{ steps.espn.outputs.motivo }}
          BR_FALLBACKS: ${{ steps.espn.outputs.fallbacks }}
          BR_TENTATIVAS: ${{ steps.espn.outputs.tentativas }}
          BR_SINCRONIZADO: ${{ steps.espn.outputs.sincronizado }}
          BR_WORKFLOW: Atualizar Brasileirao (ESPN)
          BR_SITE: Fórmula do Gol
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
        run: python scripts/gerenciar_status_brasileirao.py --from-env --notify

      - name: Atualizar painel de acurácia do AF-Previsão
        if: steps.espn.outputs.sincronizado == 'true'
        shell: bash
        run: |
          if ! python scripts/gerar_acuracia_af_previsao.py --capturar-pre-jogo --atualizar; then
            echo "::warning title=Acurácia preservada::O módulo de acurácia não atualizou; o último estado válido será publicado sem bloquear o Brasileirão."
          fi

      - name: Gerar balanço final da acurácia quando elegível
        if: steps.espn.outputs.sincronizado == 'true'
        shell: bash
        run: |
          set -euo pipefail
          backup="$(mktemp -d)"
          cp -a analises "$backup/analises"
          cp -a dados-br/analises.json "$backup/analises.json"
          cp -a sitemap.xml "$backup/sitemap.xml"
          cp -a news-sitemap.xml "$backup/news-sitemap.xml"
          cp -a feed.xml "$backup/feed.xml"
          restore_editorial() {
            rm -rf analises
            cp -a "$backup/analises" analises
            cp -a "$backup/analises.json" dados-br/analises.json
            cp -a "$backup/sitemap.xml" sitemap.xml
            cp -a "$backup/news-sitemap.xml" news-sitemap.xml
            cp -a "$backup/feed.xml" feed.xml
          }
          if ! python scripts/gerar_balanco_acuracia_temporada.py; then
            restore_editorial
            echo "::warning title=Balanço de acurácia preservado::O editorial final de acurácia não foi atualizado; a publicação esportiva seguirá com o último estado válido."
          elif ! python scripts/validar_artefatos_analises.py; then
            restore_editorial
            echo "::warning title=Editorial de acurácia preservado::A validação editorial falhou; os artefatos anteriores foram restaurados e o Brasileirão seguirá normalmente."
          fi
          rm -rf "$backup"

      - name: Conferir e validar JSONs gerados
        if: steps.espn.outputs.sincronizado == 'true'
        env:
          CONTINENTAL_CHANGED: ${{ steps.continental.outputs.continental_changed }}
          AF_UPDATED: ${{ steps.af_generate.outputs.af_updated }}
        run: |
          set -euo pipefail
          echo "Arquivos JSON presentes e validos:"
          for arq in tabela.json espn_eventos.json jogos.json resultados.json dados-br/ajustes-calendario.json dados-br/resultados-manuais.json dados-br/publicos-complementares.json dados-br/auditoria-publicos.json dados-br/transmissoes-tv.json dados-br/auditoria-transmissoes-tv.json dados-br/status-atualizacao.json dados-br/calendario-completo.json dados-br/auditoria-calendario.json dados-br/estatisticas.json dados-br/ranking-desempenho.json dados-br/historico-ranking-desempenho.json dados-br/auditoria-ranking-desempenho.json dados-br/jogadores.json dados-br/lideres-jogadores.json dados-br/auditoria-lideres-jogadores.json dados-br/jogos-detalhes.json dados-br/auditoria-jogos-detalhes.json dados-br/estatisticas-competicao.json dados-br/auditoria-estatisticas.json dados-br/auditoria-cobertura-resultados.json dados-br/competicoes-af-previsao/copa-do-brasil.json dados-br/competicoes-af-previsao/libertadores.json dados-br/competicoes-af-previsao/sul-americana.json dados-br/auditoria-competicoes-af-previsao.json dados-br/agenda-clubes-br.json dados-br/probabilidades-brasileirao.json dados-br/probabilidades-por-pontuacao.json dados-br/probabilidades-jogos.json dados-br/auditoria-probabilidades-jogos.json dados-br/probabilidades-bolao.json dados-br/participantes-bolao-classificacao.json dados-br/auditoria-probabilidades.json dados-br/historico-probabilidades.json dados-br/avaliacao-af-previsao.json dados-br/historico-probabilidades-jogos.json dados-br/acuracia-af-previsao.json; do
            if [ ! -f "$arq" ]; then
              echo "ERRO: $arq nao foi gerado."
              exit 1
            fi
            python -m json.tool "$arq" > /dev/null
            echo "  OK   $arq"
          done
          # A fonte principal permanece ESPN; fallbacks pontuais são registrados
          # por evento sem alterar a origem principal do snapshot.
          python - <<'PY'
          import json
          import math
          import os
          from scripts.gerar_probabilidades_brasileirao import (
              continental_snapshots_state_hash,
              load_current_matches,
              load_current_state,
              load_fixtures,
              sporting_fixture_key,
          )
          for arq in ['tabela.json', 'jogos.json', 'resultados.json']:
              d = json.load(open(arq, encoding='utf-8'))
              assert d.get('fonte') == 'ESPN', f'{arq}: fonte nao e ESPN'
          t = json.load(open('tabela.json', encoding='utf-8'))
          assert len(t.get('tabela') or []) == 20, 'tabela sem 20 times'
          j = json.load(open('jogos.json', encoding='utf-8'))
          assert isinstance(j.get('jogos'), list), 'jogos.json sem lista jogos'
          r = json.load(open('resultados.json', encoding='utf-8'))
          e = json.load(open('espn_eventos.json', encoding='utf-8'))
          assert isinstance(r.get('resultados'), list), 'resultados.json sem lista resultados'
          status_ops = json.load(open('dados-br/status-atualizacao.json', encoding='utf-8'))
          assert status_ops.get('status') in {'ok', 'aviso'}, 'status operacional incompatível com publicação sincronizada'
          assert status_ops.get('sincronizado') is True, 'status operacional não reconhece snapshot sincronizado'
          tv = json.load(open('dados-br/transmissoes-tv.json', encoding='utf-8'))
          assert isinstance(tv.get('jogos'), dict), 'transmissoes-tv.json sem mapa de jogos'
          aud_tv = json.load(open('dados-br/auditoria-transmissoes-tv.json', encoding='utf-8'))
          assert isinstance(aud_tv.get('fontes'), dict), 'auditoria de transmissões sem mapa de fontes'
          assert isinstance(aud_tv.get('sem_transmissao'), list), 'auditoria de transmissões sem pendências'
          assert int((aud_tv.get('resumo') or {}).get('jogos_com_transmissao') or 0) == len(tv['jogos']), 'auditoria de transmissões divergente'
          print('  OK   JSONs principais: ESPN como fonte principal; tabela com 20 times')
          stats = json.load(open('dados-br/estatisticas.json', encoding='utf-8'))
          rank = json.load(open('dados-br/ranking-desempenho.json', encoding='utf-8'))
          hist_rank = json.load(open('dados-br/historico-ranking-desempenho.json', encoding='utf-8'))
          assert len(stats.get('clubes') or []) == 20, 'estatisticas.json sem 20 clubes'
          assert len(rank.get('ranking') or []) == 20, 'ranking-desempenho.json sem 20 clubes'
          for item in rank.get('ranking') or []:
              for campo in ['indice_final', 'ataque', 'defesa', 'dominio', 'eficiencia', 'disciplina']:
                  assert campo in item, f'ranking sem campo {campo}'
          snapshots_rank = hist_rank.get('snapshots') or []
          assert hist_rank.get('schema_version') == 1, 'histórico do ranking com schema inválido'
          assert snapshots_rank and snapshots_rank[-1].get('id') == 'atual', 'histórico do ranking sem estado atual'
          assert len({item.get('id') for item in snapshots_rank}) == len(snapshots_rank), 'snapshots repetidos no histórico do ranking'
          for snapshot in snapshots_rank:
              linhas = snapshot.get('ranking') or []
              assert len(linhas) == 20, f"{snapshot.get('id')}: histórico sem 20 clubes"
              assert sorted(int(item.get('pos') or 0) for item in linhas) == list(range(1, 21)), f"{snapshot.get('id')}: posições inválidas"
              jogos_iguais = snapshot.get('jogos_por_clube')
              if jogos_iguais is not None:
                  assert all(int(item.get('jogos') or 0) == int(jogos_iguais) for item in linhas), f"{snapshot.get('id')}: amostras desiguais"
          campos_hist = ['time', 'pos', 'indice_final', 'ataque', 'defesa', 'dominio', 'eficiencia', 'disciplina', 'jogos']
          atual_hist = [{campo: item.get(campo) for campo in campos_hist} for item in snapshots_rank[-1]['ranking']]
          atual_rank = [{campo: item.get(campo) for campo in campos_hist} for item in rank['ranking']]
          assert atual_hist == atual_rank, 'snapshot atual diverge do ranking publicado'
          aud_rank = json.load(open('dados-br/auditoria-ranking-desempenho.json', encoding='utf-8'))
          assert aud_rank.get('clubes_no_ranking') == 20, 'auditoria-ranking sem 20 clubes'
          jogadores = json.load(open('dados-br/jogadores.json', encoding='utf-8'))
          assert isinstance(jogadores.get('artilharia'), list), 'jogadores.json sem artilharia'
          assert isinstance(jogadores.get('assistencias'), list), 'jogadores.json sem assistencias'
          assert isinstance(jogadores.get('participacoes_gol'), list), 'jogadores.json sem participacoes_gol'
          lideres = json.load(open('dados-br/lideres-jogadores.json', encoding='utf-8'))
          assert lideres.get('status') == 'valido', 'lideres-jogadores.json inválido'
          assert len(lideres.get('artilharia') or []) >= 40, 'artilharia completa truncada'
          assert len(lideres.get('assistencias') or []) >= 20, 'assistências completas truncadas'
          assert int(lideres['artilharia'][0].get('gols') or 0) > 0, 'líder de gols inválido'
          assert int(lideres['assistencias'][0].get('assistencias') or 0) > 0, 'líder de assistências inválido'
          assert len(jogadores.get('artilharia') or []) >= 40, 'jogadores.json sem artilharia completa'
          assert len(jogadores.get('assistencias') or []) >= 20, 'jogadores.json sem assistências completas'
          detalhes = json.load(open('dados-br/jogos-detalhes.json', encoding='utf-8'))
          assert isinstance(detalhes.get('jogos'), dict), 'jogos-detalhes.json sem objeto jogos'
          auditoria = json.load(open('dados-br/auditoria-jogos-detalhes.json', encoding='utf-8'))
          assert isinstance(auditoria.get('falhas'), list), 'auditoria-jogos-detalhes.json sem lista falhas'
          assert 'total_com_publico' in auditoria, 'auditoria-jogos-detalhes sem contagem de público'
          auditoria_publicos = json.load(open('dados-br/auditoria-publicos.json', encoding='utf-8'))
          assert isinstance(auditoria_publicos.get('sem_publico'), list), 'auditoria-publicos.json sem lista de pendências'
          assert int(auditoria_publicos.get('total_partidas_fisicas') or 0) > 0, 'auditoria-publicos sem partidas físicas'
          assert int(auditoria_publicos.get('total_partidas_fisicas_com_publico') or 0) + int(auditoria_publicos.get('total_partidas_fisicas_sem_publico') or 0) == int(auditoria_publicos.get('total_partidas_fisicas') or 0), 'auditoria-publicos com cobertura inconsistente'
          assert auditoria.get('total_inconsistencias_eventos') == 0, 'há gols/cartões inconsistentes'
          validados = int(detalhes.get('total_eventos_validados') or 0)
          pendentes = int(detalhes.get('total_eventos_pendentes_detalhes') or 0)
          assert validados + pendentes == detalhes.get('total_jogos'), 'há jogo sem eventos validados ou pendência manual declarada'
          for event_id, item in (detalhes.get('jogos') or {}).items():
              validacao = item.get('validacao_eventos') or {}
              if validacao.get('pendente_detalhes') is not True:
                  continue
              if item.get('resultado_manual') is True:
                  assert validacao.get('resultado_confirmado') is True, f'{event_id}: resultado manual pendente sem confirmação'
                  assert validacao.get('tipo_pendencia') == 'resultado_manual_sem_ficha', f'{event_id}: tipo de pendência manual inválido'
              else:
                  assert validacao.get('tipo_pendencia') == 'ficha_espn_incompleta', f'{event_id}: pendência ESPN sem classificação explícita'
                  assert validacao.get('gols_compativeis') is True, f'{event_id}: gols pendentes contradizem o placar'
                  assert validacao.get('cartoes_compativeis') is True, f'{event_id}: cartões pendentes contradizem o boxscore'
          competicao = json.load(open('dados-br/estatisticas-competicao.json', encoding='utf-8'))
          assert len(competicao.get('gols_por_clube') or []) == 20, 'estatísticas da competição sem 20 clubes'
          assert all(len(item.get('marcadores') or []) >= 5 for item in competicao.get('gols_por_clube') or []), 'há clube com menos de cinco marcadores'
          assert isinstance(competicao.get('sequencias'), dict), 'estatísticas da competição sem sequências'
          assert isinstance(competicao.get('performance_por_partida'), dict), 'estatísticas da competição sem performance'
          auditoria_stats = json.load(open('dados-br/auditoria-estatisticas.json', encoding='utf-8'))
          assert auditoria_stats.get('status') == 'ok', 'auditoria de estatísticas falhou'
          cobertura = json.load(open('dados-br/auditoria-cobertura-resultados.json', encoding='utf-8'))
          assert isinstance(cobertura.get('resumo'), dict), 'auditoria-cobertura-resultados.json sem resumo'
          calendario = json.load(open('dados-br/auditoria-calendario.json', encoding='utf-8'))
          assert isinstance(calendario.get('resumo'), dict), 'auditoria-calendario.json sem resumo'
          resumo_cal = calendario['resumo']
          assert resumo_cal.get('partidas_mapeadas_calendario_completo') == 380, 'calendário não tem 380 partidas'
          assert resumo_cal.get('rodadas_com_10_jogos') == 38, 'calendário não tem 38 rodadas íntegras'
          assert resumo_cal.get('clubes_com_38_jogos') == 20, 'há clube sem 38 jogos'
          assert resumo_cal.get('confrontos_com_ida_e_volta') == 190, 'ida e volta incompletas'
          completo = json.load(open('dados-br/calendario-completo.json', encoding='utf-8'))
          assert completo.get('total_partidas') == 380, 'calendario-completo.json sem 380 partidas'
          competicoes = {}
          for chave, arquivo in {
              'copa_do_brasil': 'dados-br/competicoes-af-previsao/copa-do-brasil.json',
              'libertadores': 'dados-br/competicoes-af-previsao/libertadores.json',
              'sul_americana': 'dados-br/competicoes-af-previsao/sul-americana.json',
          }.items():
              snapshot = json.load(open(arquivo, encoding='utf-8'))
              assert int(snapshot.get('schema_version') or 0) >= 2, f'{arquivo}: normalização continental antiga'
              assert (snapshot.get('competicao') or {}).get('chave') == chave, f'{arquivo}: competição divergente'
              competicoes[chave] = snapshot
          aud_copas = json.load(open('dados-br/auditoria-competicoes-af-previsao.json', encoding='utf-8'))
          assert isinstance(aud_copas.get('competicoes'), list), 'auditoria continental sem competições'

          previsao = json.load(open('dados-br/probabilidades-brasileirao.json', encoding='utf-8'))
          assert previsao.get('status') == 'ok', 'AF-Previsão com status inválido'
          assert previsao.get('base_corrente', {}).get('partidas_totais') == 380, 'AF-Previsão sem 380 partidas'
          assert previsao.get('base_corrente', {}).get('partidas_concluidas') + previsao.get('base_corrente', {}).get('partidas_restantes') == 380, 'AF-Previsão com partição inválida'
          pontos_obj = json.load(open('dados-br/probabilidades-por-pontuacao.json', encoding='utf-8'))
          assert pontos_obj.get('status') == 'ok', 'probabilidades por pontuação inválidas'
          assert pontos_obj.get('simulacoes') == previsao.get('simulacao', {}).get('quantidade'), 'simulações divergentes na tabela por pontuação'
          niveis_pontos = pontos_obj.get('niveis') or []
          assert len(niveis_pontos) >= 7, 'níveis de pontuação insuficientes'
          assert pontos_obj.get('auditoria', {}).get('curvas_monotonicas') is True, 'curvas por pontuação não monotônicas'
          for campo in ['titulo', 'libertadores', 'sul_americana_ou_melhor', 'permanencia']:
              valores = [n.get(campo) for n in niveis_pontos if n.get(campo) is not None]
              assert valores == sorted(valores), f'cortes não monotônicos: {campo}'
              assert all(0 <= int(v) <= 114 for v in valores), f'corte fora da faixa: {campo}'
          clubes_prev = previsao.get('clubes') or []
          assert len(clubes_prev) == 20, 'AF-Previsão sem 20 clubes'
          assert previsao.get('total_previsoes_partidas') == previsao.get('base_corrente', {}).get('partidas_restantes'), 'AF-Previsão sem previsão para todos os jogos restantes'
          assert len(previsao.get('partidas_restantes') or []) == previsao.get('base_corrente', {}).get('partidas_restantes'), 'lista de partidas previstas incompleta'
          # Validação compatível com o schema publicado. O schema legado mantinha
          # uma métrica G6 separada (600%); o modelo continental usa as cinco
          # vagas-base reais definidas no config (G5 = 500%). Em caso de coleta inconsistente, o
          # gerador preserva o snapshot anterior e a trava deve validar a versão
          # preservada — não aplicar a regra de outro schema.
          schema_prev = int(previsao.get('schema_version') or 1)
          config_prev = json.load(open('dados-br/config-af-previsao.json', encoding='utf-8'))
          execucao_cfg = config_prev.get('execucao_2') or {}
          simulacoes_configuradas = int(execucao_cfg.get('simulacoes_monte_carlo') or 2000000)
          zonas_cfg = (execucao_cfg.get('zonas_base') or {})

          def tamanho_faixa(chave, legado):
              faixa = zonas_cfg.get(chave)
              if schema_prev < 2 or not isinstance(faixa, list) or len(faixa) != 2:
                  return legado
              inicio, fim = (int(faixa[0]), int(faixa[1]))
              assert 1 <= inicio <= fim <= 20, f'config AF inválida em {chave}: {faixa}'
              return fim - inicio + 1

          esperados = {
              'campeao': 100,
              'g4': 400,
              'g6': 600,
              'libertadores_base': 100 * tamanho_faixa('libertadores_base', 6),
              'sul_americana_base': 100 * tamanho_faixa('sul_americana_base', 6),
              'rebaixamento': 400,
          }
          for campo, esperado in esperados.items():
              total = sum(float(item['probabilidades_pct'][campo]) for item in clubes_prev)
              assert abs(total - esperado) <= 0.02, (
                  f'AF-Previsão schema {schema_prev}: soma inválida em {campo}: '
                  f'{total}; esperado {esperado}'
              )
          print(f'  OK   Somas AF-Previsão validadas conforme schema {schema_prev}: {esperados}')
          assert all(abs(sum(item.get('distribuicao_posicoes_pct') or []) - 100) <= 0.02 for item in clubes_prev), 'AF-Previsão: distribuição de posições inválida'

          integrado = previsao.get('schema_version', 0) >= 2 and (previsao.get('integracao_continental') or {}).get('status') == 'ok'
          snapshots_prontos = all(snapshot.get('status') == 'ok' and snapshot.get('eventos') for snapshot in competicoes.values())
          if integrado:
              assert snapshots_prontos, 'previsão integrada publicada com snapshots continentais inválidos'
              total_sula = sum(float(item['probabilidades_pct']['sul_americana']) for item in clubes_prev)
              assert abs(total_sula - 600) <= 0.02, f'Sul-Americana integrada não soma 600%: {total_sula}'
              for item in clubes_prev:
                  for campo in ('libertadores', 'sul_americana', 'sem_competicao_continental'):
                      detalhe = (item.get('probabilidades_detalhes') or {}).get(campo) or {}
                      simulacoes_detalhe = int(detalhe.get('simulacoes') or 0)
                      assert simulacoes_detalhe >= 200000, f'{item["clube"]}: detalhe sem amostra probabilística válida em {campo}'
                      if simulacoes_detalhe < simulacoes_configuradas:
                          print(f'::warning::{item["clube"]}: previsão preservada com {simulacoes_detalhe} simulações; a próxima publicação íntegra usará {simulacoes_configuradas}.')
                      assert isinstance(detalhe.get('exibicao'), str), f'{item["clube"]}: exibição ausente em {campo}'
                      ocorrencias = int(detalhe.get('ocorrencias') or 0)
                      percentual = float(item['probabilidades_pct'][campo])
                      assert abs(percentual - 100.0 * ocorrencias / simulacoes_detalhe) <= 0.000001, f'{item["clube"]}: percentual diverge das ocorrências em {campo}'
                      if 0.0 < percentual < 100.0:
                          assert not detalhe['exibicao'].startswith('100'), f'{item["clube"]}: arredondamento criou certeza falsa em {campo}'
                  lib_pct = float(item['probabilidades_pct']['libertadores'])
                  sula_pct = float(item['probabilidades_pct']['sul_americana'])
                  sem_continental_pct = float(item['probabilidades_pct']['sem_competicao_continental'])
                  assert abs(lib_pct + sula_pct + sem_continental_pct - 100.0) <= 0.000001, f'{item["clube"]}: destinos continentais não fecham 100%'
                  if sula_pct > 0.0:
                      assert lib_pct < 100.0, f'{item["clube"]}: Libertadores em 100% com Sul-Americana positiva'
                  decomposicao = item.get('decomposicao_chances') or {}
                  lib = decomposicao.get('libertadores') or {}
                  sula = decomposicao.get('sul_americana') or {}
                  sem_continental = decomposicao.get('sem_competicao_continental') or {}
                  assert abs(float(lib.get('soma_vias_pct', -1)) - float(item['probabilidades_pct']['libertadores'])) <= 0.002, f'{item["clube"]}: vias da Libertadores não fecham'
                  assert abs(float(sula.get('soma_vias_pct', -1)) - float(item['probabilidades_pct']['sul_americana'])) <= 0.002, f'{item["clube"]}: vias da Sul-Americana não fecham'
                  assert abs(float((sem_continental.get('total') or {}).get('percentual_estimado', -1)) - sem_continental_pct) <= 0.000001, f'{item["clube"]}: complemento continental não fecha'
              print('  OK   AF-Previsão continental integrado e decomposto por via')
          else:
              # Estado transitório legítimo: os snapshots continentais podem estar
              # prontos enquanto a previsão publicada é a anterior (schema 1),
              # preservada pelo gerador quando os feeds da ESPN estão fora de
              # sincronia (ex.: resultado entrou em resultados.json mas a tabela
              # oficial ainda não computou os pontos). O estado preservado já é
              # validado acima: status ok, somas fechando e hash íntegro com a
              # auditoria. A integração acontece naturalmente na execução
              # seguinte, quando a ESPN sincroniza.
              if snapshots_prontos and aud_copas.get('status') == 'ok':
                  print('::warning::Snapshots continentais prontos; previsão anterior (schema 1) preservada aguardando sincronização da ESPN. Integração ocorrerá na próxima execução.')
              else:
                  print('::warning::AF-Previsão anterior preservado porque a coleta continental ainda não ficou íntegra')
          aud_prev = json.load(open('dados-br/auditoria-probabilidades.json', encoding='utf-8'))
          assert aud_prev.get('status') == 'ok', 'auditoria do AF-Previsão falhou'
          simulacoes_publicadas = int(aud_prev.get('simulacao', {}).get('quantidade') or 0)
          assert simulacoes_publicadas >= 200000, 'AF-Previsão sem amostra probabilística válida'
          if simulacoes_publicadas < simulacoes_configuradas:
              print(f'::warning::Último AF-Previsão válido preservado com {simulacoes_publicadas} simulações; alvo configurado atual: {simulacoes_configuradas}.')
          else:
              assert simulacoes_publicadas >= simulacoes_configuradas, 'AF-Previsão abaixo da quantidade configurada'
          assert aud_prev.get('simulacao', {}).get('convergencia', {}).get('maior_diferenca_entre_metades_pontos_percentuais', 99) <= 1.0, 'AF-Previsão sem convergência suficiente'
          assert aud_prev.get('hash_entrada') == previsao.get('hash_entrada'), 'hash divergente entre previsão e auditoria'
          if integrado:
              assert aud_prev.get('schema_version', 0) >= 2, 'auditoria integrada em schema antigo'
              assert isinstance(aud_prev.get('integracao_continental'), dict), 'auditoria sem integração continental'
              hash_continental_atual = continental_snapshots_state_hash(competicoes)
              hash_continental_af = str((previsao.get('integracao_continental') or {}).get('hash_snapshots') or '')
              continental_changed = os.environ.get('CONTINENTAL_CHANGED') == 'true'
              af_updated = os.environ.get('AF_UPDATED') == 'true'
              af_cobre_snapshots_atuais = hash_continental_af == hash_continental_atual
              if not af_cobre_snapshots_atuais:
                  if continental_changed and not af_updated:
                      # Estado transacional deliberado: o working tree contém a coleta
                      # nova, porém o bloco de commit exclui esses snapshots enquanto
                      # não existir AF correspondente. Validar o AF antigo contra a
                      # coleta ainda não publicável criava uma falha artificial.
                      print(
                          '::warning::Snapshots continentais novos ainda não serão publicados: '
                          f'AF preservado={hash_continental_af} coleta atual={hash_continental_atual}. '
                          'O commit manterá o último conjunto AF+copas consistente.'
                      )
                  else:
                      raise AssertionError(
                          'AF não foi recalculado com o snapshot continental atual: '
                          f'af={hash_continental_af} atual={hash_continental_atual}'
                      )
              if af_cobre_snapshots_atuais:
                  copa_snapshot = competicoes['copa_do_brasil']
                  copa_resumo = copa_snapshot.get('resumo') or {}
                  copa_fase = copa_snapshot.get('fase_atual') or {}
                  auditoria_integracao = (aud_prev.get('integracao_continental') or {}).get('competicoes') or {}
                  copa_af = auditoria_integracao.get('copa_do_brasil') or {}
                  assert int(copa_af.get('partidas_concluidas_no_ajuste') or -1) == int(copa_resumo.get('finalizados') or 0), (
                      'AF não incorporou todas as partidas concluídas da Copa do Brasil'
                  )
                  # Ao terminar as oitavas, o modelo deve partir dos oito classificados
                  # factuais e recalcular as probabilidades consolidadas dos 20 clubes.
                  if int(copa_fase.get('ordem') or 0) == 600 and int(copa_fase.get('eventos_pendentes') or 0) == 0:
                      ativos = list(copa_af.get('clubes_ativos') or [])
                      assert int(copa_af.get('equipes_ativas') or 0) == 8, 'Copa finalizada nas oitavas sem exatamente 8 classificados no AF'
                      assert len(ativos) == len(set(ativos)) == 8, 'lista de classificados da Copa inválida no AF'
                      assert list(copa_af.get('rodadas_simuladas_tamanhos') or []) == [8, 4, 2, 1], 'estrutura simulada da Copa não parte das oitavas concluídas'
                      print('  OK   Copa do Brasil: 8 classificados factuais incorporados e probabilidades recalculadas')
          probabilidades_jogos = json.load(open('dados-br/probabilidades-jogos.json', encoding='utf-8'))
          auditoria_jogos = json.load(open('dados-br/auditoria-probabilidades-jogos.json', encoding='utf-8'))
          assert probabilidades_jogos.get('schema_version') == 1, 'probabilidades por jogo em schema inesperado'
          assert probabilidades_jogos.get('status') == 'ok', 'probabilidades por jogo com status inválido'
          assert probabilidades_jogos.get('tipo') == 'probabilidades_pre_jogo', 'tipo inválido nas probabilidades por jogo'
          assert isinstance(probabilidades_jogos.get('hash_entrada'), str) and probabilidades_jogos.get('hash_entrada'), 'hash de entrada ausente nas probabilidades por jogo'
          jogos_previstos = probabilidades_jogos.get('jogos') or []
          base_jogos = probabilidades_jogos.get('base_corrente') or {}
          assert int(probabilidades_jogos.get('total_jogos') or -1) == len(jogos_previstos), 'total divergente nas probabilidades por jogo'
          assert int(base_jogos.get('partidas_concluidas') or -1) + len(jogos_previstos) == 380, 'partição inválida nas probabilidades por jogo'
          assert int(base_jogos.get('partidas_restantes') or -1) == len(jogos_previstos), 'base corrente divergente nas probabilidades por jogo'
          # Valida a cobertura pela identidade esportiva estável, não pelo ID
          # transitório da ESPN. O calendário continua sendo a fonte canônica.
          estado_atual = load_current_state(t)
          clubes_permitidos = set(estado_atual.teams)
          concluidos = load_current_matches(e, clubes_permitidos, r)
          ids_concluidos = {str(item.source_id) for item in concluidos}
          chaves_concluidas = {
              sporting_fixture_key(item.round_no, item.home, item.away) for item in concluidos
          }
          restantes, _ = load_fixtures(
              completo, ids_concluidos, clubes_permitidos, concluded_keys=chaves_concluidas
          )
          mapa_restantes = {
              sporting_fixture_key(item.round_no, item.home, item.away): item
              for item in restantes
          }
          assert len(mapa_restantes) == len(restantes), 'calendário restante contém confronto duplicado'

          mapa_jogos = {}
          ids_jogos = []
          for item in jogos_previstos:
              event_id = str(item.get('event_id') or '').strip()
              assert event_id, 'probabilidade pré-jogo sem event_id canônico'
              ids_jogos.append(event_id)
              chave = sporting_fixture_key(
                  int(item.get('rodada') or 0),
                  str(item.get('mandante') or ''),
                  str(item.get('visitante') or ''),
              )
              assert chave not in mapa_jogos, f'confronto duplicado nas probabilidades por jogo: {chave}'
              mapa_jogos[chave] = item
          assert len(ids_jogos) == len(set(ids_jogos)), 'event_id duplicado nas probabilidades por jogo'
          assert set(mapa_jogos) == set(mapa_restantes), (
              'cobertura das probabilidades por jogo diverge do calendário restante; '
              f'faltam={sorted(set(mapa_restantes) - set(mapa_jogos))[:3]} '
              f'sobram={sorted(set(mapa_jogos) - set(mapa_restantes))[:3]}'
          )
          for chave, item in mapa_jogos.items():
              event_id = str(item.get('event_id') or '')
              assert item.get('status') == 'pre_jogo', f'{event_id}: status não é pré-jogo'
              assert item.get('valido_ate') == 'inicio_da_partida', f'{event_id}: validade ausente'
              for bloco_nome in ('probabilidades_pct', 'probabilidades_exibicao_pct'):
                  bloco = item.get(bloco_nome) or {}
                  valores = [float(bloco.get(campo)) for campo in ('mandante', 'empate', 'visitante')]
                  assert all(math.isfinite(valor) and 0 <= valor <= 100 for valor in valores), f'{event_id}: probabilidade inválida em {bloco_nome}'
                  assert abs(sum(valores) - 100.0) <= 1e-9, f'{event_id}: {bloco_nome} não soma 100%'
              taxas = item.get('gols_esperados') or {}
              assert all(math.isfinite(float(taxas.get(campo))) and float(taxas.get(campo)) > 0 for campo in ('mandante', 'visitante')), f'{event_id}: taxa de gols inválida'
          assert auditoria_jogos.get('status') == 'ok', 'auditoria das probabilidades por jogo falhou'
          assert auditoria_jogos.get('hash_entrada') == probabilidades_jogos.get('hash_entrada'), 'hash de entrada divergente na auditoria por jogo'
          import hashlib
          payload_hash = hashlib.sha256(json.dumps(probabilidades_jogos, ensure_ascii=False, sort_keys=True, separators=(',', ':'), allow_nan=False).encode('utf-8')).hexdigest()
          assert auditoria_jogos.get('hash_saida') == payload_hash, 'hash de saída divergente na auditoria por jogo'
          assert int((auditoria_jogos.get('validacoes') or {}).get('jogos') or -1) == len(jogos_previstos), 'auditoria por jogo com cobertura divergente'
          print(f'  OK   Probabilidades pré-jogo: {len(jogos_previstos)} partidas; V/E/D fecham 100%')

          bolao = json.load(open('dados-br/probabilidades-bolao.json', encoding='utf-8'))
          participantes_bolao = json.load(open('dados-br/participantes-bolao-classificacao.json', encoding='utf-8'))
          assert bolao.get('status') == 'ok', 'projeção do bolão com status inválido'
          assert int(bolao.get('simulacoes') or 0) >= 200000, 'projeção do bolão sem amostra probabilística válida'
          nomes_config = {item.get('nome') for item in (participantes_bolao.get('participantes') or [])}
          linhas_bolao = bolao.get('participantes') or []
          assert len(linhas_bolao) == len(nomes_config) >= 2, 'projeção do bolão com participantes incompletos'
          assert {item.get('nome') for item in linhas_bolao} == nomes_config, 'nomes divergentes na projeção do bolão'
          soma_titulo_bolao = sum(float(item.get('chance_titulo_pct') or 0) for item in linhas_bolao)
          assert abs(soma_titulo_bolao - 100.0) <= 0.02, f'chances do bolão não somam 100%: {soma_titulo_bolao}'
          assert all(0 <= float(item.get('chance_top3_pct') or 0) <= 100 for item in linhas_bolao), 'chance top 3 inválida'
          assert all(0 <= float(item.get('chance_nao_pagar_pct') or 0) <= 100 for item in linhas_bolao), 'chance de não pagar inválida'
          print(f'  OK   AF-Previsão do bolão: {len(linhas_bolao)} participantes; título soma {soma_titulo_bolao:.6f}%')
          hist_prev = json.load(open('dados-br/historico-probabilidades.json', encoding='utf-8'))
          assert hist_prev.get('total_snapshots', 0) >= 1, 'histórico do AF-Previsão vazio'
          assert hist_prev.get('schema_version', 0) >= 4, 'histórico sem deduplicação por resultado e referência por clube'
          estado_publicado = hist_prev.get('estado_publicado') or {}
          assert estado_publicado.get('hash_entrada') == previsao.get('hash_entrada'), (
              'histórico não referencia a publicação corrente: '
              f"historico={estado_publicado.get('hash_entrada')} previsao={previsao.get('hash_entrada')}"
          )
          assert estado_publicado.get('hash_estado_esportivo'), 'histórico sem hash do estado de resultados concluídos'
          estados_historicos = [item.get('hash_estado_esportivo') for item in (hist_prev.get('snapshots') or [])]
          assert all(estados_historicos) and len(estados_historicos) == len(set(estados_historicos)), 'histórico contém estados esportivos repetidos'
          integridade_hist = hist_prev.get('integridade') or {}
          assert integridade_hist.get('encadeamento_valido') is True, 'histórico sem integridade declarada'
          assert integridade_hist.get('hash_final') == (hist_prev.get('snapshots') or [])[-1].get('hash_snapshot'), 'hash final do histórico divergente'
          avaliacao = json.load(open('dados-br/avaliacao-af-previsao.json', encoding='utf-8'))
          assert avaliacao.get('status') in {'coletando_historico', 'aguardando_resultados_continentais', 'avaliacao_concluida', 'avaliacao_concluida_amostra_reduzida'}, 'status inválido da avaliação AF'
          assert (avaliacao.get('integridade_historico') or {}).get('valido') is True, 'avaliação detectou histórico inválido'
          assert (avaliacao.get('integridade_historico') or {}).get('encadeado') is True, 'avaliação não reconheceu a cadeia do histórico'
          historico_jogos = json.load(open('dados-br/historico-probabilidades-jogos.json', encoding='utf-8'))
          acuracia = json.load(open('dados-br/acuracia-af-previsao.json', encoding='utf-8'))
          assert historico_jogos.get('schema_version') == 1, 'histórico pré-jogo em schema inválido'
          assert isinstance(historico_jogos.get('previsoes'), list), 'histórico pré-jogo sem previsões'
          assert (historico_jogos.get('criterio') or {}).get('nao_reconstroi_passado') is True, 'histórico pré-jogo sem trava retrospectiva'
          assert acuracia.get('status') == 'ok', 'painel de acurácia inválido'
          assert (acuracia.get('escopo_publico') or {}).get('avaliacao_alvo') == 'resultado_v_e_d', 'painel de acurácia fora do alvo V/E/D'
          assert (acuracia.get('escopo_publico') or {}).get('avaliacao_jogo_individual_publica') is False, 'painel não deve expor acurácia jogo a jogo'
          assert isinstance(acuracia.get('timeline_clubes'), dict) and len(acuracia.get('timeline_clubes') or {}) == 20, 'timeline de acurácia sem 20 clubes'
          print('  OK   Acurácia AF-Previsão: histórico pré-jogo, calibração agregada e timeline por clube')
          print('  OK   Estatísticas, calendário e AF-Previsão gerados')
          PY

      - name: Validar atualização independente das copas e do AF
        if: steps.espn.outputs.sincronizado != 'true'
        env:
          CONTINENTAL_READY: ${{ steps.continental.outputs.continental_ready }}
          CONTINENTAL_CHANGED: ${{ steps.continental.outputs.continental_changed }}
          AF_UPDATED: ${{ steps.af_generate.outputs.af_updated }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.gerar_probabilidades_brasileirao import current_publication_freshness

          def load(path):
              with open(path, encoding='utf-8') as handle:
                  return json.load(handle)

          status = load('dados-br/status-atualizacao.json')
          assert status.get('sincronizado') is False, 'status preservado deveria registrar sincronizado=false'

          ready = os.environ.get('CONTINENTAL_READY') == 'true'
          changed = os.environ.get('CONTINENTAL_CHANGED') == 'true'
          af_updated = os.environ.get('AF_UPDATED') == 'true'
          if not ready:
              print('Coleta continental não confirmada: somente o status operacional poderá ser publicado.')
              raise SystemExit(0)

          files = [
              'dados-br/competicoes-af-previsao/copa-do-brasil.json',
              'dados-br/competicoes-af-previsao/libertadores.json',
              'dados-br/competicoes-af-previsao/sul-americana.json',
              'dados-br/auditoria-competicoes-af-previsao.json',
              'dados-br/agenda-clubes-br.json',
          ]
          for path in files:
              assert Path(path).exists(), f'arquivo obrigatório ausente: {path}'
              load(path)
          audit = load('dados-br/auditoria-competicoes-af-previsao.json')
          assert audit.get('status') == 'ok' and audit.get('coleta_confiavel') is True, 'auditoria continental não está confiável'
          assert len(audit.get('competicoes') or []) == 3, 'auditoria continental incompleta'

          if changed and not af_updated:
              # NAO e erro. E o estado de preservacao previsto pelo proprio
              # workflow, e ele ja esta tratado corretamente logo adiante:
              #
              #  - o passo "Commitar copas e AF mesmo com Brasileirao preservado"
              #    tem a condicao
              #        CONTINENTAL_CHANGED != true || AF_UPDATED == true
              #    ou seja, neste exato cenario ele JA exclui os snapshots das
              #    copas da lista de arquivos e publica somente o
              #    status-atualizacao.json;
              #  - o passo "Informar preservacao temporaria do AF e retentativa
              #    automatica" ja emite ::warning:: dizendo que a mudanca
              #    continental nao sera publicada sem o AF correspondente.
              #
              # Antes, este SystemExit derrubava o job ANTES desses passos
              # rodarem. Resultado: a protecao nunca era exercida, o
              # status-atualizacao.json tambem deixava de ser commitado e a
              # execucao inteira aparecia como falha vermelha — mesmo com o
              # sistema tendo se comportado exatamente como projetado.
              #
              # A causa de fundo aqui e o ESPN nao ter sincronizado nesta
              # execucao (este bloco so roda quando sincronizado != true). Sem
              # base do Brasileirao atualizada, o gerador se recusa — com razao —
              # a publicar um AF novo. A proxima execucao resolve sozinha.
              print(
                  '::warning title=Copas mudaram sem AF correspondente::'
                  'A situacao esportiva das copas mudou, mas o AF nao pode ser gerado '
                  'nesta execucao (base do Brasileirao nao sincronizada). Os novos '
                  'snapshots NAO serao publicados isoladamente; a publicacao anterior '
                  'e preservada e a proxima execucao refaz a tentativa.'
              )
              print('Atualizacao independente validada: changed=True, af_updated=False (preservacao).')
              raise SystemExit(0)
          if af_updated:
              freshness = current_publication_freshness()
              assert freshness.get('atualizado') is True, '; '.join(freshness.get('motivos') or [])
              probabilities = load('dados-br/probabilidades-brasileirao.json')
              coverage = (probabilities.get('integracao_continental') or {}).get('cobertura') or {}
              assert coverage.get('todas_consideradas') is True, 'AF novo sem cobertura declarada das três copas'
              assert len(coverage.get('competicoes') or []) == 3, 'cobertura continental incompleta no AF novo'
          print(f'Atualização independente validada: changed={changed}, af_updated={af_updated}.')
          PY

      - name: Commitar copas e AF mesmo com Brasileirão preservado
        id: publish_independent
        if: steps.espn.outputs.sincronizado != 'true'
        env:
          CONTINENTAL_READY: ${{ steps.continental.outputs.continental_ready }}
          CONTINENTAL_CHANGED: ${{ steps.continental.outputs.continental_changed }}
          AF_UPDATED: ${{ steps.af_generate.outputs.af_updated }}
        shell: bash
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=(
            "dados-br/status-atualizacao.json"
            "dados-br/historico-probabilidades-jogos.json"
            "dados-br/acuracia-af-previsao.json"
          )
          if [[ "${CONTINENTAL_READY:-false}" == "true" ]]; then
            if [[ "${CONTINENTAL_CHANGED:-false}" != "true" || "${AF_UPDATED:-false}" == "true" ]]; then
              FILES+=(
                "dados-br/competicoes-af-previsao/copa-do-brasil.json"
                "dados-br/competicoes-af-previsao/libertadores.json"
                "dados-br/competicoes-af-previsao/sul-americana.json"
                "dados-br/auditoria-competicoes-af-previsao.json"
                "dados-br/agenda-clubes-br.json"
                "dados-br/transmissoes-tv.json"
                "dados-br/auditoria-transmissoes-tv.json"
              )
            fi
          fi
          if [[ "${AF_UPDATED:-false}" == "true" ]]; then
            FILES+=(
              "dados-br/probabilidades-brasileirao.json"
              "dados-br/probabilidades-por-pontuacao.json"
              "dados-br/probabilidades-jogos.json"
              "dados-br/auditoria-probabilidades-jogos.json"
              "dados-br/probabilidades-bolao.json"
              "dados-br/auditoria-probabilidades.json"
              "dados-br/historico-probabilidades.json"
              "dados-br/avaliacao-af-previsao.json"
            )
          fi

          EXISTING=()
          for f in "${FILES[@]}"; do
            [[ -e "$f" ]] && EXISTING+=("$f")
          done
          FILES=("${EXISTING[@]}")
          if [[ ${#FILES[@]} -eq 0 ]] || [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "Sem mudanças independentes para publicar."
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          for f in "${FILES[@]}"; do
            mkdir -p "$TMP_DIR/$(dirname "$f")"
            cp -a "$f" "$TMP_DIR/$f"
          done

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            for f in "${FILES[@]}"; do
              rm -rf "$f"
              mkdir -p "$(dirname "$f")"
              cp -a "$TMP_DIR/$f" "$f"
            done
            if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
              echo "Outro run já publicou os mesmos artefatos."
              exit 0
            fi
            git add -- "${FILES[@]}"
            git commit -m "Atualizar copas e AF-Previsão - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')"
            if git push origin HEAD:main; then
              echo "Push independente concluído na tentativa $i."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "ERRO: push independente falhou após 5 tentativas."
          exit 1

      # Estrategia de push ROBUSTA E PADRONIZADA (modelo melhores-momentos):
      # guarda os artefatos gerados -> fetch + reset --hard origin/main ->
      # reaplica os arquivos -> commit -> push. Nunca gera conflito artificial
      # de rebase em arquivos-artefato, mesmo sob concorrencia real.
      - name: Commitar JSONs juntos com push robusto
        id: publish_main
        if: steps.espn.outputs.sincronizado == 'true'
        env:
          CONTINENTAL_READY: ${{ steps.continental.outputs.continental_ready }}
          CONTINENTAL_CHANGED: ${{ steps.continental.outputs.continental_changed }}
          AF_UPDATED: ${{ steps.af_generate.outputs.af_updated }}
        shell: bash
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # O bloco do Brasileirão pode ser publicado mesmo se uma fonte auxiliar
          # falhar. Já snapshots continentais esportivamente novos só seguem junto
          # do AF que os incorporou; isso impede JSONs matematicamente contraditórios.
          FILES=(
            "tabela.json"
            "espn_eventos.json"
            "jogos.json"
            "resultados.json"
            "dados-br/transmissoes-tv.json"
            "dados-br/auditoria-transmissoes-tv.json"
            "dados-br/status-atualizacao.json"
            "dados-br/historico-probabilidades-jogos.json"
            "dados-br/acuracia-af-previsao.json"
            "dados-br/estatisticas.json"
            "dados-br/ranking-desempenho.json"
            "dados-br/historico-ranking-desempenho.json"
            "dados-br/auditoria-ranking-desempenho.json"
            "dados-br/jogadores.json"
            "dados-br/lideres-jogadores.json"
            "dados-br/auditoria-lideres-jogadores.json"
            "dados-br/publicos-complementares.json"
            "dados-br/auditoria-publicos.json"
            "dados-br/jogos-detalhes.json"
            "dados-br/auditoria-jogos-detalhes.json"
            "dados-br/estatisticas-competicao.json"
            "dados-br/auditoria-estatisticas.json"
            "dados-br/auditoria-cobertura-resultados.json"
            "dados-br/calendario-completo.json"
            "dados-br/auditoria-calendario.json"
            "analises"
            "dados-br/analises.json"
            "dados-br/historico-probabilidades-continentais.json"
            "dados-br/melhores-momentos-copa-do-brasil.json"
            "sitemap.xml"
            "news-sitemap.xml"
            "feed.xml"
          )

          if [[ "${CONTINENTAL_READY:-false}" == "true" ]]; then
            if [[ "${CONTINENTAL_CHANGED:-false}" != "true" || "${AF_UPDATED:-false}" == "true" ]]; then
              FILES+=(
                "dados-br/competicoes-af-previsao/copa-do-brasil.json"
                "dados-br/competicoes-af-previsao/libertadores.json"
                "dados-br/competicoes-af-previsao/sul-americana.json"
                "dados-br/auditoria-competicoes-af-previsao.json"
                "dados-br/agenda-clubes-br.json"
              )
            else
              echo "::warning::Mudança nas copas não será publicada sem o AF correspondente."
            fi
          fi

          if [[ "${AF_UPDATED:-false}" == "true" ]]; then
            FILES+=(
              "dados-br/probabilidades-brasileirao.json"
              "dados-br/probabilidades-por-pontuacao.json"
              "dados-br/probabilidades-jogos.json"
              "dados-br/auditoria-probabilidades-jogos.json"
              "dados-br/probabilidades-bolao.json"
              "dados-br/auditoria-probabilidades.json"
              "dados-br/historico-probabilidades.json"
              "dados-br/avaliacao-af-previsao.json"
            )
          fi

          EXISTING=()
          for f in "${FILES[@]}"; do
            [[ -e "$f" ]] && EXISTING+=("$f")
          done
          FILES=("${EXISTING[@]}")

          if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "Sem mudancas nos JSONs - nada a commitar."
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          for f in "${FILES[@]}"; do
            if [[ -e "$f" ]]; then
              mkdir -p "$TMP_DIR/$(dirname "$f")"
              cp -a "$f" "$TMP_DIR/$f"
            fi
          done

          for i in 1 2 3 4 5; do
            echo "Tentativa de push $i/5..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            for f in "${FILES[@]}"; do
              if [[ -e "$TMP_DIR/$f" ]]; then
                rm -rf "$f"
                mkdir -p "$(dirname "$f")"
                cp -a "$TMP_DIR/$f" "$f"
              fi
            done

            if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
              echo "Apos atualizar com origin/main, nada mudou - sem commit."
              exit 0
            fi

            git add -- "${FILES[@]}"
            git commit -m "Atualizar dados auditados do Brasileirao - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')"

            if git push origin HEAD:main; then
              echo "Push OK na tentativa $i."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rejeitado na tentativa $i; recalculando sobre origin/main mais recente..."
            sleep 3
          done

          echo "ERRO: Push falhou apos 5 tentativas."
          exit 1

      - name: Disparar deploy após publicação válida
        if: >-
          steps.publish_main.outputs.published == 'true' ||
          steps.publish_independent.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # O push acima é autenticado com GITHUB_TOKEN e, por proteção contra
          # recursão do GitHub Actions, não cria outro workflow por evento push.
          # deploy.yml aceita workflow_dispatch, portanto o acionamos
          # explicitamente após o commit ter sido publicado no main.
          gh workflow run deploy.yml --ref main
          echo "Deploy do site disparado para o main recém-publicado."

      - name: Disparar editoriais somente após publicação válida
        if: >-
          steps.publish_main.outputs.published == 'true' ||
          steps.publish_independent.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # IMPORTANTE: não dispare os dois workflows editoriais ao mesmo tempo.
          # Todos os workflows que escrevem no main usam repo-write-main.
          # A Copa é o primeiro elo e encadeia a análise da rodada ao concluir.
          gh workflow run publicar-analise-copa-do-brasil.yml --ref main -f encadear_rodada=true
          echo "Editorial da Copa disparado; ele encadeará o editorial da rodada ao concluir."

  # Alerta integrado ao próprio workflow. Substitui o antigo workflow
  # "Monitorar Atualizar Brasileirao" e evita uma execução cinza a cada hora.
  alertar_falha:
    name: Avisar falha sem publicar artefatos
    needs: atualizar
    if: ${{ always() && needs.atualizar.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o main mais recente
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar status crítico e enviar e-mail
        env:
          BR_STATUS: erro
          BR_MOTIVO: O job principal do workflow Atualizar Brasileirão terminou com conclusão '${{ needs.atualizar.result }}'. O último snapshot íntegro permanece publicado.
          BR_FALLBACKS: '[]'
          BR_TENTATIVAS: '0'
          BR_SINCRONIZADO: 'false'
          BR_WORKFLOW: Atualizar Brasileirao (ESPN)
          BR_SITE: Fórmula do Gol
          BR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BR_SOURCE_RUN_ID: ${{ github.run_id }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
        run: python scripts/gerenciar_status_brasileirao.py --from-env --notify

