name: Atualizar Brasileirao (ESPN)

on:
  # Execução operacional exclusiva por workflow_dispatch. O orquestrador
  # inteligente chama este gatilho quando existe trabalho esportivo real;
  # o botão "Run workflow" continua disponível para uso excepcional.
  workflow_dispatch:
    inputs:
      forcar_af:
        description: 'Uso excepcional: refazer o AF mesmo sem mudança; normalmente deixe desmarcado'
        required: false
        default: false
        type: boolean
      reconstruir_fontes:
        description: 'Reconstruir a temporada completa das três copas (uso excepcional)'
        required: false
        default: false
        type: boolean
      trace_id:
        description: 'Correlation ID interno do ciclo pós-FINAL; normalmente preenchido pelo AF Fastlane'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

# GRUPO GLOBAL DE ESCRITA (repo-write-main) — o mesmo dos demais workflows
# que dao git push no main. Serializa as escritas -> zero corrida de push.
concurrency:
  group: repo-write-main
  cancel-in-progress: false
  queue: max

jobs:
  atualizar:
    name: Buscar dados ESPN e publicar JSONs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FDG_TRACE_ID: ${{ inputs.trace_id }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-af-previsao.txt

      - name: Instalar dependências do AF-Previsão e coleta web
        run: python -m pip install --disable-pip-version-check -r requirements-af-previsao.txt

      - name: Mostrar horario da execucao
        run: |
          echo "Horario UTC:"
          date -u '+%d/%m/%Y %H:%M:%S UTC'
          echo "Horario Brasilia:"
          TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M:%S BRT'

      - name: Validar sintaxe e parsers estatísticos
        run: |
          python -m py_compile \
            atualizar_espn.py \
            scripts/fdg_reliability.py \
            scripts/validar_snapshot_esportivo.py \
            scripts/validar_publicacao_brasileirao.py \
            scripts/registrar_slo_confiabilidade.py \
            scripts/gerar_estado_confiabilidade.py \
            fontes_brasileirao.py \
            scripts/atualizar_transmissoes_tv_brasileirao.py \
            scripts/gerar_agenda_clubes_brasileirao.py \
            scripts/gerenciar_status_brasileirao.py \
            scripts/gerar_auditoria_calendario.py \
            scripts/buscar_lideres_jogadores_espn.py \
            scripts/atualizar_publicos_brasileirao.py \
            scripts/buscar_detalhes_jogos_brasileirao.py \
            scripts/gerar_estatisticas_brasileirao.py \
            scripts/gerar_estatisticas_competicao_brasileirao.py \
            scripts/gerar_auditoria_estatisticas_brasileirao.py \
            scripts/af_previsao_backtest.py \
            scripts/af_previsao_continental.py \
            scripts/atualizar_competicoes_af_previsao.py \
            scripts/validar_python_embutido_workflow.py \
            scripts/gerar_probabilidades_brasileirao.py \
            scripts/gerar_marcos_af_previsao.py \
            scripts/reconciliar_af_continental.py \
            scripts/gerar_probabilidades_jogos.py \
            scripts/gerar_acuracia_af_previsao.py \
            scripts/gerar_balanco_acuracia_temporada.py \
            scripts/avaliar_af_previsao.py \
            scripts/gerar_analise_copa_do_brasil.py \
            scripts/buscar_melhores_momentos_copa_do_brasil.py \
            scripts/auditoria_ia_diaria.py \
            scripts/validar_artefatos_analises.py \
            scripts/detectar_mudanca_material.py
          python scripts/validar_python_embutido_workflow.py --self-test
          python scripts/validar_python_embutido_workflow.py .github/workflows/atualizar-brasileirao.yml
          python atualizar_espn.py --selftest
          python fontes_brasileirao.py --selftest
          python scripts/atualizar_transmissoes_tv_brasileirao.py --selftest
          python scripts/gerar_agenda_clubes_brasileirao.py --self-test
          python scripts/gerenciar_status_brasileirao.py --selftest
          python scripts/gerar_auditoria_calendario.py --self-test
          python scripts/buscar_lideres_jogadores_espn.py --self-test
          python scripts/atualizar_publicos_brasileirao.py --self-test
          python scripts/buscar_detalhes_jogos_brasileirao.py --self-test
          python scripts/gerar_auditoria_estatisticas_brasileirao.py --self-test
          python scripts/atualizar_competicoes_af_previsao.py --self-test
          python scripts/af_previsao_continental.py --self-test
          python scripts/gerar_probabilidades_brasileirao.py --self-test
          python scripts/gerar_marcos_af_previsao.py --self-test
          python scripts/gerar_probabilidades_jogos.py --self-test
          python scripts/gerar_acuracia_af_previsao.py --self-test
          python scripts/gerar_balanco_acuracia_temporada.py --self-test
          python scripts/avaliar_af_previsao.py --self-test
          python scripts/gerar_analise_copa_do_brasil.py --self-test
          python scripts/buscar_melhores_momentos_copa_do_brasil.py --self-test
          python scripts/auditoria_ia_diaria.py --self-test
          python scripts/validar_artefatos_analises.py
          python scripts/detectar_mudanca_material.py --self-test
          python -m json.tool dados-br/config-transmissoes-tv.json > /dev/null
          python -m json.tool dados-br/auditoria-transmissoes-tv.json > /dev/null
          python -m json.tool dados-br/publicos-complementares.json > /dev/null

      - name: Registrar estado esportivo anterior do AF-Previsão
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          arquivos = {
              'tabela': 'tabela.json',
              'resultados': 'resultados.json',
              'calendario': 'dados-br/calendario-completo.json',
              'copa_do_brasil': 'dados-br/competicoes-af-previsao/copa-do-brasil.json',
              'libertadores': 'dados-br/competicoes-af-previsao/libertadores.json',
              'sul_americana': 'dados-br/competicoes-af-previsao/sul-americana.json',
              'config': 'dados-br/config-af-previsao.json',
              'bolao': 'dados-br/participantes-bolao-classificacao.json',
          }

          def carregar(caminho):
              path = Path(caminho)
              if not path.exists():
                  return None
              data = json.loads(path.read_text(encoding='utf-8'))
              if caminho == 'tabela.json':
                  return data.get('tabela') or []
              if caminho == 'resultados.json':
                  return data.get('resultados') or []
              if caminho.endswith('calendario-completo.json'):
                  return data.get('partidas') or data.get('jogos') or []
              if 'competicoes-af-previsao' in caminho:
                  return {
                      'status': data.get('status'),
                      'competicao': data.get('competicao'),
                      'fase_atual': data.get('fase_atual'),
                      'eventos': data.get('eventos') or [],
                  }
              return data

          estado = {chave: carregar(caminho) for chave, caminho in arquivos.items()}
          bruto = json.dumps(estado, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          digest = hashlib.sha256(bruto).hexdigest()
          Path('/tmp/af_estado_antes.sha256').write_text(digest, encoding='utf-8')
          print(f'Estado anterior do AF: {digest}')
          PY

      - name: Congelar probabilidades pré-jogo para auditoria
        shell: bash
        run: |
          # Não bloqueia a atualização esportiva: em caso de problema, o último
          # histórico válido permanece intacto e o workflow segue normalmente.
          if ! python scripts/gerar_acuracia_af_previsao.py --capturar-pre-jogo; then
            echo "::warning title=Acurácia preservada::Falha ao congelar probabilidades pré-jogo; o último histórico válido será mantido."
          fi

      # --- DADOS DO BRASILEIRAO ---
      # A ESPN permanece como fonte principal. Somente quando a auditoria não
      # fecha, o coletor tenta summary ESPN, CBF oficial, API-Football opcional
      # e, por último, override manual. Os quatro JSONs são gravados juntos.
      - name: Atualizar tabela, jogos, resultados e eventos
        id: espn
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_LEAGUE_ID: ${{ secrets.API_FOOTBALL_LEAGUE_ID }}
        run: python atualizar_espn.py

      - name: Informar preservação por dessincronia temporária da ESPN
        if: steps.espn.outputs.sincronizado != 'true' && steps.material_independent.outputs.changed == 'true'
        env:
          ESPN_TENTATIVAS: ${{ steps.espn.outputs.tentativas }}
          ESPN_MOTIVO: ${{ steps.espn.outputs.motivo }}
          ESPN_SOURCE_STATE: ${{ steps.espn.outputs.source_state }}
          ESPN_SOURCE_REASON: ${{ steps.espn.outputs.source_reason }}
        run: |
          printf '::warning::A ESPN não sincronizou standings e scoreboard após %s tentativa(s).\n' "${ESPN_TENTATIVAS:-0}"
          printf '::warning::Estado estruturado da fonte: %s / %s\n' "${ESPN_SOURCE_STATE:-unknown}" "${ESPN_SOURCE_REASON:-unknown}"
          printf '::warning::%s\n' "${ESPN_MOTIVO:-Motivo não informado pelo coletor.}"
          echo "A base do Brasileirão será preservada; as copas e o AF-Previsão continuarão pela rota independente."

      - name: Registrar alerta de snapshot preservado
        if: steps.espn.outputs.sincronizado != 'true'
        env:
          BR_STATUS: ${{ steps.espn.outputs.status }}
          BR_MOTIVO: ${{ steps.espn.outputs.motivo }}
          BR_FALLBACKS: ${{ steps.espn.outputs.fallbacks }}
          BR_TENTATIVAS: ${{ steps.espn.outputs.tentativas }}
          BR_SINCRONIZADO: ${{ steps.espn.outputs.sincronizado }}
          BR_SOURCE_STATE: ${{ steps.espn.outputs.source_state }}
          BR_SOURCE_REASON: ${{ steps.espn.outputs.source_reason }}
          BR_SNAPSHOT_PRESERVED: ${{ steps.espn.outputs.snapshot_preserved }}
          BR_SOURCE_SURFACES: ${{ steps.espn.outputs.source_surfaces }}
          BR_WORKFLOW: Atualizar Brasileirao (ESPN)
          BR_SITE: Fórmula do Gol
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
        run: python scripts/gerenciar_status_brasileirao.py --from-env --notify

      - name: Gerar auditoria estrutural do calendário
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_auditoria_calendario.py

      - name: Buscar incrementalmente estatísticas dos jogos finalizados
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/buscar_detalhes_jogos_brasileirao.py --refresh-hours 48

      - name: Buscar líderes oficiais de gols e assistências
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/buscar_lideres_jogadores_espn.py

      - name: Gerar estatísticas e Ranking Vivo de desempenho
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_estatisticas_brasileirao.py

      - name: Atualizar competições que alteram as vagas continentais
        id: continental
        env:
          FORCAR_AF: ${{ inputs.forcar_af }}
          RECONSTRUIR_FONTES: ${{ inputs.reconstruir_fontes }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_CONTINENTAL_RESERVE: '12'
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            --max-age-minutes 45
            --live-cache-minutes 5
            --live-window-hours 4
            --full-refresh-hours 168
            --past-days 21
            --future-days 120
          )
          if [[ "${FORCAR_AF:-false}" == "true" ]]; then
            ARGS+=(--force --max-age-minutes 0)
          fi
          if [[ "${RECONSTRUIR_FONTES:-false}" == "true" ]]; then
            ARGS+=(--full --force --max-age-minutes 0)
          fi
          python scripts/atualizar_competicoes_af_previsao.py "${ARGS[@]}"

      - name: Isolar pendência continental sem derrubar o Brasileirão
        if: ${{ always() && steps.continental.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json

          with open('dados-br/auditoria-competicoes-af-previsao.json', encoding='utf-8') as handle:
              audit = json.load(handle)
          blocking = list(audit.get('falhas_bloqueantes') or [])
          if blocking:
              print(
                  '::warning title=AF continental preservado::'
                  'Há resultado continental provavelmente encerrado ainda sem confirmação. '
                  'O AF não será recalculado nem os novos snapshots das copas serão publicados '
                  'até a fonte fechar, mas tabela/resultados/estatísticas do Brasileirão seguem normalmente. '
                  + ' | '.join(blocking)
              )
          else:
              print('Coleta continental sem pendência factual bloqueante.')
          PY

      - name: Gerar agenda dos clubes do Brasileirão
        if: ${{ always() && steps.continental.outcome == 'success' }}
        run: |
          python scripts/gerar_agenda_clubes_brasileirao.py
          python -m json.tool dados-br/agenda-clubes-br.json > /dev/null

      - name: Verificar se o estado esportivo exige novo AF-Previsão
        if: ${{ always() && steps.continental.outcome == 'success' }}
        id: af_gate
        env:
          FORCAR_AF: ${{ inputs.forcar_af }}
          BR_SINCRONIZADO: ${{ steps.espn.outputs.sincronizado }}
          CONTINENTAL_READY: ${{ steps.continental.outputs.continental_ready }}
          CONTINENTAL_CHANGED: ${{ steps.continental.outputs.continental_changed }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from scripts.gerar_probabilidades_brasileirao import (
              continental_collection_readiness,
              current_publication_freshness,
          )

          arquivos = {
              'tabela': 'tabela.json',
              'resultados': 'resultados.json',
              'calendario': 'dados-br/calendario-completo.json',
              'copa_do_brasil': 'dados-br/competicoes-af-previsao/copa-do-brasil.json',
              'libertadores': 'dados-br/competicoes-af-previsao/libertadores.json',
              'sul_americana': 'dados-br/competicoes-af-previsao/sul-americana.json',
              'config': 'dados-br/config-af-previsao.json',
              'bolao': 'dados-br/participantes-bolao-classificacao.json',
          }

          def carregar(caminho):
              path = Path(caminho)
              if not path.exists():
                  return None
              data = json.loads(path.read_text(encoding='utf-8'))
              if caminho == 'tabela.json':
                  return data.get('tabela') or []
              if caminho == 'resultados.json':
                  return data.get('resultados') or []
              if caminho.endswith('calendario-completo.json'):
                  return data.get('partidas') or data.get('jogos') or []
              if 'competicoes-af-previsao' in caminho:
                  return {
                      'status': data.get('status'),
                      'competicao': data.get('competicao'),
                      'fase_atual': data.get('fase_atual'),
                      'eventos': data.get('eventos') or [],
                  }
              return data

          estado = {chave: carregar(caminho) for chave, caminho in arquivos.items()}
          bruto = json.dumps(estado, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          depois = hashlib.sha256(bruto).hexdigest()
          antes_path = Path('/tmp/af_estado_antes.sha256')
          antes = antes_path.read_text(encoding='utf-8').strip() if antes_path.exists() else ''
          obrigatorios = [
              Path('dados-br/probabilidades-brasileirao.json'),
              Path('dados-br/probabilidades-por-pontuacao.json'),
              Path('dados-br/probabilidades-bolao.json'),
              Path('dados-br/probabilidades-jogos.json'),
          ]
          faltando = any(not item.exists() for item in obrigatorios)
          forcar = str(os.environ.get('FORCAR_AF', '')).lower() == 'true'
          vigencia = current_publication_freshness()
          coleta = continental_collection_readiness(30)
          base_valida = bool(vigencia.get('estado_pronto'))
          continental_pronto = (
              str(os.environ.get('CONTINENTAL_READY', '')).lower() == 'true'
              and bool(coleta.get('pronto'))
          )
          desatualizado = not bool(vigencia.get('atualizado'))
          continental_changed = str(os.environ.get('CONTINENTAL_CHANGED', '')).lower() == 'true'
          # Se a coleta continental estiver bloqueada por um resultado provavelmente
          # encerrado ainda não confirmado, o AF precisa de nova tentativa, mas
          # somente ele fica congelado. O restante do Brasileirão segue publicável.
          solicitado = (
              forcar or faltando or continental_changed or antes != depois
              or desatualizado or not continental_pronto
          )
          executar = solicitado and base_valida and continental_pronto
          motivos_vigencia = '; '.join(vigencia.get('motivos') or [])
          motivos_coleta = '; '.join(coleta.get('motivos') or [])

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'run_af={str(executar).lower()}\n')
              output.write(f'run_requested={str(solicitado).lower()}\n')
              output.write(f'base_valida={str(base_valida).lower()}\n')
              output.write(f'continental_pronto={str(continental_pronto).lower()}\n')
              output.write(f'continental_changed={str(os.environ.get("CONTINENTAL_CHANGED", "false")).lower()}\n')
              output.write(f'estado_antes={antes}\n')
              output.write(f'estado_depois={depois}\n')
              output.write(f'af_desatualizado={str(desatualizado).lower()}\n')
              output.write(f'hash_af_esperado={vigencia.get("hash_esperado") or ""}\n')
              output.write(f'hash_af_publicado={vigencia.get("hash_publicado") or ""}\n')

          if not base_valida:
              motivo = 'base local preservada do Brasileirão não passou na auditoria: ' + (motivos_vigencia or 'motivo não informado')
          elif not continental_pronto:
              motivo = 'coleta das copas não foi confirmada: ' + (motivos_coleta or 'motivo não informado')
          elif forcar:
              motivo = 'execução manual com forcar_af=true e coleta continental forçada'
          elif faltando:
              motivo = 'artefato obrigatório ausente'
          elif continental_changed:
              motivo = 'a situação esportiva das competições continentais mudou'
          elif antes != depois:
              motivo = 'resultado, tabela, calendário, competição continental ou configuração mudou'
          elif desatualizado:
              motivo = 'AF publicado não representa o estado atual: ' + (motivos_vigencia or 'divergência detectada')
          else:
              motivo = 'nenhuma mudança esportiva relevante e AF publicado vigente'
          print(f'Executar AF-Previsão: {executar} — {motivo}')
          print(f'Base do Brasileirão sincronizada nesta execução: {os.environ.get("BR_SINCRONIZADO") == "true"}')
          PY

      - name: Reconciliar AF-Previsão com o estado esportivo atual
        if: steps.af_gate.outputs.run_af == 'true'
        id: af_generate
        env:
          FORCAR_AF: ${{ inputs.forcar_af }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--max-attempts 2)
          if [[ "${FORCAR_AF:-false}" == "true" ]]; then
            ARGS+=(--force)
          fi
          python scripts/reconciliar_af_continental.py "${ARGS[@]}"

      - name: Confirmar vigência do AF após a tentativa de geração
        if: steps.af_gate.outputs.run_af == 'true'
        env:
          AF_UPDATED: ${{ steps.af_generate.outputs.af_updated }}
        run: |
          python - <<'PY'
          import os
          from scripts.gerar_probabilidades_brasileirao import current_publication_freshness

          result = current_publication_freshness()
          updated = os.environ.get('AF_UPDATED') == 'true'
          reasons = '; '.join(result.get('motivos') or [])
          if updated and not result.get('atualizado'):
              raise SystemExit(
                  'ERRO: o AF foi marcado como atualizado, mas não corresponde aos dados atuais: '
                  + (reasons or 'divergência sem detalhe')
              )
          if result.get('atualizado'):
              print(
                  'AF vigente confirmado: '
                  f"{result.get('partidas_concluidas_atuais')} concluídos; "
                  f"hash {result.get('hash_esperado')}"
              )
          else:
              print(
                  '::warning title=AF-Previsão pendente de nova tentativa::'
                  + (reasons or 'as fontes auxiliares ainda não estão sincronizadas')
              )
              print('A publicação anterior será preservada e a mudança continental não será commitada isoladamente.')
          PY

      - name: Sincronizar histórico com o AF efetivamente publicado
        if: steps.af_gate.outputs.base_valida == 'true'
        run: python scripts/gerar_probabilidades_brasileirao.py --sincronizar-historico-publicado

      - name: Atualizar marcos públicos imutáveis do AF-Previsão
        if: steps.af_gate.outputs.base_valida == 'true'
        run: |
          python scripts/gerar_marcos_af_previsao.py
          python scripts/gerar_marcos_af_previsao.py --validar

      - name: Auditar histórico e preparar avaliação final do AF-Previsão
        if: steps.af_generate.outputs.af_updated == 'true'
        run: python scripts/avaliar_af_previsao.py --strict

      - name: Gerar editorial determinístico da fase atual da Copa do Brasil
        if: ${{ steps.continental.outcome == 'success' && (steps.af_gate.outputs.run_af != 'true' || steps.af_generate.outcome == 'success') }}
        env:
          OPENAI_API_KEY: ''
        run: |
          set -euo pipefail
          # Determinístico por desenho: publicação do dado esportivo não pode
          # depender de disponibilidade de LLM. A IA editorial roda somente na
          # auditoria diária centralizada. Se a fase atual ainda não tiver
          # terminado, o gerador apenas informa que ela não está elegível.
          python scripts/gerar_analise_copa_do_brasil.py \
            --sem-ia \
            --falhar-se-snapshot-atrasado \
            --tolerancia-snapshot-horas 4
          python scripts/validar_artefatos_analises.py

      - name: Informar preservação temporária do AF e retentativa automática
        if: steps.af_gate.outputs.run_af == 'true' && steps.af_generate.outputs.af_updated != 'true'
        env:
          AF_REASON: ${{ steps.af_generate.outputs.af_reason }}
        run: |
          printf '::warning::Último AF válido preservado nesta execução: %s\n' "${AF_REASON:-fonte auxiliar temporariamente indisponível}"
          echo "A mudança continental não será publicada sem o AF correspondente."

      - name: Informar preservação do último AF-Previsão
        if: steps.af_gate.outputs.run_af != 'true' && steps.af_gate.outputs.run_requested != 'true'
        run: echo "Nenhuma mudança esportiva relevante; último AF-Previsão válido preservado sem repetir 2 milhões de simulações."

      - name: Informar bloqueio seguro do recálculo
        if: steps.af_gate.outputs.run_requested == 'true' && steps.af_gate.outputs.run_af != 'true'
        run: |
          echo "::warning::O AF precisava de recálculo, mas a base local ou a coleta continental não passou nas travas de segurança."
          echo "Nenhum cenário novo será publicado até todas as fontes necessárias estarem íntegras."

      - name: Gerar estatísticas gerais da competição
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_estatisticas_competicao_brasileirao.py

      - name: Auditar estatísticas do Brasileirão
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_auditoria_estatisticas_brasileirao.py

      - name: Gerar auditoria de cobertura da aba Resultados
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_auditoria_cobertura_resultados.py

      - name: Registrar saúde da atualização e alertar em fallback
        if: steps.espn.outputs.sincronizado == 'true'
        env:
          BR_STATUS: ${{ steps.espn.outputs.status }}
          BR_MOTIVO: ${{ steps.espn.outputs.motivo }}
          BR_FALLBACKS: ${{ steps.espn.outputs.fallbacks }}
          BR_TENTATIVAS: ${{ steps.espn.outputs.tentativas }}
          BR_SINCRONIZADO: ${{ steps.espn.outputs.sincronizado }}
          BR_SOURCE_STATE: ${{ steps.espn.outputs.source_state }}
          BR_SOURCE_REASON: ${{ steps.espn.outputs.source_reason }}
          BR_SNAPSHOT_PRESERVED: ${{ steps.espn.outputs.snapshot_preserved }}
          BR_SOURCE_SURFACES: ${{ steps.espn.outputs.source_surfaces }}
          BR_WORKFLOW: Atualizar Brasileirao (ESPN)
          BR_SITE: Fórmula do Gol
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
        run: python scripts/gerenciar_status_brasileirao.py --from-env --notify

      - name: Atualizar painel de acurácia do AF-Previsão
        if: steps.espn.outputs.sincronizado == 'true'
        shell: bash
        run: |
          if ! python scripts/gerar_acuracia_af_previsao.py --capturar-pre-jogo --atualizar; then
            echo "::warning title=Acurácia preservada::O módulo de acurácia não atualizou; o último estado válido será publicado sem bloquear o Brasileirão."
          fi

      - name: Gerar balanço final da acurácia quando elegível
        if: steps.espn.outputs.sincronizado == 'true'
        shell: bash
        run: |
          set -euo pipefail
          backup="$(mktemp -d)"
          cp -a analises "$backup/analises"
          cp -a dados-br/analises.json "$backup/analises.json"
          cp -a sitemap.xml "$backup/sitemap.xml"
          cp -a news-sitemap.xml "$backup/news-sitemap.xml"
          cp -a feed.xml "$backup/feed.xml"
          restore_editorial() {
            rm -rf analises
            cp -a "$backup/analises" analises
            cp -a "$backup/analises.json" dados-br/analises.json
            cp -a "$backup/sitemap.xml" sitemap.xml
            cp -a "$backup/news-sitemap.xml" news-sitemap.xml
            cp -a "$backup/feed.xml" feed.xml
          }
          if ! python scripts/gerar_balanco_acuracia_temporada.py; then
            restore_editorial
            echo "::warning title=Balanço de acurácia preservado::O editorial final de acurácia não foi atualizado; a publicação esportiva seguirá com o último estado válido."
          elif ! python scripts/validar_artefatos_analises.py; then
            restore_editorial
            echo "::warning title=Editorial de acurácia preservado::A validação editorial falhou; os artefatos anteriores foram restaurados e o Brasileirão seguirá normalmente."
          fi
          rm -rf "$backup"

      - name: Conferir e validar JSONs gerados
        if: steps.espn.outputs.sincronizado == 'true'
        env:
          CONTINENTAL_CHANGED: ${{ steps.continental.outputs.continental_changed }}
          AF_UPDATED: ${{ steps.af_generate.outputs.af_updated }}
        run: |
          set -euo pipefail
          echo "Arquivos JSON presentes e validos:"
          for arq in tabela.json espn_eventos.json jogos.json resultados.json dados-br/ajustes-calendario.json dados-br/resultados-manuais.json dados-br/publicos-complementares.json dados-br/auditoria-publicos.json dados-br/transmissoes-tv.json dados-br/auditoria-transmissoes-tv.json dados-br/status-atualizacao.json dados-br/calendario-completo.json dados-br/auditoria-calendario.json dados-br/estatisticas.json dados-br/ranking-desempenho.json dados-br/historico-ranking-desempenho.json dados-br/auditoria-ranking-desempenho.json dados-br/jogadores.json dados-br/lideres-jogadores.json dados-br/auditoria-lideres-jogadores.json dados-br/jogos-detalhes.json dados-br/auditoria-jogos-detalhes.json dados-br/estatisticas-competicao.json dados-br/auditoria-estatisticas.json dados-br/auditoria-cobertura-resultados.json dados-br/competicoes-af-previsao/copa-do-brasil.json dados-br/competicoes-af-previsao/libertadores.json dados-br/competicoes-af-previsao/sul-americana.json dados-br/auditoria-competicoes-af-previsao.json dados-br/agenda-clubes-br.json dados-br/probabilidades-brasileirao.json dados-br/probabilidades-por-pontuacao.json dados-br/probabilidades-jogos.json dados-br/auditoria-probabilidades-jogos.json dados-br/probabilidades-bolao.json dados-br/participantes-bolao-classificacao.json dados-br/auditoria-probabilidades.json dados-br/historico-probabilidades.json dados-br/marcos-af-previsao.json dados-br/avaliacao-af-previsao.json dados-br/historico-probabilidades-jogos.json dados-br/acuracia-af-previsao.json; do
            if [ ! -f "$arq" ]; then
              echo "ERRO: $arq nao foi gerado."
              exit 1
            fi
            python -m json.tool "$arq" > /dev/null
            echo "  OK   $arq"
          done
          # A fonte principal permanece ESPN; fallbacks pontuais são registrados
          # por evento sem alterar a origem principal do snapshot.
          python scripts/validar_publicacao_brasileirao.py

      - name: Publicar estado CORE / ENRICHMENT do Reliability Control Plane
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_estado_confiabilidade.py --profile full

      - name: Validar atualização independente das copas e do AF
        if: steps.espn.outputs.sincronizado != 'true'
        env:
          CONTINENTAL_READY: ${{ steps.continental.outputs.continental_ready }}
          CONTINENTAL_CHANGED: ${{ steps.continental.outputs.continental_changed }}
          AF_UPDATED: ${{ steps.af_generate.outputs.af_updated }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.gerar_probabilidades_brasileirao import current_publication_freshness

          def load(path):
              with open(path, encoding='utf-8') as handle:
                  return json.load(handle)

          status = load('dados-br/status-atualizacao.json')
          assert status.get('sincronizado') is False, 'status preservado deveria registrar sincronizado=false'

          ready = os.environ.get('CONTINENTAL_READY') == 'true'
          changed = os.environ.get('CONTINENTAL_CHANGED') == 'true'
          af_updated = os.environ.get('AF_UPDATED') == 'true'
          if not ready:
              print('Coleta continental não confirmada: somente o status operacional poderá ser publicado.')
              raise SystemExit(0)

          files = [
              'dados-br/competicoes-af-previsao/copa-do-brasil.json',
              'dados-br/competicoes-af-previsao/libertadores.json',
              'dados-br/competicoes-af-previsao/sul-americana.json',
              'dados-br/auditoria-competicoes-af-previsao.json',
              'dados-br/agenda-clubes-br.json',
          ]
          for path in files:
              assert Path(path).exists(), f'arquivo obrigatório ausente: {path}'
              load(path)
          audit = load('dados-br/auditoria-competicoes-af-previsao.json')
          assert audit.get('status') == 'ok' and audit.get('coleta_confiavel') is True, 'auditoria continental não está confiável'
          assert len(audit.get('competicoes') or []) == 3, 'auditoria continental incompleta'

          if changed and not af_updated:
              # NAO e erro. E o estado de preservacao previsto pelo proprio
              # workflow, e ele ja esta tratado corretamente logo adiante:
              #
              #  - o passo "Commitar copas e AF mesmo com Brasileirao preservado"
              #    tem a condicao
              #        CONTINENTAL_CHANGED != true || AF_UPDATED == true
              #    ou seja, neste exato cenario ele JA exclui os snapshots das
              #    copas da lista de arquivos e publica somente o
              #    status-atualizacao.json;
              #  - o passo "Informar preservacao temporaria do AF e retentativa
              #    automatica" ja emite ::warning:: dizendo que a mudanca
              #    continental nao sera publicada sem o AF correspondente.
              #
              # Antes, este SystemExit derrubava o job ANTES desses passos
              # rodarem. Resultado: a protecao nunca era exercida, o
              # status-atualizacao.json tambem deixava de ser commitado e a
              # execucao inteira aparecia como falha vermelha — mesmo com o
              # sistema tendo se comportado exatamente como projetado.
              #
              # A causa de fundo aqui e o ESPN nao ter sincronizado nesta
              # execucao (este bloco so roda quando sincronizado != true). Sem
              # base do Brasileirao atualizada, o gerador se recusa — com razao —
              # a publicar um AF novo. A proxima execucao resolve sozinha.
              print(
                  '::warning title=Copas mudaram sem AF correspondente::'
                  'A situacao esportiva das copas mudou, mas o AF nao pode ser gerado '
                  'nesta execucao (base do Brasileirao nao sincronizada). Os novos '
                  'snapshots NAO serao publicados isoladamente; a publicacao anterior '
                  'e preservada e a proxima execucao refaz a tentativa.'
              )
              print('Atualizacao independente validada: changed=True, af_updated=False (preservacao).')
              raise SystemExit(0)
          if af_updated:
              freshness = current_publication_freshness()
              assert freshness.get('atualizado') is True, '; '.join(freshness.get('motivos') or [])
              probabilities = load('dados-br/probabilidades-brasileirao.json')
              coverage = (probabilities.get('integracao_continental') or {}).get('cobertura') or {}
              assert coverage.get('todas_consideradas') is True, 'AF novo sem cobertura declarada das três copas'
              assert len(coverage.get('competicoes') or []) == 3, 'cobertura continental incompleta no AF novo'
          print(f'Atualização independente validada: changed={changed}, af_updated={af_updated}.')
          PY

      - name: Detectar mudança material independente
        id: material_independent
        if: steps.espn.outputs.sincronizado != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/detectar_mudanca_material.py --github-output "$GITHUB_OUTPUT" --paths \
            dados-br/competicoes-af-previsao/copa-do-brasil.json \
            dados-br/competicoes-af-previsao/libertadores.json \
            dados-br/competicoes-af-previsao/sul-americana.json \
            dados-br/agenda-clubes-br.json \
            dados-br/transmissoes-tv.json \
            dados-br/probabilidades-brasileirao.json \
            dados-br/probabilidades-por-pontuacao.json \
            dados-br/probabilidades-jogos.json \
            dados-br/probabilidades-bolao.json \
            dados-br/acuracia-af-previsao.json \
            dados-br/marcos-af-previsao.json \
            dados-br/estado-confiabilidade.json dados-br/slo-confiabilidade.json \
            dados-br/analises.json analises sitemap.xml news-sitemap.xml feed.xml

      - name: Detectar mudança material principal
        id: material_main
        if: steps.espn.outputs.sincronizado == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/detectar_mudanca_material.py --github-output "$GITHUB_OUTPUT" --paths \
            tabela.json espn_eventos.json jogos.json resultados.json \
            dados-br/transmissoes-tv.json dados-br/estatisticas.json \
            dados-br/ranking-desempenho.json dados-br/historico-ranking-desempenho.json \
            dados-br/jogadores.json dados-br/lideres-jogadores.json dados-br/jogos-detalhes.json \
            dados-br/estatisticas-competicao.json dados-br/calendario-completo.json \
            dados-br/competicoes-af-previsao/copa-do-brasil.json \
            dados-br/competicoes-af-previsao/libertadores.json \
            dados-br/competicoes-af-previsao/sul-americana.json dados-br/agenda-clubes-br.json \
            dados-br/probabilidades-brasileirao.json dados-br/probabilidades-por-pontuacao.json \
            dados-br/probabilidades-jogos.json dados-br/probabilidades-bolao.json \
            dados-br/acuracia-af-previsao.json dados-br/marcos-af-previsao.json \
            dados-br/estado-confiabilidade.json dados-br/slo-confiabilidade.json \
            dados-br/melhores-momentos-copa-do-brasil.json dados-br/analises.json \
            analises sitemap.xml news-sitemap.xml feed.xml

      - name: Commitar copas e AF mesmo com Brasileirão preservado
        id: publish_independent
        if: steps.espn.outputs.sincronizado != 'true' && steps.material_independent.outputs.changed == 'true'
        env:
          CONTINENTAL_READY: ${{ steps.continental.outputs.continental_ready }}
          CONTINENTAL_CHANGED: ${{ steps.continental.outputs.continental_changed }}
          AF_UPDATED: ${{ steps.af_generate.outputs.af_updated }}
        shell: bash
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=(
            "dados-br/status-atualizacao.json"
            "dados-br/estado-confiabilidade.json"
            "dados-br/slo-confiabilidade.json"
            "dados-br/historico-probabilidades-jogos.json"
            "dados-br/acuracia-af-previsao.json"
            "dados-br/marcos-af-previsao.json"
            "dados-br/analises.json"
          )
          if [[ "${CONTINENTAL_READY:-false}" == "true" ]]; then
            if [[ "${CONTINENTAL_CHANGED:-false}" != "true" || "${AF_UPDATED:-false}" == "true" ]]; then
              FILES+=(
                "dados-br/competicoes-af-previsao/copa-do-brasil.json"
                "dados-br/competicoes-af-previsao/libertadores.json"
                "dados-br/competicoes-af-previsao/sul-americana.json"
                "dados-br/auditoria-competicoes-af-previsao.json"
                "dados-br/agenda-clubes-br.json"
                "dados-br/transmissoes-tv.json"
                "dados-br/auditoria-transmissoes-tv.json"
              )
            fi
          fi
          if [[ "${AF_UPDATED:-false}" == "true" ]]; then
            FILES+=(
              "dados-br/probabilidades-brasileirao.json"
              "dados-br/probabilidades-por-pontuacao.json"
              "dados-br/probabilidades-jogos.json"
              "dados-br/auditoria-probabilidades-jogos.json"
              "dados-br/probabilidades-bolao.json"
              "dados-br/auditoria-probabilidades.json"
              "dados-br/historico-probabilidades.json"
              "dados-br/avaliacao-af-previsao.json"
            )
          fi

          EXISTING=()
          for f in "${FILES[@]}"; do
            [[ -e "$f" ]] && EXISTING+=("$f")
          done
          FILES=("${EXISTING[@]}")
          if [[ ${#FILES[@]} -eq 0 ]] || [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "Sem mudanças independentes para publicar."
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          for f in "${FILES[@]}"; do
            mkdir -p "$TMP_DIR/$(dirname "$f")"
            cp -a "$f" "$TMP_DIR/$f"
          done

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            for f in "${FILES[@]}"; do
              rm -rf "$f"
              mkdir -p "$(dirname "$f")"
              cp -a "$TMP_DIR/$f" "$f"
            done
            if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
              echo "Outro run já publicou os mesmos artefatos."
              exit 0
            fi
            git add -- "${FILES[@]}"
            git commit -m "Atualizar copas e AF-Previsão - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')"
            if git push origin HEAD:main; then
              echo "Push independente concluído na tentativa $i."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "ERRO: push independente falhou após 5 tentativas."
          exit 1

      # Estrategia de push ROBUSTA E PADRONIZADA (modelo melhores-momentos):
      # guarda os artefatos gerados -> fetch + reset --hard origin/main ->
      # reaplica os arquivos -> commit -> push. Nunca gera conflito artificial
      # de rebase em arquivos-artefato, mesmo sob concorrencia real.
      - name: Commitar JSONs juntos com push robusto
        id: publish_main
        if: steps.espn.outputs.sincronizado == 'true' && steps.material_main.outputs.changed == 'true'
        env:
          CONTINENTAL_READY: ${{ steps.continental.outputs.continental_ready }}
          CONTINENTAL_CHANGED: ${{ steps.continental.outputs.continental_changed }}
          AF_UPDATED: ${{ steps.af_generate.outputs.af_updated }}
        shell: bash
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # O bloco do Brasileirão pode ser publicado mesmo se uma fonte auxiliar
          # falhar. Já snapshots continentais esportivamente novos só seguem junto
          # do AF que os incorporou; isso impede JSONs matematicamente contraditórios.
          FILES=(
            "tabela.json"
            "espn_eventos.json"
            "jogos.json"
            "resultados.json"
            "dados-br/transmissoes-tv.json"
            "dados-br/auditoria-transmissoes-tv.json"
            "dados-br/status-atualizacao.json"
            "dados-br/estado-confiabilidade.json"
            "dados-br/slo-confiabilidade.json"
            "dados-br/historico-probabilidades-jogos.json"
            "dados-br/acuracia-af-previsao.json"
            "dados-br/estatisticas.json"
            "dados-br/ranking-desempenho.json"
            "dados-br/historico-ranking-desempenho.json"
            "dados-br/auditoria-ranking-desempenho.json"
            "dados-br/jogadores.json"
            "dados-br/lideres-jogadores.json"
            "dados-br/auditoria-lideres-jogadores.json"
            "dados-br/jogos-detalhes.json"
            "dados-br/auditoria-jogos-detalhes.json"
            "dados-br/estatisticas-competicao.json"
            "dados-br/auditoria-estatisticas.json"
            "dados-br/auditoria-cobertura-resultados.json"
            "dados-br/calendario-completo.json"
            "dados-br/auditoria-calendario.json"
            "analises"
            "dados-br/analises.json"
            "dados-br/historico-probabilidades-continentais.json"
            "dados-br/marcos-af-previsao.json"
            "dados-br/melhores-momentos-copa-do-brasil.json"
            "sitemap.xml"
            "news-sitemap.xml"
            "feed.xml"
          )

          if [[ "${CONTINENTAL_READY:-false}" == "true" ]]; then
            if [[ "${CONTINENTAL_CHANGED:-false}" != "true" || "${AF_UPDATED:-false}" == "true" ]]; then
              FILES+=(
                "dados-br/competicoes-af-previsao/copa-do-brasil.json"
                "dados-br/competicoes-af-previsao/libertadores.json"
                "dados-br/competicoes-af-previsao/sul-americana.json"
                "dados-br/auditoria-competicoes-af-previsao.json"
                "dados-br/agenda-clubes-br.json"
              )
            else
              echo "::warning::Mudança nas copas não será publicada sem o AF correspondente."
            fi
          fi

          if [[ "${AF_UPDATED:-false}" == "true" ]]; then
            FILES+=(
              "dados-br/probabilidades-brasileirao.json"
              "dados-br/probabilidades-por-pontuacao.json"
              "dados-br/probabilidades-jogos.json"
              "dados-br/auditoria-probabilidades-jogos.json"
              "dados-br/probabilidades-bolao.json"
              "dados-br/auditoria-probabilidades.json"
              "dados-br/historico-probabilidades.json"
              "dados-br/avaliacao-af-previsao.json"
            )
          fi

          EXISTING=()
          for f in "${FILES[@]}"; do
            [[ -e "$f" ]] && EXISTING+=("$f")
          done
          FILES=("${EXISTING[@]}")

          if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "Sem mudancas nos JSONs - nada a commitar."
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          for f in "${FILES[@]}"; do
            if [[ -e "$f" ]]; then
              mkdir -p "$TMP_DIR/$(dirname "$f")"
              cp -a "$f" "$TMP_DIR/$f"
            fi
          done

          for i in 1 2 3 4 5; do
            echo "Tentativa de push $i/5..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            for f in "${FILES[@]}"; do
              if [[ -e "$TMP_DIR/$f" ]]; then
                rm -rf "$f"
                mkdir -p "$(dirname "$f")"
                cp -a "$TMP_DIR/$f" "$f"
              fi
            done

            if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
              echo "Apos atualizar com origin/main, nada mudou - sem commit."
              exit 0
            fi

            git add -- "${FILES[@]}"
            git commit -m "Atualizar dados auditados do Brasileirao - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')"

            if git push origin HEAD:main; then
              echo "Push OK na tentativa $i."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rejeitado na tentativa $i; recalculando sobre origin/main mais recente..."
            sleep 3
          done

          echo "ERRO: Push falhou apos 5 tentativas."
          exit 1

      - name: Anexar diagnóstico estruturado em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fdg-reliability-diagnostic-${{ github.run_id }}
          path: artifacts/reliability/
          if-no-files-found: ignore
          retention-days: 14

      - name: Disparar deploy após publicação válida
        if: >-
          steps.publish_main.outputs.published == 'true' ||
          steps.publish_independent.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # O push acima é autenticado com GITHUB_TOKEN e, por proteção contra
          # recursão do GitHub Actions, não cria outro workflow por evento push.
          # deploy.yml aceita workflow_dispatch, portanto o acionamos
          # explicitamente após o commit ter sido publicado no main.
          gh workflow run deploy.yml --ref main
          echo "Deploy do site disparado para o main recém-publicado."


  # Alerta integrado ao próprio workflow. Substitui o antigo workflow
  # "Monitorar Atualizar Brasileirao" e evita uma execução cinza a cada hora.
  alertar_falha:
    name: Avisar falha sem publicar artefatos
    needs: atualizar
    if: ${{ always() && needs.atualizar.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o main mais recente
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar status crítico e enviar e-mail
        env:
          BR_STATUS: erro
          BR_MOTIVO: O job principal do workflow Atualizar Brasileirão terminou com conclusão '${{ needs.atualizar.result }}'. O último snapshot íntegro permanece publicado.
          BR_FALLBACKS: '[]'
          BR_TENTATIVAS: '0'
          BR_SINCRONIZADO: 'false'
          BR_SOURCE_STATE: error
          BR_SOURCE_REASON: WORKFLOW_JOB_FAILED
          BR_SNAPSHOT_PRESERVED: 'true'
          BR_SOURCE_SURFACES: '[]'
          BR_WORKFLOW: Atualizar Brasileirao (ESPN)
          BR_SITE: Fórmula do Gol
          BR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BR_SOURCE_RUN_ID: ${{ github.run_id }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
        run: python scripts/gerenciar_status_brasileirao.py --from-env --notify

