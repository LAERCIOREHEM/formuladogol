name: AF-Previsão Fastlane pós-FINAL
run-name: AF Fastlane · ${{ inputs.event_id || 'FINAL detectado' }}

on:
  # R10R22: o hotfix da lógica de recuperação também aciona uma execução
  # automática, sem exigir novo dispatch manual do mesmo event_id.
  push:
    branches: [main]
    paths:
      - '.github/workflows/af-previsao-fastlane-pos-final.yml'
      - 'scripts/af_fastlane_sync_gate.py'
      - 'scripts/af_ultra_fastlane_r36.py'
      - 'scripts/publicar_af_core_r36.py'
  workflow_dispatch:
    inputs:
      event_id:
        description: 'ESPN event_id que motivou o FINAL; vazio é permitido em recuperação'
        required: false
        default: ''
        type: string
      origem:
        description: 'Origem operacional do disparo'
        required: false
        default: 'manual'
        type: string
      trace_id:
        description: 'Correlation ID interno do ciclo pós-FINAL'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

# Mesmo lock dos demais writers. O Fastlane não concorre com outro commit no main.
# PRIORIDADE ABSOLUTA PARA FINAL: o cálculo esportivo e seu commit
# não esperam por busca de público, editoriais, coleta completa ou Pages.
# A escrita usa fetch/reset/push otimista e guarda monotônica pós-fetch.
concurrency:
  group: fdg-urgent-final-core
  cancel-in-progress: false
  queue: max

jobs:
  fastlane:
    name: ESPN canônica → AF → publicação rápida
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-af-previsao.txt

      - name: Dependências do AF
        run: python -m pip install --disable-pip-version-check -r requirements-af-previsao.txt

      - name: Preparar correlation ID ponta a ponta
        shell: bash
        run: |
          set -euo pipefail
          TRACE='${{ inputs.trace_id }}'
          if [[ -z "$TRACE" ]]; then TRACE="fdg-${{ inputs.event_id || 'recovery' }}"; fi
          echo "FDG_TRACE_ID=$TRACE" >> "$GITHUB_ENV"
          echo "Correlation ID: $TRACE"

      - name: Validar somente o caminho crítico
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/af_ultra_fastlane_r36.py \
            atualizar_espn.py \
            fontes_brasileirao.py \
            scripts/gerar_agenda_clubes_brasileirao.py \
            scripts/af_previsao_continental.py \
            scripts/gerar_probabilidades_jogos.py \
            scripts/gerar_probabilidades_brasileirao.py \
            scripts/reconciliar_af_continental.py \
            scripts/af_fastlane_sync_gate.py \
            scripts/fdg_reliability.py \
            scripts/validar_snapshot_esportivo.py \
            scripts/registrar_slo_confiabilidade.py \
            scripts/gerar_estado_confiabilidade.py
          python atualizar_espn.py --selftest
          python scripts/gerar_agenda_clubes_brasileirao.py --self-test
          python scripts/af_previsao_continental.py --self-test
          python scripts/gerar_probabilidades_brasileirao.py --self-test
          python scripts/gerar_probabilidades_jogos.py --self-test
          python scripts/af_fastlane_sync_gate.py --self-test
          python -m unittest discover -s tests -p 'test_r36_r4_ultra_fastlane.py' -v

      - name: Snapshot anterior
        id: before
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          r = load('resultados.json')
          p = load('dados-br/probabilidades-brasileirao.json')
          print(f"resultados={int(r.get('total_resultados') or len(r.get('resultados') or []))}")
          print(f"hash_af={p.get('hash_entrada','')}")
          print(f"referencia_af={p.get('referencia_esportiva_em','')}")
          PY

      - name: R36-R4 — coletar somente FINAL novo em janela curta
        id: espn
        env:
          EVENT_ID: ${{ inputs.event_id }}
        run: python scripts/af_ultra_fastlane_r36.py --event-id "$EVENT_ID"

      - name: Enfileirar recuperação somente se delta não certificado
        if: steps.espn.outputs.sincronizado != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run atualizar-brasileirao.yml --ref main -f trace_id="$FDG_TRACE_ID"

      - name: Atualizar agenda mínima para fechar o gatilho do FINAL
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_agenda_clubes_brasileirao.py --local-only

      - name: Detectar FINAL novo ou AF antigo pendente
        if: steps.espn.outputs.sincronizado == 'true'
        id: delta
        shell: bash
        env:
          BEFORE_RESULTS: ${{ steps.before.outputs.resultados }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          from scripts.gerar_probabilidades_brasileirao import current_publication_freshness
          r=json.loads(Path('resultados.json').read_text(encoding='utf-8'))
          after=int(r.get('total_resultados') or len(r.get('resultados') or []))
          before=int(os.environ.get('BEFORE_RESULTS') or 0)
          print(f"before={before}")
          print(f"after={after}")
          print(f"new_final={'true' if after > before else 'false'}")
          # Mesmo que outro writer tenha publicado os resultados antes de
          # atualizar o AF, a próxima execução deve recuperá-lo.
          freshness=current_publication_freshness()
          required=after > before or freshness.get('atualizado') is not True
          print(f"af_requested={'true' if required else 'false'}")
          print(f"af_stale={'true' if freshness.get('atualizado') is not True else 'false'}")
          from scripts.publicar_af_core_r36 import manifest
          m=Path('dados-br/af-core-manifest.json')
          try:
              bundle_ready=m.exists() and json.loads(m.read_text())==manifest(json.loads(Path('dados-br/probabilidades-brasileirao.json').read_text())) and Path('dados-br/af-core-snapshot.json').exists()
          except (KeyError,ValueError,OSError):
              bundle_ready=False
          print(f"publication_requested={'true' if required or not bundle_ready else 'false'}")
          PY

      - name: Confirmar e recuperar sincronização ESPN para o AF
        id: af_ready
        if: steps.delta.outputs.publication_requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # R10R22: o updater ESPN às vezes aceita uma transação antes do
          # standings representar o FINAL. O guard do AF é a autoridade real.
          # Somente dessincronia ESPNs previsível pode ser adiada/retentada.
          python scripts/af_fastlane_sync_gate.py --max-retries 0 --wait-seconds 0

      - name: Registrar pendência transitória e enfileirar recuperação completa
        if: steps.delta.outputs.af_requested == 'true' && steps.af_ready.outputs.deferred == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning title=AF Fastlane aguardando a ESPN::A classificação e os resultados ainda não representam a mesma fotografia. Nenhum AF novo será gravado."
          echo "A recuperação completa foi enfileirada automaticamente para nova tentativa, sem reiniciar o cálculo sobre uma base contraditória."
          gh workflow run atualizar-brasileirao.yml --ref main -f trace_id="$FDG_TRACE_ID"

      - name: Recalcular AF imediatamente
        id: af
        if: steps.delta.outputs.af_requested == 'true' && steps.af_ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # O reconciliador valida os três snapshots continentais e a auditoria
          # antes de permitir o novo AF. Se houver contradição, falha fechado.
          python scripts/reconciliar_af_continental.py --max-attempts 1

      - name: Sporting Snapshot Integrity Guard
        if: steps.delta.outputs.publication_requested == 'true' && steps.af_ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validar_snapshot_esportivo.py \
            --profile fastlane \
            --event-id "${{ inputs.event_id }}" \
            --trace-id "$FDG_TRACE_ID" \
            --diagnostic artifacts/reliability/fdg-diagnostico-fastlane.json \
            --report artifacts/reliability/sporting-integrity-fastlane.json

      - name: Registrar SLO FINAL → AF
        if: steps.delta.outputs.af_requested == 'true' && steps.af_ready.outputs.ready == 'true'
        env:
          NEW_IDS: ${{ steps.espn.outputs.new_ids }}
          EVENT_ID: ${{ inputs.event_id }}
          FDG_FINAL_DETECTED_AT: ${{ steps.espn.outputs.detected_at }}
          FDG_RESULTS_READY_AT: ${{ steps.espn.outputs.results_ready_at }}
        run: |
          set -euo pipefail
          IFS=',' read -ra IDS <<< "$NEW_IDS"
          for event in "${IDS[@]}" "$EVENT_ID"; do
            [[ -n "$event" ]] || continue
            python scripts/registrar_slo_confiabilidade.py --event-id "$event" --trace-id "fdg-$event"
          done

      - name: Atualizar estado CORE / ENRICHMENT
        if: steps.delta.outputs.af_requested == 'true' && steps.af_ready.outputs.ready == 'true'
        run: python scripts/gerar_estado_confiabilidade.py --profile fastlane

      - name: Gerar snapshot público atômico R36-R4
        if: steps.delta.outputs.publication_requested == 'true' && steps.af_ready.outputs.ready == 'true'
        run: |
          python scripts/gerar_auditoria_calendario.py
          python tests/test_calendario_finais_cbf_2026.py
          python scripts/publicar_af_core_r36.py

      - name: Preparar artefatos atômicos
        id: material
        if: steps.delta.outputs.publication_requested == 'true' && steps.af_ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            tabela.json
            espn_eventos.json
            jogos.json
            resultados.json
            dados-br/agenda-clubes-br.json
            dados-br/calendario-completo.json
            dados-br/auditoria-calendario.json
            dados-br/probabilidades-brasileirao.json
            dados-br/probabilidades-por-pontuacao.json
            dados-br/probabilidades-jogos.json
            dados-br/auditoria-probabilidades-jogos.json
            dados-br/probabilidades-bolao.json
            dados-br/auditoria-probabilidades.json
            dados-br/historico-probabilidades.json
            dados-br/avaliacao-af-previsao.json
            dados-br/slo-confiabilidade.json
            dados-br/estado-confiabilidade.json
            dados-br/af-core-manifest.json
            dados-br/af-core-snapshot.json
          )
          EXISTING=()
          for f in "${FILES[@]}"; do [[ -e "$f" ]] && EXISTING+=("$f"); done
          if [[ -z "$(git status --porcelain -- "${EXISTING[@]}")" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar transação rápida no main
        id: publish
        if: steps.delta.outputs.publication_requested == 'true' && steps.af_ready.outputs.ready == 'true' && steps.material.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=(
            tabela.json
            espn_eventos.json
            jogos.json
            resultados.json
            dados-br/agenda-clubes-br.json
            dados-br/probabilidades-brasileirao.json
            dados-br/probabilidades-por-pontuacao.json
            dados-br/probabilidades-jogos.json
            dados-br/auditoria-probabilidades-jogos.json
            dados-br/probabilidades-bolao.json
            dados-br/auditoria-probabilidades.json
            dados-br/historico-probabilidades.json
            dados-br/avaliacao-af-previsao.json
            dados-br/slo-confiabilidade.json
            dados-br/estado-confiabilidade.json
            dados-br/af-core-manifest.json
            dados-br/af-core-snapshot.json
          )
          EXISTING=()
          for f in "${FILES[@]}"; do [[ -e "$f" ]] && EXISTING+=("$f"); done

          TMP_DIR="$(mktemp -d)"
          for f in "${EXISTING[@]}"; do
            mkdir -p "$TMP_DIR/$(dirname "$f")"
            cp -a "$f" "$TMP_DIR/$f"
          done

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Outra coleta pode ter publicado mais FINALS enquanto o AF
            # calculava. Nunca reabrir uma partida nem sobrescrever placar.
            if ! python scripts/guard_stale_full_snapshot.py "$TMP_DIR/resultados.json" "resultados.json"; then
              echo "::warning title=AF Fastlane obsoleto::Snapshot mais recente já existe; preservar main e aguardar nova captura."
              exit 0
            fi

            for f in "${EXISTING[@]}"; do
              rm -rf "$f"
              mkdir -p "$(dirname "$f")"
              cp -a "$TMP_DIR/$f" "$f"
            done

            # Revalida o AF contra copas/configuração atuais depois do fetch/reset.
            # Um resultado continental publicado durante a simulação não pode
            # ser substituído por um bundle calculado com entradas antigas.
            if ! python scripts/validar_snapshot_esportivo.py --profile fastlane --trace-id "$FDG_TRACE_ID"; then
              echo "::warning::Snapshot mudou durante o cálculo; preservar main e aguardar recuperação."
              exit 0
            fi
            python scripts/gerar_auditoria_calendario.py
            python tests/test_calendario_finais_cbf_2026.py
            python scripts/publicar_af_core_r36.py
            if [[ -z "$(git status --porcelain -- "${EXISTING[@]}")" ]]; then
              echo "Outro writer já publicou exatamente o mesmo estado."
              exit 0
            fi

            git add -- "${EXISTING[@]}"
            git commit -m "AF Fastlane pós-FINAL - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')"
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "commit_at=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "ERRO: push do AF Fastlane falhou após 5 tentativas."
          exit 1

      - name: Disparar deploy imediato
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Certificar leitura pública do snapshot rápido e medir latência
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true
        env:
          FDG_CORE_COMMIT: ${{ steps.publish.outputs.commit_sha }}
          FDG_CORE_COMMIT_AT: ${{ steps.publish.outputs.commit_at }}
        run: python scripts/verificar_af_core_publico_r36.py

      - name: Anexar métrica da publicação rápida
        if: always() && steps.publish.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fdg-ultra-fastlane-publicacao-${{ github.run_id }}
          path: artifacts/reliability/af-core-publicacao.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Enfileirar auditoria documental E1–E4 pós-FINAL
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run af-postgame-audit.yml --ref main

      - name: Enfileirar reconciliação completa fora do caminho crítico
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run recuperar-estatisticas-r36r7.yml --ref main
          gh workflow run atualizar-brasileirao.yml --ref main -f trace_id="$FDG_TRACE_ID"
          echo "Workflow completo enfileirado; estatísticas, líderes, auditorias e demais derivados continuam fora do caminho crítico do AF."

      - name: Anexar diagnóstico estruturado em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fdg-fastlane-diagnostic-${{ github.run_id }}
          path: artifacts/reliability/
          if-no-files-found: ignore
          retention-days: 14

      - name: Resumo
        if: always()
        shell: bash
        run: |
          {
            echo "## AF-Previsão Fastlane pós-FINAL"
            echo ""
            echo "- Evento gatilho: \`${{ inputs.event_id || 'não informado' }}\`"
            echo "- Origem: \`${{ inputs.origem || 'manual' }}\`"
            echo "- Trace: \`$FDG_TRACE_ID\`"
            echo "- Concluídos antes: \`${{ steps.before.outputs.resultados || '?' }}\`"
            echo "- Concluídos depois: \`${{ steps.delta.outputs.after || '?' }}\`"
            echo "- FINAL material novo: \`${{ steps.delta.outputs.new_final || 'false' }}\`"
            echo "- Recalcular AF necessário: \`${{ steps.delta.outputs.af_requested || 'false' }}\`"
            echo "- AF antigo pendente: \`${{ steps.delta.outputs.af_stale || 'false' }}\`"
            echo "- Readiness ESPN/AF: \`${{ steps.af_ready.outputs.classification || 'not_requested' }}\`"
            echo "- Refreshes controlados: \`${{ steps.af_ready.outputs.refresh_attempts || '0' }}\`"
            echo "- ESPN dessincronizada (AF pendente): \`${{ steps.af_ready.outputs.deferred || 'false' }}\`"
            echo "- Motivo deferimento: \`${{ steps.af_ready.outputs.reason || 'nenhum' }}\`"
            echo "- Publicado: \`${{ steps.publish.outputs.published || 'false' }}\`"
            echo ""
            echo "Contrato: o Fastlane publica somente base ESPN canônica + AF auditado. O workflow completo é enfileirado depois e não bloqueia a primeira publicação das probabilidades."
          } >> "$GITHUB_STEP_SUMMARY"
