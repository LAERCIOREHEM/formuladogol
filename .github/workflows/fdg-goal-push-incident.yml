name: FDG Goal Push Forensic Athletico Remo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fdg_goal_push_forensic.py'
      - '.github/workflows/fdg-goal-push-incident.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FDG_EVENT: '401841318'
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: python -m py_compile scripts/fdg_goal_push_forensic.py
      - name: Read-only forensic report
        run: python scripts/fdg_goal_push_forensic.py
