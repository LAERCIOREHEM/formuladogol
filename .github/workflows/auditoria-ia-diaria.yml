name: Auditoria IA diária

on:
  # Única janela programada da camada de IA: 05:30 em Brasília.
  # A janela ocorre após a carência mínima de 6 h mesmo para jogos que terminem perto de 23 h.
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-write-main
  cancel-in-progress: false
  queue: max

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o main mais recente
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-af-previsao.txt

      - name: Instalar dependências já usadas pelo motor estatístico
        run: python -m pip install --disable-pip-version-check -r requirements-af-previsao.txt

      - name: Validar integralmente a camada antes da execução
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/auditoria_ia_diaria.py \
            scripts/gerar_analise_rodada.py \
            scripts/gerar_analise_copa_do_brasil.py \
            scripts/buscar_melhores_momentos_copa_do_brasil.py \
            scripts/atualizar_transmissoes_tv_brasileirao.py \
            scripts/gerar_estatisticas_competicao_brasileirao.py \
            scripts/validar_artefatos_analises.py \
            scripts/validar_python_embutido_workflow.py
          python scripts/auditoria_ia_diaria.py --self-test
          python scripts/gerar_analise_rodada.py --self-test
          python scripts/gerar_analise_copa_do_brasil.py --self-test
          python scripts/buscar_melhores_momentos_copa_do_brasil.py --self-test
          python scripts/validar_artefatos_analises.py
          python scripts/auditoria_ia_diaria.py --dry-run >/tmp/auditoria-ia-dry-run.json
          python -m json.tool /tmp/auditoria-ia-dry-run.json >/dev/null

      - name: Reservar de forma persistente a única chamada do dia
        id: ai_gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          # Sem chave não existe chamada a reservar. A auditoria determinística
          # ainda roda e poderá tentar a IA depois, se a chave for configurada.
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "run_daily=true" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY ausente: nenhuma chamada será feita; lock diário não criado."
            exit 0
          fi

          cd "$GITHUB_WORKSPACE"
          LOCK="dados-br/auditoria-ia-lock.json"
          DATA_BRT="$(TZ='America/Sao_Paulo' date '+%F')"

          lock_eh_de_hoje() {
            [[ -f "$LOCK" ]] && [[ "$(jq -r '.data_brt // ""' "$LOCK" 2>/dev/null || true)" == "$DATA_BRT" ]]
          }

          if lock_eh_de_hoje; then
            echo "run_daily=false" >> "$GITHUB_OUTPUT"
            echo "A chamada de ${DATA_BRT} já foi reservada por outro run; nova tentativa bloqueada antes da API."
            exit 0
          fi

          mkdir -p "$(dirname "$LOCK")"
          RESERVADO_EM="$(TZ='America/Sao_Paulo' date --iso-8601=seconds)"
          jq -n \
            --arg data_brt "$DATA_BRT" \
            --arg reservado_em "$RESERVADO_EM" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema_version:1,data_brt:$data_brt,reservado_em:$reservado_em,github_run_id:$run_id,github_run_attempt:$run_attempt}' > "$LOCK"

          TMP_LOCK="$(mktemp)"
          cp "$LOCK" "$TMP_LOCK"
          trap 'rm -f "$TMP_LOCK"' EXIT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            echo "Reserva OpenAI: tentativa de push $i/5..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Se um run anterior venceu a corrida, respeita o lock dele.
            if lock_eh_de_hoje; then
              echo "run_daily=false" >> "$GITHUB_OUTPUT"
              echo "Lock diário já publicado no main; chamada bloqueada antes da API."
              exit 0
            fi

            mkdir -p "$(dirname "$LOCK")"
            cp "$TMP_LOCK" "$LOCK"
            git add -- "$LOCK"
            git commit -m "Reservar auditoria IA - ${DATA_BRT}"
            if git push origin HEAD:main; then
              echo "run_daily=true" >> "$GITHUB_OUTPUT"
              echo "Reserva diária persistida antes da chamada OpenAI."
              exit 0
            fi
            sleep 2
          done

          echo "::error title=Falha ao reservar chamada OpenAI::Sem lock persistido, a API não será chamada para evitar duplicidade."
          echo "run_daily=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Executar a única chamada diária de IA
        if: steps.ai_gate.outputs.run_daily == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_AUDIT_MODEL: ${{ vars.OPENAI_AUDIT_MODEL || vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
        run: python scripts/auditoria_ia_diaria.py

      - name: Validar somente artefatos produzidos ou preservados
        if: steps.ai_gate.outputs.run_daily == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool dados-br/auditoria-ia.json >/dev/null
          python -m json.tool dados-br/publicos-complementares.json >/dev/null
          python -m json.tool dados-br/jogos-detalhes.json >/dev/null
          python -m json.tool dados-br/estatisticas-competicao.json >/dev/null
          python -m json.tool dados-br/transmissoes-tv.json >/dev/null
          python -m json.tool dados-br/analises.json >/dev/null
          python scripts/validar_artefatos_analises.py

      - name: Publicar auditoria e correções validadas com push robusto
        if: steps.ai_gate.outputs.run_daily == 'true'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "site_changed=false" >> "$GITHUB_OUTPUT"
          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=(
            dados-br/auditoria-ia.json
            dados-br/publicos-complementares.json
            dados-br/jogos-detalhes.json
            dados-br/estatisticas-competicao.json
            dados-br/transmissoes-tv.json
            analises
            css/br-analises.css
            dados-br/analises.json
            dados-br/historico-probabilidades-continentais.json
            sitemap.xml
            news-sitemap.xml
            feed.xml
          )
          SITE_FILES=(
            dados-br/publicos-complementares.json
            dados-br/jogos-detalhes.json
            dados-br/estatisticas-competicao.json
            dados-br/transmissoes-tv.json
            analises
            css/br-analises.css
            dados-br/analises.json
            dados-br/historico-probabilidades-continentais.json
            sitemap.xml
            news-sitemap.xml
            feed.xml
          )

          EXISTING=()
          for f in "${FILES[@]}"; do [[ -e "$f" ]] && EXISTING+=("$f"); done
          FILES=("${EXISTING[@]}")

          if [[ ${#FILES[@]} -eq 0 ]] || [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "Auditoria sem alteração persistente."
            exit 0
          fi

          if [[ -n "$(git status --porcelain -- "${SITE_FILES[@]}")" ]]; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          fi

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          for f in "${FILES[@]}"; do
            mkdir -p "$TMP_DIR/$(dirname "$f")"
            cp -a "$f" "$TMP_DIR/$f"
          done

          for i in 1 2 3 4 5; do
            echo "Tentativa de push $i/5..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            for f in "${FILES[@]}"; do
              rm -rf "$f"
              mkdir -p "$(dirname "$f")"
              cp -a "$TMP_DIR/$f" "$f"
            done

            if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
              echo "Outro run já publicou os mesmos artefatos."
              exit 0
            fi

            git add -- "${FILES[@]}"
            git commit -m "Auditoria IA diária - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y')"
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejeitado; nova tentativa sobre origin/main atualizado."
            sleep 3
          done

          echo "::error title=Falha ao publicar auditoria IA::Não foi possível enviar o commit ao main após 5 tentativas."
          exit 1

      - name: Disparar deploy somente se a IA alterou conteúdo do site
        if: steps.publish.outputs.published == 'true' && steps.publish.outputs.site_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
          echo "Deploy disparado porque houve correção ou editorial visível no site."
      - name: Notificar falha operacional grave do próprio workflow
        if: ${{ failure() }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set +e
          # Se a auditoria já conseguiu enviar um alerta crítico nesta execução,
          # não duplica o e-mail por causa de uma falha posterior do job.
          if [[ -f dados-br/auditoria-ia.json ]] && \
             [[ "$(jq -r '.alerta.envio_nesta_execucao // false' dados-br/auditoria-ia.json 2>/dev/null)" == "true" ]]; then
            echo "Alerta crítico já enviado pela auditoria; e-mail operacional duplicado suprimido."
            exit 0
          fi
          if [[ -z "${RESEND_API_KEY:-}" || -z "${EMAIL_DESTINO:-}" ]]; then
            echo "::warning title=Falha crítica sem e-mail::RESEND_API_KEY/EMAIL_DESTINO não configurados."
            exit 0
          fi
          REMETENTE="${EMAIL_REMETENTE:-onboarding@resend.dev}"
          BODY="$(jq -n \
            --arg from "$REMETENTE" \
            --arg to "$EMAIL_DESTINO" \
            --arg run "$RUN_URL" \
            '{from:$from,to:[$to],subject:"Fórmula do Gol — falha operacional na auditoria IA",html:("<h2>Fórmula do Gol — falha operacional</h2><p>O workflow diário de auditoria IA falhou em uma etapa crítica de validação, reserva, publicação ou deploy.</p><p><a href=\""+$run+"\">Abrir execução no GitHub Actions</a></p><p>Os coletores esportivos normais permanecem independentes desta camada.</p>")}')"
          HTTP_CODE="$(curl -sS -o /tmp/resend-failure.json -w '%{http_code}' \
            -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data "$BODY")"
          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "E-mail operacional crítico enviado."
          else
            echo "::warning title=Falha ao enviar alerta Resend::HTTP ${HTTP_CODE}; $(head -c 500 /tmp/resend-failure.json 2>/dev/null)"
          fi

