name: R10R21 Gato Mestre Recovery Preflight
on:
  push:
    branches: [fix/r10r21-ge-roundup-targeted-recovery]
    paths:
      - 'scripts/atualizar_publicos_brasileirao.py'
      - '.github/workflows/r10r21-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax and targeted regression
        run: |
          python -m py_compile scripts/atualizar_publicos_brasileirao.py
          python scripts/atualizar_publicos_brasileirao.py --self-test
      - name: Full deterministic validation (no network)
        run: |
          python scripts/atualizar_publicos_brasileirao.py --dry-run --sem-rede
          python scripts/auditar_publicos_identidade.py --self-test
          python scripts/postgame_factual_integrity.py --self-test
          python -m json.tool dados-br/correcoes/publicos-verificados.json >/dev/null
          python -m json.tool dados-br/publicos-complementares.json >/dev/null
