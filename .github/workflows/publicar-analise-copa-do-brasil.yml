name: Publicar análise editorial da Copa do Brasil

on:
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Regenerar o editorial caso o fechamento já tenha sido publicado'
        required: false
        default: false
        type: boolean
      sem_ia:
        description: 'Usar somente o texto determinístico de contingência'
        required: false
        default: false
        type: boolean
  schedule:
    # Retentativas curtas e independentes durante a semana de fechamento da fase.
    - cron: '28 6,10 * * *'

permissions:
  contents: write

concurrency:
  group: repo-write-main
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o main mais recente
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-af-previsao.txt

      - name: Instalar dependências do AF-Previsão
        run: python -m pip install --disable-pip-version-check -r requirements-af-previsao.txt

      - name: Validar motor, histórico e arquivo editorial
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/gerar_analise_rodada.py \
            scripts/gerar_analise_copa_do_brasil.py \
            scripts/buscar_melhores_momentos_copa_do_brasil.py \
            scripts/validar_artefatos_analises.py
          python scripts/gerar_analise_rodada.py --self-test
          python scripts/gerar_analise_copa_do_brasil.py --self-test
          python scripts/buscar_melhores_momentos_copa_do_brasil.py --self-test
          python -m json.tool dados-br/historico-probabilidades-continentais.json >/dev/null
          python scripts/validar_artefatos_analises.py

      - name: Atualizar melhores momentos oficiais das oitavas
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/buscar_melhores_momentos_copa_do_brasil.py

      - name: Detectar fechamento e gerar editorial
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
          FORCAR: ${{ inputs.forcar }}
          SEM_IA: ${{ inputs.sem_ia }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--falhar-se-snapshot-atrasado --tolerancia-snapshot-horas 4)
          if [[ "${FORCAR:-false}" == "true" ]]; then args+=(--forcar); fi
          if [[ "${SEM_IA:-false}" == "true" ]]; then args+=(--sem-ia); fi
          python scripts/gerar_analise_copa_do_brasil.py "${args[@]}"

      - name: Validar artefatos depois da geração
        run: |
          set -euo pipefail
          python -m json.tool dados-br/analises.json >/dev/null
          python -m json.tool dados-br/historico-probabilidades-continentais.json >/dev/null
          python scripts/validar_artefatos_analises.py

      - name: Publicar no repositório
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          arquivos=(
            analises
            dados-br/analises.json
            dados-br/historico-probabilidades-continentais.json
            dados-br/melhores-momentos-copa-do-brasil.json
            sitemap.xml
            news-sitemap.xml
            feed.xml
          )
          if [[ -z "$(git status --porcelain -- "${arquivos[@]}")" ]]; then
            echo "O fechamento das oitavas ainda não está elegível ou já foi publicado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${arquivos[@]}"
          git commit -m "Publicar análise da Copa do Brasil: classificados às quartas"

          publicado=false
          for tentativa in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              publicado=true
              echo "published=true" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Tentativa ${tentativa}/3 não concluiu; tentando novamente."
          done
          if [[ "$publicado" != "true" ]]; then
            echo "::error title=Falha ao publicar editorial::Não foi possível enviar o commit ao main."
            exit 1
          fi

