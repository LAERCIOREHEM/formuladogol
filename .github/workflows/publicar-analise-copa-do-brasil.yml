name: Publicar análise editorial da Copa do Brasil

on:
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Regenerar o editorial caso o fechamento já tenha sido publicado'
        required: false
        default: false
        type: boolean
      encadear_rodada:
        description: 'Ao concluir, disparar o editorial da rodada (uso interno do Atualizar Brasileirao)'
        required: false
        default: false
        type: boolean
  schedule:
    # Retentativas determinísticas curtas e independentes durante fechamentos.
    # A redação por IA fica centralizada na auditoria diária, uma vez por dia.
    - cron: '28 6,10 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-write-main
  cancel-in-progress: false
  queue: max

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o main mais recente
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-af-previsao.txt

      - name: Instalar dependências do AF-Previsão
        run: python -m pip install --disable-pip-version-check -r requirements-af-previsao.txt

      - name: Validar motor, histórico e arquivo editorial
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/gerar_analise_rodada.py \
            scripts/gerar_analise_copa_do_brasil.py \
            scripts/buscar_melhores_momentos_copa_do_brasil.py \
            scripts/validar_artefatos_analises.py
          python scripts/gerar_analise_rodada.py --self-test
          python scripts/gerar_analise_copa_do_brasil.py --self-test
          python scripts/buscar_melhores_momentos_copa_do_brasil.py --self-test
          python -m json.tool dados-br/historico-probabilidades-continentais.json >/dev/null
          python scripts/validar_artefatos_analises.py

      - name: Atualizar melhores momentos oficiais da fase atual
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/buscar_melhores_momentos_copa_do_brasil.py

      - name: Detectar fechamento e gerar editorial determinístico
        env:
          FORCAR: ${{ inputs.forcar }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--sem-ia --falhar-se-snapshot-atrasado --tolerancia-snapshot-horas 4)
          if [[ "${FORCAR:-false}" == "true" ]]; then args+=(--forcar); fi
          python scripts/gerar_analise_copa_do_brasil.py "${args[@]}"

      - name: Validar artefatos depois da geração
        run: |
          set -euo pipefail
          python -m json.tool dados-br/analises.json >/dev/null
          python -m json.tool dados-br/historico-probabilidades-continentais.json >/dev/null
          python -m json.tool dados-br/melhores-momentos-copa-do-brasil.json >/dev/null
          python scripts/validar_artefatos_analises.py

      - name: Publicar no repositório com push robusto
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=(
            analises
            dados-br/analises.json
            dados-br/historico-probabilidades-continentais.json
            dados-br/melhores-momentos-copa-do-brasil.json
            sitemap.xml
            news-sitemap.xml
            feed.xml
          )
          EXISTING=()
          for f in "${FILES[@]}"; do [[ -e "$f" ]] && EXISTING+=("$f"); done
          FILES=("${EXISTING[@]}")

          if [[ ${#FILES[@]} -eq 0 ]] || [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "A fase atual ainda não está elegível ou seus artefatos já estão publicados."
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          for f in "${FILES[@]}"; do
            mkdir -p "$TMP_DIR/$(dirname "$f")"
            cp -a "$f" "$TMP_DIR/$f"
          done

          for i in 1 2 3 4 5; do
            echo "Tentativa de push $i/5..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            for f in "${FILES[@]}"; do
              rm -rf "$f"
              mkdir -p "$(dirname "$f")"
              cp -a "$TMP_DIR/$f" "$f"
            done

            if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
              echo "Outro run já publicou os mesmos artefatos."
              exit 0
            fi

            git add -- "${FILES[@]}"
            git commit -m "Publicar análise da fase atual da Copa do Brasil"
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejeitado; nova tentativa sobre origin/main atualizado."
            sleep 3
          done

          echo "::error title=Falha ao publicar editorial::Não foi possível enviar o commit ao main após 5 tentativas."
          exit 1

      - name: Disparar deploy após publicação
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
          echo "Deploy disparado para a Copa do Brasil recém-publicada."

      - name: Encadear editorial determinístico da rodada
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.encadear_rodada == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publicar-analise-rodada.yml --ref main
          echo "Editorial determinístico da rodada despachado; a IA diária permanece centralizada."
