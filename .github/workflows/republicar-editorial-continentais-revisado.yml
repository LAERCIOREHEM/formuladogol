name: Republicar editorial continental revisado

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: republicar-editorial-continentais-revisado
  cancel-in-progress: false

jobs:
  republicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar código editorial e fontes verificadas
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/editorial_ia.py scripts/gerar_analise_continental.py
          python scripts/editorial_ia.py --self-test
          python -S scripts/gerar_analise_continental.py --self-test
          python -m json.tool dados-br/correcoes/melhores-momentos-continentais-verificados.json >/dev/null
          python -m json.tool dados-br/correcoes/contexto-editorial-continentais-2026.json >/dev/null

      - name: Gerar edição revisada das quartas
        shell: bash
        run: |
          set -euo pipefail
          # Esta republicação usa a cópia premium determinística já revisada.
          # A OpenAI v4 fica instalada para as próximas edições automáticas.
          python -S scripts/gerar_analise_continental.py --sem-ia --fase-ordem 700

      - name: Auditoria editorial final e 14 melhores momentos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, 'scripts')
          import gerar_analise_continental as g

          snaps = {key: g.load(path, {}) or {} for key, path in g.SNAPS.items()}
          ties = [tie for comp, snap in snaps.items() for tie in g.build_ties(comp, snap, 700)]
          assert len(ties) == 7, f'esperados 7 confrontos brasileiros; encontrados {len(ties)}'
          legs = [(tie, event) for tie in ties for event in tie['pernas']]
          assert len(legs) == 14, f'esperados 14 jogos; encontrados {len(legs)}'

          mm = g.load_verified_mm()
          invalid = []
          for tie, event in legs:
              event_id = str(event.get('event_id') or '')
              video = (mm.get('jogos') or {}).get(event_id) or {}
              if not g.video_entry_valid(video, event, str(tie.get('competicao') or '')):
                  invalid.append(event_id)
          assert not invalid, f'melhores momentos inválidos/ausentes: {invalid}'

          html = Path('analises/continentais-2026-quartas-brasileiros.html').read_text(encoding='utf-8')
          required = [
              'Palmeiras sobrevive nos pênaltis, Galo assina virada e Brasil leva cinco às semifinais',
              'Pênaltis 4–3',
              'Flamengo <b>1 × 1</b> Independiente del Valle',
              'Fluminense x Palmeiras',
              'Estudiantes de La Plata x Flamengo',
              'Boca Juniors x Vasco da Gama',
              'Atlético-MG x Montevideo City Torque',
          ]
          missing = [item for item in required if item not in html]
          assert not missing, f'conteúdo obrigatório ausente: {missing}'
          assert html.count('analysis-inline-video') + html.count('analysis-cup-video-external') == 14
          assert 'analysis-video-missing' not in html
          print('OK: fatos, semifinais e 14/14 melhores momentos validados.')
          PY
          python scripts/validar_artefatos_analises.py

      - name: Commitar editorial revisado
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          FILES=(
            analises
            dados-br/analises.json
            dados-br/historico-probabilidades-continentais.json
            sitemap.xml
            news-sitemap.xml
            feed.xml
          )
          if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo 'Editorial já estava idêntico ao revisado.'
            exit 0
          fi
          git add -- "${FILES[@]}"
          git commit -m 'Republicar editorial continental revisado'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Aguardar deploy do site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=''
          for _ in $(seq 1 24); do
            RUN_ID="$(gh run list --workflow deploy.yml --branch main --commit "$TARGET_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$RUN_ID" ]] && break
            sleep 5
          done
          if [[ -z "$RUN_ID" ]]; then
            echo 'Deploy automático ainda não apareceu; disparando deploy explicitamente.'
            gh workflow run deploy.yml --ref main
            sleep 8
            RUN_ID="$(gh run list --workflow deploy.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          [[ -n "$RUN_ID" ]] || { echo 'Não foi possível localizar o Deploy site.' >&2; exit 1; }
          gh run watch "$RUN_ID" --exit-status

      - name: Confirmar página pública revisada
        shell: bash
        run: |
          set -euo pipefail
          URL='https://formuladogol.com.br/analises/continentais-2026-quartas-brasileiros.html'
          ok=0
          for _ in $(seq 1 24); do
            if curl -fsSL --max-time 20 "$URL" -o /tmp/editorial-publico.html; then
              if grep -Fq 'Palmeiras sobrevive nos pênaltis, Galo assina virada e Brasil leva cinco às semifinais' /tmp/editorial-publico.html \
                 && grep -Fq 'Pênaltis 4–3' /tmp/editorial-publico.html \
                 && grep -Fq 'Flamengo <b>1 × 1</b> Independiente del Valle' /tmp/editorial-publico.html; then
                ok=1
                break
              fi
            fi
            sleep 10
          done
          [[ "$ok" == '1' ]] || { echo 'A versão revisada ainda não apareceu no site público.' >&2; exit 1; }
          echo 'Página pública revisada confirmada.'

      - name: Enviar e-mail de publicação revisada
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RESEND_API_KEY:-}" && -n "${EMAIL_DESTINO:-}" ]] || { echo 'RESEND_API_KEY/EMAIL_DESTINO ausentes.' >&2; exit 1; }
          BODY="$(python - <<'PY'
          import html, json, os
          article = 'https://formuladogol.com.br/analises/continentais-2026-quartas-brasileiros.html'
          body = f'''<h2>Editorial continental revisado publicado</h2>
          <p>A edição das quartas de final foi republicada após revisão factual e editorial completa.</p>
          <p><strong>Manchete:</strong> Palmeiras sobrevive nos pênaltis, Galo assina virada e Brasil leva cinco às semifinais</p>
          <ul>
            <li>Palmeiras classificado: 3 a 3 no agregado e 4 a 3 nos pênaltis.</li>
            <li>Flamengo classificado: 3 a 1 no agregado.</li>
            <li>14 de 14 jogos do recorte brasileiro com melhores momentos validados.</li>
            <li>Semifinais conferidas e incluídas no texto.</li>
          </ul>
          <p><a href="{article}">Abrir editorial revisado</a></p>
          <p><a href="https://formuladogol.com.br/estatisticas.html#probabilidades">Abrir probabilidades</a></p>
          <hr>
          <p><strong>Texto-base para X</strong></p>
          <p>🌎 Quartas continentais fechadas: cinco brasileiros estão nas semifinais. Palmeiras sobreviveu nos pênaltis em Quito, Atlético-MG virou uma série que parecia perdida, e Flamengo, Fluminense e Vasco também avançaram. Veja os confrontos, as probabilidades e os melhores momentos no Fórmula do Gol.</p>
          <p><strong>Texto-base para Instagram</strong></p>
          <p>As quartas continentais terminaram com cinco brasileiros vivos. 🇧🇷🏆 Palmeiras avançou nos pênaltis após 3 a 3 no agregado; o Atlético-MG buscou uma reação de dois gols e também decidiu a vaga nas cobranças. Flamengo, Fluminense e Vasco completam o grupo brasileiro nas semifinais. O novo editorial do Fórmula do Gol reúne a leitura da fase, as novas probabilidades, os confrontos das semifinais e os melhores momentos dos 14 jogos envolvendo brasileiros.</p>
          <p><a href="{html.escape(os.environ.get('RUN_URL',''), quote=True)}">Abrir execução no GitHub Actions</a></p>'''
          print(json.dumps({
            'from': f'Fórmula do Gol <{os.environ.get("EMAIL_REMETENTE") or "onboarding@resend.dev"}>',
            'to': [os.environ['EMAIL_DESTINO']],
            'subject': 'Fórmula do Gol: editorial continental revisado publicado',
            'html': body,
          }, ensure_ascii=False))
          PY
          )"
          HTTP_CODE="$(curl -sS -o /tmp/resend-republicacao.json -w '%{http_code}' \
            -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data "$BODY")"
          [[ "$HTTP_CODE" =~ ^2 ]] || { echo "Resend HTTP $HTTP_CODE: $(head -c 1000 /tmp/resend-republicacao.json)" >&2; exit 1; }
          echo 'E-mail de publicação revisada enviado.'

      - name: Remover workflow temporário após sucesso
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          FILE='.github/workflows/republicar-editorial-continentais-revisado.yml'
          [[ -f "$FILE" ]] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm "$FILE"
          git commit -m 'Remover republicador editorial temporário [skip ci]'
          git push origin HEAD:main
          echo 'Workflow temporário removido após publicação e e-mail confirmados.'
