name: FDG 2027 SL01 - Isolated Pages Baseline
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/fdg2027/sl01/**'
      - '.github/workflows/fdg2027-sl01-baseline.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: fdg2027-sl01-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  baseline:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fdg2027/sl01-preparation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read immutable public Pages archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/artifacts/15110286620/zip" > "$RUNNER_TEMP/pages-baseline.zip"
          echo '298ce3a9f0feca9c8c4dc4ab325b20628a299e92bea8854bb3c15a2460763c20  '"$RUNNER_TEMP/pages-baseline.zip" | sha256sum -c -
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.52.0
          python -m playwright install --with-deps chromium
      - name: Local public baseline, all external browser requests blocked
        run: |
          python research/fdg2027/sl01/baseline.py "$RUNNER_TEMP/pages-baseline.zip" "$RUNNER_TEMP/sl01-evidence"
      - name: Preserve public-only QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdg2027-sl01-public-baseline
          path: ${{ runner.temp }}/sl01-evidence/
          if-no-files-found: error
          retention-days: 30
