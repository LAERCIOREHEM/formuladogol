name: Finalizar e limpar reparo continental 2026
run-name: Limpeza continental · e-mail SMTP · restaurar auditoria

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-write-main
  cancel-in-progress: false

jobs:
  finalizar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar main mais recente
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar estado corrigido antes da limpeza
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          html_path = Path('analises/continentais-2026-quartas-brasileiros.html')
          prob_path = Path('dados-br/probabilidades-brasileirao.json')
          manifest_path = Path('dados-br/analises.json')
          for path in (html_path, prob_path, manifest_path):
              if not path.exists():
                  raise SystemExit(f'arquivo obrigatório ausente: {path}')

          html = html_path.read_text(encoding='utf-8')
          required = (
              'Palmeiras sobrevive nos pênaltis, Galo assina virada e Brasil leva cinco às semifinais',
              'Classificado: Palmeiras',
              'Pênaltis 4–3',
              'Flamengo <b>1 × 1</b> Independiente del Valle',
              'Classificado: Flamengo',
              'Classificado: Fluminense',
              'Classificado: Atlético-MG',
              'Classificado: Vasco da Gama',
          )
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit('editorial corrigido incompleto: ' + ' | '.join(missing))
          forbidden = (
              '<strong>Palmeiras</strong><small>ELIMINADO</small>',
              'Classificado: Liga de Quito</strong><span>Eliminado: Palmeiras',
              'Flamengo <b>1 × 0</b> Independiente del Valle',
          )
          bad = [x for x in forbidden if x in html]
          if bad:
              raise SystemExit('editorial ainda contém estado contaminado: ' + ' | '.join(bad))

          video_count = html.count('analysis-inline-video') + html.count('analysis-cup-video-external')
          if video_count != 14 or 'analysis-video-missing' in html:
              raise SystemExit(f'melhores momentos não estão 14/14: {video_count}')

          probabilities = json.loads(prob_path.read_text(encoding='utf-8'))
          if probabilities.get('status') != 'ok':
              raise SystemExit('probabilidades-brasileirao.json não está com status ok')
          sims = int((probabilities.get('simulacao') or {}).get('quantidade') or 0)
          if sims != 2_000_000:
              raise SystemExit(f'AF não está em 2.000.000 simulações: {sims}')
          clubs = {str(x.get('clube') or ''): x for x in probabilities.get('clubes') or []}
          pal = clubs.get('Palmeiras') or {}
          route = (((pal.get('decomposicao_chances') or {}).get('libertadores') or {}).get('vias') or {}).get('via_titulo_libertadores') or {}
          if not bool(route.get('possivel_estruturalmente')) or bool(route.get('impossivel_estruturalmente')):
              raise SystemExit('Palmeiras ainda não está estruturalmente ativo na via Libertadores')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          article = next((x for x in manifest.get('artigos') or [] if x.get('id_editorial') == 'continentais-2026-quartas-brasileiros'), None)
          if not article:
              raise SystemExit('artigo continental das Quartas ausente do manifesto')
          print('OK: editorial premium, AF 2M, Palmeiras e 14/14 vídeos confirmados localmente.')
          PY

      - name: Confirmar versão pública
        env:
          ARTICLE_URL: https://formuladogol.com.br/analises/continentais-2026-quartas-brasileiros.html
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            echo "Verificação pública ${attempt}/24..."
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${ARTICLE_URL}?finalize=${GITHUB_RUN_ID}-${attempt}" -o /tmp/editorial-publico.html; then
              if grep -Fq 'Palmeiras sobrevive nos pênaltis, Galo assina virada e Brasil leva cinco às semifinais' /tmp/editorial-publico.html \
                && grep -Fq 'Classificado: Palmeiras' /tmp/editorial-publico.html \
                && grep -Fq 'Pênaltis 4–3' /tmp/editorial-publico.html \
                && grep -Fq 'Flamengo <b>1 × 1</b> Independiente del Valle' /tmp/editorial-publico.html; then
                ok=1
                break
              fi
            fi
            sleep 10
          done
          [[ "$ok" == '1' ]] || { echo '::error title=Publicação não confirmada::A versão premium ainda não apareceu integralmente no site público.'; exit 1; }
          echo 'OK: publicação premium confirmada no site.'

      - name: Enviar e-mail pelo canal operacional existente
        id: email
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_DESTINO_SUGESTOES: ${{ secrets.EMAIL_DESTINO_SUGESTOES }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import os
          import smtplib
          import ssl
          import urllib.error
          import urllib.request
          from email.message import EmailMessage
          from email.utils import formataddr
          from pathlib import Path

          article_url = 'https://formuladogol.com.br/analises/continentais-2026-quartas-brasileiros.html'
          stats_url = 'https://formuladogol.com.br/estatisticas.html#probabilidades'
          run_url = os.environ.get('RUN_URL', '')
          manifest = json.loads(Path('dados-br/analises.json').read_text(encoding='utf-8'))
          article = next((x for x in manifest.get('artigos') or [] if x.get('id_editorial') == 'continentais-2026-quartas-brasileiros'), {})
          title = str(article.get('titulo') or 'Palmeiras sobrevive nos pênaltis, Galo assina virada e Brasil leva cinco às semifinais')
          deck = str(article.get('linha_fina') or '')

          x_text = (
              '🌎 Quartas continentais fechadas: cinco brasileiros estão nas semifinais. '
              'Palmeiras sobreviveu nos pênaltis em Quito, Atlético-MG virou uma série que parecia perdida, '
              'e Flamengo, Fluminense e Vasco também avançaram. Veja confrontos, probabilidades e melhores momentos no Fórmula do Gol.'
          )
          insta_text = (
              'CONTINENTAIS 2026 — CINCO BRASILEIROS NAS SEMIFINAIS\n\n'
              'Palmeiras avançou nos pênaltis após 3 a 3 no agregado; o Atlético-MG buscou uma reação de dois gols e também decidiu a vaga nas cobranças. '
              'Flamengo, Fluminense e Vasco completam o grupo brasileiro nas semifinais. '
              'O editorial revisado do Fórmula do Gol reúne a leitura da fase, as probabilidades recalculadas e os melhores momentos dos 14 jogos do recorte brasileiro.\n\n'
              'Análise completa no site.'
          )

          plain = (
              'Fórmula do Gol — Editorial continental revisado publicado\n\n'
              f'{title}\n{deck}\n\n'
              'Palmeiras: classificado; agregado 3×3 e 4×3 nos pênaltis.\n'
              'Flamengo: classificado; volta 1×1 e agregado 3×1.\n'
              'AF-Previsão: 2.000.000 de simulações.\n'
              'Melhores momentos: 14/14 jogos validados.\n\n'
              f'Editorial: {article_url}\nProbabilidades: {stats_url}\nExecução: {run_url}\n\n'
              f'TEXTO PARA X\n{x_text}\n\nTEXTO PARA INSTAGRAM\n{insta_text}\n'
          )
          rich = f'''<h2>Fórmula do Gol — Editorial continental revisado publicado</h2>
          <p><strong>{html.escape(title)}</strong></p><p>{html.escape(deck)}</p>
          <ul><li>Palmeiras classificado: agregado 3×3 e 4×3 nos pênaltis.</li>
          <li>Flamengo classificado: volta 1×1 e agregado 3×1.</li>
          <li>AF-Previsão recalculado com 2.000.000 de simulações.</li>
          <li>Melhores momentos validados: 14/14 jogos.</li></ul>
          <p><a href="{article_url}">Abrir editorial revisado</a><br><a href="{stats_url}">Abrir probabilidades</a><br><a href="{html.escape(run_url, quote=True)}">Abrir finalização no GitHub</a></p>
          <hr><h3>Texto-base para X</h3><p>{html.escape(x_text)}</p>
          <h3>Texto-base para Instagram</h3><p style="white-space:pre-line">{html.escape(insta_text)}</p>'''

          smtp = {k: os.environ.get(k, '').strip() for k in ('SMTP_HOST','SMTP_PORT','SMTP_USER','SMTP_PASS')}
          destination = (os.environ.get('EMAIL_DESTINO_SUGESTOES') or '').strip() or 'avisos@formuladogol.com.br'
          smtp_error = ''
          if all(smtp.values()):
              try:
                  port = int(smtp['SMTP_PORT'])
                  msg = EmailMessage()
                  msg['From'] = formataddr(('Fórmula do Gol', smtp['SMTP_USER']))
                  msg['To'] = destination
                  msg['Subject'] = 'Fórmula do Gol: editorial continental revisado publicado'
                  msg.set_content(plain)
                  msg.add_alternative(rich, subtype='html')
                  context = ssl.create_default_context()
                  if port == 465:
                      with smtplib.SMTP_SSL(smtp['SMTP_HOST'], port, context=context, timeout=30) as server:
                          server.login(smtp['SMTP_USER'], smtp['SMTP_PASS'])
                          server.send_message(msg)
                  else:
                      with smtplib.SMTP(smtp['SMTP_HOST'], port, timeout=30) as server:
                          server.ehlo(); server.starttls(context=context); server.ehlo()
                          server.login(smtp['SMTP_USER'], smtp['SMTP_PASS'])
                          server.send_message(msg)
                  print(f'OK: e-mail enviado via SMTP para {destination}.')
                  raise SystemExit(0)
              except Exception as exc:
                  smtp_error = f'{type(exc).__name__}: {exc}'
                  print(f'::warning title=SMTP falhou::{smtp_error}')
          else:
              missing = [k for k,v in smtp.items() if not v]
              smtp_error = 'secrets ausentes: ' + ', '.join(missing)
              print(f'::warning title=SMTP indisponível::{smtp_error}')

          resend_key = (os.environ.get('RESEND_API_KEY') or '').strip()
          resend_to = (os.environ.get('EMAIL_DESTINO') or '').strip()
          if resend_key and resend_to:
              payload = json.dumps({
                  'from': f'Fórmula do Gol <{(os.environ.get("EMAIL_REMETENTE") or "onboarding@resend.dev").strip()}>',
                  'to': [resend_to],
                  'subject': 'Fórmula do Gol: editorial continental revisado publicado',
                  'html': rich,
                  'text': plain,
              }, ensure_ascii=False).encode('utf-8')
              request = urllib.request.Request('https://api.resend.com/emails', data=payload, method='POST', headers={
                  'Authorization': f'Bearer {resend_key}', 'Content-Type': 'application/json'
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if 200 <= int(response.status) < 300:
                          print(f'OK: e-mail enviado via Resend para {resend_to}.')
                          raise SystemExit(0)
              except Exception as exc:
                  print(f'::warning title=Resend falhou::{type(exc).__name__}: {exc}')

          print('::warning title=E-mail não enviado::Nenhum canal de e-mail operacional respondeu; a limpeza continuará para não manter workflows temporários no repositório.')
          raise SystemExit(0)
          PY

      - name: Remover TODOS os workflows temporários
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm --ignore-unmatch \
            .github/workflows/reparar-integridade-continentais.yml \
            .github/workflows/republicar-editorial-continentais-revisado.yml \
            .github/workflows/finalizar-reparo-continentais.yml

          if git diff --cached --quiet; then
            echo 'Workflows temporários já estavam removidos.'
          else
            git commit -m 'Encerrar workflows temporários do reparo continental [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'OK: workflows temporários removidos da main.'
          fi

      - name: Provar que a Auditoria IA voltou a aceitar a governança
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/auditoria_ia_diaria.py
          python scripts/auditoria_ia_diaria.py --self-test
          echo 'OK: nenhum workflow temporário mantém OPENAI_API_KEY fora da allowlist.'

      - name: Disparar Auditoria IA limpa
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run auditoria-ia-diaria.yml --ref main
          echo 'OK: nova Auditoria IA diária disparada sobre a main já limpa.'

      - name: Resumo
        if: always()
        shell: bash
        run: |
          echo 'Publicação premium preservada.'
          echo 'Workflows temporários: removidos pela etapa de limpeza.'
          echo 'Auditoria IA: self-test executado após a remoção.'
          echo 'E-mail: tentativa principal via SMTP do próprio Fórmula do Gol; Resend apenas como fallback.'
