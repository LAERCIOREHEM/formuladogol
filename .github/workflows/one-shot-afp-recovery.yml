name: AFP-R1 bounded existing recovery dispatch
on:
  push:
    branches: [ops/afp-r1-incremental-20261127]
    paths: [.github/workflows/one-shot-afp-recovery.yml]
permissions:
  contents: read
  actions: write
jobs:
  recovery:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/ops/afp-r1-incremental-20261127'
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse concurrent historical collection; dispatch existing bounded E02 recovery
        shell: bash
        run: |
          set -euo pipefail
          active="$(gh run list --repo LAERCIOREHEM/formuladogol --workflow fdg2027-e02-r2-historical.yml --json status --limit 20 --jq '[.[] | select(.status!="completed")] | length')"
          test "$active" = 0
          gh workflow run fdg2027-e02-r2-historical.yml --repo LAERCIOREHEM/formuladogol --ref main -f authorize_free_probe=true -f mode=recover -f football_limit=15
