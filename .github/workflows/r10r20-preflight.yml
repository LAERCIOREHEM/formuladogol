name: R10R20 Source First Preflight
on:
  push:
    branches:
      - fix/r10r20-postgame-fast-source-first
    paths:
      - 'cloudflare/push-worker/**'
      - '.github/workflows/r10r20-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cloudflare/push-worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Syntax
        run: npm run check
      - name: Sports and AI
        run: npm run test:sports
      - name: Push
        run: npm run test:push
      - name: Hardening
        run: npm run test:hardening
