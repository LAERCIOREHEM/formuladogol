name: Sul-Americana Final Production Smoke
on:
  pull_request:
    paths:
      - '.github/workflows/sula-final-production-smoke.yml'
      - 'research/fdg2027/sl02-release/sula_smoke.py'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy site (GitHub Pages)']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify historical archive and rolling-window regression
        run: python research/fdg2027/sl02-release/sula_smoke.py --self-test
      - name: Verify real site and historical contract
        run: python research/fdg2027/sl02-release/sula_smoke.py --live
