name: Reparar editorial R28

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reparar-editorial-r28.yml'
      - 'scripts/reparar_editorial_rodada_28.py'
      - 'scripts/editorial_ia.py'
      - 'scripts/gerar_analise_rodada.py'
      - 'scripts/validar_artefatos_analises.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-write-main
  cancel-in-progress: false

jobs:
  reparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o main mais recente
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar hotfix e proteções editoriais
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reparar_editorial_rodada_28.py \
            scripts/editorial_ia.py \
            scripts/gerar_analise_rodada.py \
            scripts/validar_artefatos_analises.py
          python scripts/reparar_editorial_rodada_28.py --self-test
          python scripts/editorial_ia.py --self-test
          python scripts/gerar_analise_rodada.py --self-test

      - name: Corrigir R28 e publicar de forma robusta
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            echo "Tentativa $i/5 sobre o main mais recente..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            python scripts/reparar_editorial_rodada_28.py
            python -m json.tool dados-br/analises.json >/dev/null
            python scripts/validar_artefatos_analises.py

            if [[ -z "$(git status --porcelain -- analises/brasileirao-2026-rodada-28.html dados-br/analises.json)" ]]; then
              echo "A R28 já está corrigida no main."
              exit 0
            fi

            git add -- analises/brasileirao-2026-rodada-28.html dados-br/analises.json
            git commit -m "Corrigir editorial da Rodada 28"
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rejeitado por atualização concorrente; repetindo sobre origin/main."
            sleep 3
          done

          echo "::error title=Falha ao corrigir R28::Não foi possível publicar o hotfix após 5 tentativas."
          exit 1

      - name: Disparar Deploy site
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
          echo "Deploy site disparado para a R28 corrigida."

      - name: Resumo
        if: always()
        shell: bash
        run: |
          {
            echo "## Hotfix editorial R28"
            echo
            echo "- Remove vazamento de instruções/metadados internos da matéria."
            echo "- Marca a R28 como editorial curado e reutilizável."
            echo "- Validação futura bloqueia prompt/schema/API/system/developer/user leakage."
            echo "- Parágrafo truncado passa a reprovar a publicação."
          } >> "$GITHUB_STEP_SUMMARY"
