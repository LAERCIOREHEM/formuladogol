name: Orquestrador inteligente Fórmula do Gol
run-name: Orquestrador · ${{ github.event_name }}

on:
  # NÃO há schedule aqui. O único cron externo (cron-job.org) chama este
  # workflow por workflow_dispatch. Toda a inteligência fica no script.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Só mostrar a decisão; não disparar workflow pesado'
        required: false
        default: false
        type: boolean
      sem_rede:
        description: 'Teste: não consultar ESPN nem histórico do GitHub'
        required: false
        default: false
        type: boolean
      agora:
        description: 'Teste opcional: data/hora ISO (ex.: 2026-08-09T23:15:00-03:00)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: fdg-orquestrador
  cancel-in-progress: true

jobs:
  decidir:
    name: Decidir próxima ação útil
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar o main mais recente
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar orquestrador offline
        run: |
          set -euo pipefail
          python -m py_compile scripts/orquestrar_workflows.py
          python -m json.tool dados-br/config-orquestrador.json >/dev/null
          python scripts/orquestrar_workflows.py --self-test

      - name: Calcular próxima ação
        id: plano
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SEM_REDE: ${{ inputs.sem_rede }}
          INPUT_AGORA: ${{ inputs.agora }}
        shell: bash
        run: |
          set -euo pipefail
          CMD=(python scripts/orquestrar_workflows.py --github-output "$GITHUB_OUTPUT")
          if [[ "${INPUT_SEM_REDE:-false}" == "true" ]]; then
            CMD+=(--sem-rede)
          fi
          if [[ -n "${INPUT_AGORA:-}" ]]; then
            CMD+=(--agora "$INPUT_AGORA")
          fi
          "${CMD[@]}"

      - name: Resumir decisão
        env:
          ACAO: ${{ steps.plano.outputs.acao }}
          MOTIVO: ${{ steps.plano.outputs.motivo }}
          EVENT_ID: ${{ steps.plano.outputs.event_id }}
          RODADA: ${{ steps.plano.outputs.rodada }}
          MODO: ${{ steps.plano.outputs.modo }}
        run: |
          {
            echo "## Orquestrador Fórmula do Gol"
            echo ""
            echo "- **Ação:** \`${ACAO:-none}\`"
            echo "- **Motivo:** ${MOTIVO:-sem motivo}"
            [[ -n "${EVENT_ID:-}" ]] && echo "- **event_id:** \`${EVENT_ID}\`"
            [[ -n "${RODADA:-}" ]] && echo "- **rodada:** \`${RODADA}\`"
            [[ -n "${MODO:-}" ]] && echo "- **modo:** \`${MODO}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disparar somente o workflow necessário
        if: ${{ inputs.dry_run != true && steps.plano.outputs.acao != 'none' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACAO: ${{ steps.plano.outputs.acao }}
          EVENT_ID: ${{ steps.plano.outputs.event_id }}
          RODADA: ${{ steps.plano.outputs.rodada }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ACAO" in
            atualizar_brasileirao)
              gh workflow run atualizar-brasileirao.yml --ref main
              ;;
            melhores_momentos)
              gh workflow run buscar-melhores-momentos-getv.yml --ref main -f modo=incremental
              ;;
            transmissao_aovivo)
              test -n "$EVENT_ID"
              gh workflow run buscar-transmissoes-aovivo-brasileirao.yml --ref main -f modo=aovivo -f event_id="$EVENT_ID"
              ;;
            transmissoes_tv)
              gh workflow run buscar-transmissoes-aovivo-brasileirao.yml --ref main -f modo=tv
              ;;
            editorial_copa_do_brasil)
              gh workflow run publicar-analise-copa-do-brasil.yml --ref main
              ;;
            editorial_rodada)
              test -n "$RODADA"
              gh workflow run publicar-analise-rodada.yml --ref main -f rodada="$RODADA"
              ;;
            *)
              echo "Ação desconhecida: $ACAO" >&2
              exit 1
              ;;
          esac
          echo "Workflow útil despachado: $ACAO"
