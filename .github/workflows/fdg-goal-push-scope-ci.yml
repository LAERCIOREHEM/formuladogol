name: FDG - Goal Push Scope UI Regression
on:
  push:
    branches: [main]
    paths:
      - 'js/br-alertas.js'
      - 'css/br-alertas.css'
      - 'aovivo.html'
      - 'alertas.html'
      - 'tests/test-fdg-live-goal-scope.mjs'
      - '.github/workflows/fdg-goal-push-scope-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and coverage regression
        run: |
          node --check js/br-alertas.js
          node tests/test-fdg-live-goal-scope.mjs
