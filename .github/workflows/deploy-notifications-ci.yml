name: Deploy Notification Incident CI

on:
  pull_request:
    paths:
      - 'scripts/deploy_notifications.py'
      - 'scripts/editorial_delivery.py'
      - 'tests/test_editorial_delivery.py'
      - 'tests/test_deploy_notifications.py'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-notifications-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/deploy_notifications.py'
      - 'scripts/editorial_delivery.py'
      - 'tests/test_editorial_delivery.py'
      - 'tests/test_deploy_notifications.py'
      - '.github/workflows/deploy-notifications-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-deploy-alerts:
    name: Certificar classificação, deduplicação e recuperação
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes offline — nenhum e-mail nem deploy
        run: |
          set -euo pipefail
          python -m py_compile scripts/deploy_notifications.py tests/test_deploy_notifications.py
          python -m unittest discover -s tests -p 'test_deploy_notifications.py' -v
          python -m unittest discover -s tests -p 'test_editorial_delivery.py' -v
      - name: Verificar contrato de notificação no workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/deploy.yml').read_text()
          assert 'actions: read' in text
          assert 'python scripts/deploy_notifications.py recovery' not in text
          assert 'python scripts/deploy_notifications.py failure' not in text
          assert 'GitHub Pages' in text
          # A disponibilidade e o envio de e-mails são da responsabilidade do Health Monitor.
          assert "O deploy do GitHub Pages falhou. A última versão publicada continua no ar." not in text
          assert text.count('if: failure()') == 0
          assert 'concurrency:\n  group: fdg-pages-publication\n  cancel-in-progress: false\n  queue: max' in text
          assert "- 'scripts/gerar_acuracia_af_previsao.py'" in text
          assert "- 'scripts/validar_publicacao_brasileirao.py'" in text
          assert 'run: python scripts/editorial_delivery.py' in text
          assert 'Registrar notificação editorial por e-mail [skip ci]' not in text
          print('PASS: notification only for real site incidents via Health Monitor, no per-deploy SMTP')
          PY
