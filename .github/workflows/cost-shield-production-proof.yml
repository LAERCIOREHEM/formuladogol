name: CF-COST-SHIELD R1 — Production Proof
on:
  pull_request:
    paths:
      - '.github/workflows/cost-shield-production-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify live coordinator and last billing sample
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            'https://push.formuladogol.com.br/v1/cost-shield/status' -o /tmp/cf-shield-status.json
          python3 -c 'import json; s=json.load(open("/tmp/cf-shield-status.json")); print(json.dumps({k:s.get(k) for k in ("version","halted","reason","lastCheckedAt","lastSuccessAt","hourlyUsd","dailyUsd","cycleUsd","d1Read","d1Written","cycleStart")},indent=2)); assert s.get("version")==1 and s.get("halted") is False and bool(s.get("lastSuccessAt")), "not confirmed: billing sample or coordinator healthy state"; print("CF-COST-SHIELD LIVE VERIFIED")'
