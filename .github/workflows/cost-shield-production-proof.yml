name: CF-COST-SHIELD R1 — Production Proof
on:
  pull_request:
    paths:
      - '.github/workflows/cost-shield-production-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Validate coordinator billing samples and latch
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            curl --fail --silent --show-error --max-time 15 \
              'https://push.formuladogol.com.br/v1/cost-shield/status' -o /tmp/cf-shield-status.json
            if python3 -c 'import json; s=json.load(open("/tmp/cf-shield-status.json")); raise SystemExit(0 if s.get("version")==1 and s.get("halted") is False and s.get("lastSuccessAt") else 1)'; then
              break
            fi
            echo "Coordinator waiting for verified billing sample ($attempt/48)"
            sleep 10
          done
          python3 -c 'import json; s=json.load(open("/tmp/cf-shield-status.json")); print(json.dumps({k:s.get(k) for k in ("version","halted","reason","lastCheckedAt","lastSuccessAt","hourlyUsd","dailyUsd","cycleUsd","d1Read","d1Written","cycleStart")},indent=2)); assert s.get("version")==1 and s.get("halted") is False and bool(s.get("lastSuccessAt")), "not confirmed: billing sample or controller healthy state"; print("CF-COST-SHIELD LIVE VERIFIED")'
