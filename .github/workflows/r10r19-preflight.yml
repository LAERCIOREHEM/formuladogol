name: R10R19 Preflight (temporary)
on:
  push:
    branches:
      - fix/r10r19-ai-provider-reliability
    paths:
      - 'cloudflare/push-worker/**'
      - '.github/workflows/r10r19-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare/push-worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Sports and AI regression tests
        run: npm run test:sports
