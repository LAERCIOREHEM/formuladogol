name: Sul-Americana 2026 Final Contract CI

on:
  pull_request:
    paths:
      - 'dados-br/ajustes-competicoes.json'
      - 'dados-br/correcoes/agenda-continentais-oficial.json'
      - 'dados-br/competicoes-af-previsao/sul-americana.json'
      - 'dados-br/agenda-clubes-br.json'
      - 'dados-br/transmissoes-tv.json'
      - 'transmissoes.json'
      - 'scripts/gerar_agenda_clubes_brasileirao.py'
      - 'scripts/atualizar_transmissoes_tv_brasileirao.py'
      - 'index.html'
      - 'js/br-agenda.js'
      - 'tests/test_sula_final_2026.py'
      - 'tests/test-sula-final-navigation.mjs'
      - '.github/workflows/sula-final-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install required Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-af-previsao.txt
      - name: Check syntax
        run: |
          python -m py_compile scripts/gerar_agenda_clubes_brasileirao.py scripts/atualizar_competicoes_af_previsao.py scripts/atualizar_transmissoes_tv_brasileirao.py tests/test_sula_final_2026.py
          node --check js/br-agenda.js
          node --check tests/test-sula-final-navigation.mjs
      - name: Verify final, documentary reconciliation, broadcast and no duplicates
        run: |
          python scripts/gerar_agenda_clubes_brasileirao.py --self-test
          python tests/test_sula_final_2026.py
      - name: Verify both user-facing competition filters
        run: node tests/test-sula-final-navigation.mjs
      - name: Validate JSON artifacts
        run: |
          for file in dados-br/ajustes-competicoes.json dados-br/correcoes/agenda-continentais-oficial.json dados-br/competicoes-af-previsao/sul-americana.json dados-br/agenda-clubes-br.json transmissoes.json dados-br/transmissoes-tv.json; do
            python -m json.tool "$file" >/dev/null
          done
