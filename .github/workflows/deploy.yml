              "https://formuladogol.com.br/copa2026/selecoes.html",
              "https://formuladogol.com.br/copa2026/palcos.html",
              "https://formuladogol.com.br/copa2026/museu.html",
          }
          expected_urls.add("https://formuladogol.com.br/analises/")
          expected_urls.update(artigo["url"] for artigo in artigos_analises)
          assert set(urls) == expected_urls, f"sitemap divergente: {urls!r}"

          # Guarda do lastmod: uma data ausente equivale a não informar frescor;
          # uma data congelada no passado é pior, porque afirma ao Google que
          # nada mudou. Uma data futura destrói a confiança no sinal.
          ns_sm = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          hoje_br = datetime.now(timezone(timedelta(hours=-3))).date()
          for nome_sitemap in ("sitemap.xml", "copa2026/sitemap.xml"):
              raiz_sm = ET.parse(site / nome_sitemap).getroot()
              nos = raiz_sm.findall("sm:url", ns_sm)
              assert nos, f"{nome_sitemap}: sem URLs"
              for no_sm in nos:
                  loc_sm = no_sm.find("sm:loc", ns_sm)
                  alvo = (loc_sm.text or "").strip() if loc_sm is not None else "?"
                  lm = no_sm.find("sm:lastmod", ns_sm)
                  assert lm is not None and (lm.text or "").strip(), f"{nome_sitemap}: {alvo} sem lastmod"
                  texto_lm = lm.text.strip()
                  try:
                      valor_lm = date.fromisoformat(texto_lm)
                  except ValueError:
                      raise AssertionError(f"{nome_sitemap}: {alvo} com lastmod inválido: {texto_lm!r}")
                  assert valor_lm <= hoje_br, f"{nome_sitemap}: {alvo} com lastmod no futuro: {texto_lm}"

          # Guarda dos dados estruturados. Motivo concreto: as páginas internas
          # referenciavam "#website" e "#organization" que não estavam definidos
          # em lugar nenhum, porque o index.html não tinha JSON-LD. Referência
          # pendurada não gera erro visível — só silenciosamente não funciona.
          paginas_ld = (
              "index.html", "estatisticas.html", "aovivo.html",
              "clubes.html", "museu.html", "sobre.html",
          )
          definidos = set()
          referencias = []
          blocos = 0
          for nome_ld in paginas_ld:
              conteudo_ld = (site / nome_ld).read_text(encoding="utf-8")
              achados = re.findall(
                  r'<script type="application/ld\+json">(.*?)</script>', conteudo_ld, re.S
              )
              assert achados, f"{nome_ld}: sem bloco JSON-LD"
              assert "0000-00-00" not in conteudo_ld, f"{nome_ld}: sentinela de data não substituída"
              for bruto_ld in achados:
                  blocos += 1
                  try:
                      dados_ld = json.loads(bruto_ld)
                  except json.JSONDecodeError as erro:
                      raise AssertionError(f"{nome_ld}: JSON-LD inválido: {erro}")
                  nos = dados_ld.get("@graph") if isinstance(dados_ld, dict) else None
                  if nos is None:
                      nos = [dados_ld] if isinstance(dados_ld, dict) else list(dados_ld)

                  def varrer(valor, dentro_de_no):
                      if isinstance(valor, dict):
                          identificador = valor.get("@id")
                          if identificador and valor.get("@type"):
                              definidos.add(identificador)
                          elif identificador and set(valor.keys()) == {"@id"}:
                              referencias.append((nome_ld, identificador))
                          for chave, item in valor.items():
                              if chave != "@id":
                                  varrer(item, True)
                      elif isinstance(valor, list):
                          for item in valor:
                              varrer(item, dentro_de_no)

                  for no_ld in nos:
                      varrer(no_ld, False)

          for origem_ld, referencia in referencias:
              assert referencia in definidos, (
                  f"{origem_ld}: JSON-LD referencia @id inexistente: {referencia}"
              )

          tipos_index = re.findall(r'"@type": "([A-Za-z]+)"', (site / "index.html").read_text(encoding="utf-8"))
          for obrigatorio in ("Organization", "WebSite", "WebPage", "Person"):
              assert obrigatorio in tipos_index, f"index.html: JSON-LD sem {obrigatorio}"
          conteudo_stats = (site / "estatisticas.html").read_text(encoding="utf-8")
          assert '"@type": "Dataset"' in conteudo_stats, "estatisticas.html: JSON-LD sem Dataset"
          conteudo_sobre = (site / "sobre.html").read_text(encoding="utf-8")
          assert '"@type": "AboutPage"' in conteudo_sobre, "sobre.html: JSON-LD sem AboutPage"
          assert "espaços de lazer" in conteudo_sobre, "sobre.html: identidade sem desambiguação explícita"
          print(f"OK JSON-LD: {blocos} blocos, {len(definidos)} entidades, {len(referencias)} referências resolvidas")
          assert not any(any(term in url for term in ("apostas", "bolao", "aniversariantes", "regras", "palpite", "pontos")) for url in urls)

          copa_root = ET.parse(site / "copa2026/sitemap.xml").getroot()
          copa_urls = [node.text for node in copa_root.findall("sm:url/sm:loc", ns)]
          expected_copa_urls = {url for url in expected_urls if "/copa2026/" in url}
          assert set(copa_urls) == expected_copa_urls, f"sitemap da Copa divergente: {copa_urls!r}"

          copa_robots = (site / "copa2026/robots.txt").read_text(encoding="utf-8")
          assert "Sitemap: https://formuladogol.com.br/copa2026/sitemap.xml" in copa_robots
          for route in ("admin.html", "palpite.html", "palpites.html", "pontos.html", "regras.html"):
              assert f"Disallow: /copa2026/{route}" in copa_robots, f"robots da Copa sem bloqueio: {route}"

          resultados_js = (site / "copa2026/js/resultados.js").read_text(encoding="utf-8")
          aovivo_js = (site / "copa2026/js/aovivo.js").read_text(encoding="utf-8")
          assert "copa_revelados" not in resultados_js, "Jogos da Copa ainda consulta dados privados"
          assert "palpites_mata.json" not in resultados_js, "Jogos da Copa ainda carrega dados privados"
          assert "copa_revelados" not in aovivo_js, "Ao vivo da Copa ainda consulta dados privados"
          public_copa_code = resultados_js + "\n" + aovivo_js
          assert not re.search(
              r"\b(palpit\w*|apost\w*|bol[aã]o|cerveja|vinho|pix)\b",
              public_copa_code,
              flags=re.I,
          ), "JavaScript público da Copa contém recurso não informativo"

          redirects = {"jogos": "jogos", "tabela": "tabela", "resultados": "resultados"}
          for route, view in redirects.items():
              text = (site / route / "index.html").read_text(encoding="utf-8")
              assert f"view={view}" in text, f"{route}: redirecionamento divergente"

          print("OK: pacote público, menus, identidade, privacidade, SEO e referências locais conferidos.")
          PY

          if find _site -type l | grep -q .; then
            echo "ERRO: existem symlinks dentro de _site."
            find _site -type l
            exit 1
          fi

          echo "Total de arquivos públicos:"
          find _site -type f | wc -l

          echo "Tamanho total do pacote público:"
          du -sh _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 15


      - name: Confirmar e avisar publicação editorial
        if: success()
        # A publicação já foi concluída pelo passo anterior. Confirmação pública
        # e e-mail são pós-deploy e jamais devem transformar uma publicação
        # válida em falha por ausência de secrets ou indisponibilidade externa.
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff-tree --no-commit-id --name-only -r HEAD | grep -Eq '^(analises/|dados-br/analises\.json$)'; then
            echo "Deploy sem alteração editorial; e-mail dispensado."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          obrigatorios = ('RESEND_API_KEY', 'EMAIL_DESTINO', 'EMAIL_REMETENTE')
          ausentes = [nome for nome in obrigatorios if not os.environ.get(nome, '').strip()]
          if ausentes:
              print('::warning title=E-mail editorial não enviado::Configure os secrets ' + ', '.join(ausentes) + '. A página foi publicada normalmente.')
              raise SystemExit(0)

          dados = json.loads(Path('dados-br/analises.json').read_text(encoding='utf-8'))
          artigo = max(dados['artigos'], key=lambda item: (item['rodada'], item['modificado_em']))
          url, rodada, titulo = artigo['url'], artigo['rodada'], artigo['titulo']
          marcador = f'data-fdg-analise-rodada="{rodada}"'
          confirmado = False
          for tentativa in range(1, 31):
              try:
                  req = urllib.request.Request(f'{url}?deploy={os.environ.get("GITHUB_RUN_ID", "")}', headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(req, timeout=15) as resposta:
                      confirmado = marcador in resposta.read().decode('utf-8', errors='replace')
              except urllib.error.URLError as erro:
                  print(f'Verificação pública {tentativa}/30: {erro}')
              if confirmado:
                  break
              time.sleep(15)
          if not confirmado:
              print(f'::warning title=Página ainda não confirmada::O deploy terminou, mas o marcador da rodada {rodada} ainda não apareceu em {url}. O e-mail não foi enviado.')
              raise SystemExit(0)
          corpo = {
              'from': os.environ['EMAIL_REMETENTE'],
              'to': [os.environ['EMAIL_DESTINO']],
              'subject': f'Fórmula do Gol: análise da rodada {rodada} publicada',
              'html': f'<p>Coloquei a nova página no ar.</p><p><strong>{titulo}</strong></p><p><a href="{url}">Abrir página publicada</a></p>',
          }
          req = urllib.request.Request('https://api.resend.com/emails', data=json.dumps(corpo).encode(), headers={'Authorization': 'Bearer ' + os.environ['RESEND_API_KEY'], 'Content-Type': 'application/json'}, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=30) as resposta:
                  if resposta.status not in (200, 201):
                      print(f'::warning title=E-mail editorial não enviado::Resend respondeu HTTP {resposta.status}. A página foi publicada normalmente.')
                      raise SystemExit(0)
          except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as erro:
              print(f'::warning title=E-mail editorial não enviado::{erro}. A página foi publicada normalmente.')
              raise SystemExit(0)
          print(f'Página confirmada e e-mail enviado: {url}')
          PY

      - name: Notificar buscadores via IndexNow
        if: success()
        run: |
          # IndexNow avisa Bing, Yandex, Naver e DuckDuckGo em uma única chamada.
          # O Google NÃO suporta o protocolo — o sitemap com lastmod real já
          # cobre o Google. A chave está em 78f8b10d32edcce04827b713eae52df5.txt na raiz do site.
          python - <<'INNER'
          import json, pathlib, urllib.request, urllib.error

          CHAVE = "78f8b10d32edcce04827b713eae52df5"
          HOST  = "formuladogol.com.br"
          URLS  = [
              "https://formuladogol.com.br/",
              "https://formuladogol.com.br/estatisticas.html",
              "https://formuladogol.com.br/aovivo.html",
              "https://formuladogol.com.br/clubes.html",
              "https://formuladogol.com.br/museu.html",
              "https://formuladogol.com.br/copa2026/",
          ]
          manifesto = json.loads(pathlib.Path("dados-br/analises.json").read_text(encoding="utf-8"))
          URLS.append("https://formuladogol.com.br/analises/")
          URLS.extend(item["url"] for item in (manifesto.get("artigos") or [])[-5:])

          payload = json.dumps({
              "host": HOST,
              "key": CHAVE,
              "keyLocation": "https://" + HOST + "/" + CHAVE + ".txt",
              "urlList": URLS,
          }).encode("utf-8")

          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  status = resp.status
          except urllib.error.HTTPError as e:
              status = e.code
          except urllib.error.URLError as e:
              print("IndexNow: erro de rede: " + str(e.reason))
              raise SystemExit(0)

          CODIGOS = {
              200: "OK - URLs aceitas",
              202: "OK - URLs recebidas e serao processadas",
              400: "AVISO - request mal formado",
              403: "AVISO - chave nao corresponde ao arquivo de verificacao",
              422: "AVISO - URLs nao pertencem ao host declarado",
              429: "AVISO - rate limit",
          }
          print("IndexNow: HTTP " + str(status) + " - " + CODIGOS.get(status, "codigo desconhecido"))
          print("URLs submetidas: " + str(len(URLS)))
          for u in URLS:
              print("  " + u)
          if status not in (200, 202):
              print("IndexNow: deploy continua mesmo com este aviso")
          INNER

      - name: Alertar falha de deploy por e-mail
        if: failure()
        continue-on-error: true
        env:
          BR_MOTIVO: Falha no deploy do GitHub Pages. O site continua exibindo a última versão publicada com sucesso.
          BR_WORKFLOW: Deploy GitHub Pages
          BR_SITE: Fórmula do Gol
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
        run: python scripts/gerenciar_status_brasileirao.py --error --notify
