# DEPLOY_SCHEMA: acuracia-v3-2026-08-08
name: Deploy site (GitHub Pages)

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'aovivo.html'
      - 'agenda.html'
      - 'estatisticas.html'
      - 'acuracia.html'
      - 'clubes.html'
      - 'museu.html'
      - 'sobre.html'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'news-sitemap.xml'
      - 'feed.xml'
      - 'tabela.json'
      - 'resultados.json'
      - 'jogos.json'
      - 'espn_eventos.json'
      - 'transmissoes.json'
      - 'favicon-formula-do-gol*'
      - 'apple-touch-icon-formula-do-gol.png'
      - 'og-image-formula-do-gol-v2.jpg'
      - 'img/**'
      - 'css/br-global.css'
      - 'css/br-jogos.css'
      - 'css/br-aovivo.css'
      - 'css/br-agenda.css'
      - 'css/br-estatisticas.css'
      - 'css/br-acuracia.css'
      - 'css/br-institucional.css'
      - 'css/br-sobre.css'
      - 'css/br-analises.css'
      - 'js/br-aovivo.js'
      - 'js/br-agenda.js'
      - 'js/br-analises.js'
      - 'js/br-clube-retorno.js'
      - 'js/br-clubes.js'
      - 'js/br-config.js'
      - 'js/br-estatisticas.js'
      - 'js/br-acuracia.js'
      - 'js/br-feedback.js'
      - 'js/br-menu.js'
      - 'js/br-museu.js'
      - 'dados-br/**'
      - 'analises/**'
      - 'jogos/**'
      - 'tabela/**'
      - 'resultados/**'
      - 'copa2026/**'

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: read

# Uma publicação nova substitui uma anterior ainda em andamento. O deploy nasce
# somente de push com arquivo público alterado (ou chamada manual), evitando fila
# de versões obsoletas e execuções cinzas criadas por workflow_run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry2.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Montar site público
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/css _site/js _site/dados-br _site/copa2026/css _site/copa2026/js _site/copa2026/dados _site/copa2026/img

          PUBLIC_ROOT=(
            index.html
            aovivo.html
            agenda.html
            estatisticas.html
            acuracia.html
            clubes.html
            museu.html
            sobre.html
            78f8b10d32edcce04827b713eae52df5.txt
            CNAME
            robots.txt
            sitemap.xml
            news-sitemap.xml
            feed.xml
            tabela.json
            resultados.json
            jogos.json
            espn_eventos.json
            transmissoes.json
            favicon-formula-do-gol.ico
            favicon-formula-do-gol-16.png
            favicon-formula-do-gol-32.png
            favicon-formula-do-gol-96.png
            favicon-formula-do-gol-192.png
            favicon-formula-do-gol-512.png
            apple-touch-icon-formula-do-gol.png
            og-image-formula-do-gol-v2.jpg
          )

          PUBLIC_CSS=(
            css/br-global.css
            css/br-jogos.css
            css/br-aovivo.css
            css/br-agenda.css
            css/br-estatisticas.css
            css/br-acuracia.css
            css/br-institucional.css
            css/br-sobre.css
            css/br-analises.css
          )

          PUBLIC_JS=(
            js/br-aovivo.js
            js/br-agenda.js
            js/br-analises.js
            js/br-clube-retorno.js
            js/br-clubes.js
            js/br-config.js
            js/br-estatisticas.js
            js/br-acuracia.js
            js/br-feedback.js
            js/br-menu.js
            js/br-museu.js
          )

          PUBLIC_DATA=(
            dados-br/agenda-clubes-br.json
            dados-br/auditoria-estatisticas.json
            dados-br/auditoria-modelos-af-previsao.json
            dados-br/auditoria-probabilidades.json
            dados-br/avaliacao-af-previsao.json
            dados-br/acuracia-af-previsao.json
            dados-br/clubes.json
            dados-br/elencos.json
            dados-br/estatisticas-competicao.json
            dados-br/historico-probabilidades.json
            dados-br/historico-probabilidades-jogos.json
            dados-br/historico-probabilidades-continentais.json
            dados-br/historico-ranking-desempenho.json
            dados-br/jogos-detalhes.json
            dados-br/lideres-jogadores.json
            dados-br/mascotes.json
            dados-br/melhores-momentos-manual.json
            dados-br/melhores-momentos.json
            dados-br/museu-brasileirao.json
            dados-br/probabilidades-brasileirao.json
            dados-br/probabilidades-jogos.json
            dados-br/probabilidades-por-pontuacao.json
            dados-br/ranking-desempenho.json
            dados-br/resultados-manuais.json
            dados-br/status-atualizacao.json
            dados-br/transmissoes-aovivo-manual.json
            dados-br/transmissoes-aovivo.json
            dados-br/transmissoes-tv.json
            dados-br/analises.json
          )

          PUBLIC_ROUTES=(jogos tabela resultados)

          COPA_PUBLIC_FILES=(
            copa2026/index.html
            copa2026/aovivo.html
            copa2026/onde-assistir.html
            copa2026/estatisticas.html
            copa2026/selecoes.html
            copa2026/palcos.html
            copa2026/museu.html
            copa2026/favicon-copa.png
            copa2026/favicon-copa-32.png
            copa2026/og-copa-publico-v2.png
            copa2026/robots.txt
            copa2026/sitemap.xml
            copa2026/css/copa.css
            copa2026/js/aovivo.js
            copa2026/js/config.js
            copa2026/js/engine.js
            copa2026/js/estatisticas.js
            copa2026/js/feedback.js
            copa2026/js/image-preview.js
            copa2026/js/jogo-stats.js
            copa2026/js/museu.js
            copa2026/js/onde-assistir.js
            copa2026/js/palcos.js
            copa2026/js/resultados.js
            copa2026/js/selecoes.js
            copa2026/js/times.js
            copa2026/dados/agenda_mata.json
            copa2026/dados/agenda_workflow_copa.json
            copa2026/dados/correcoes-jogadores.json
            copa2026/dados/elencos.json
            copa2026/dados/estatisticas.json
            copa2026/dados/estrutura_mata_mata.json
            copa2026/dados/fairplay.json
            copa2026/dados/jogos-completos.json
            copa2026/dados/jogos-detalhes.json
            copa2026/dados/lives.json
            copa2026/dados/melhores-momentos.json
            copa2026/dados/museu-copa.json
            copa2026/dados/paises.json
            copa2026/dados/palcos.json
            copa2026/dados/palcos_creditos.json
            copa2026/dados/ranking-desempenho.json
            copa2026/dados/ranking-selecoes-historico.json
            copa2026/dados/rostos.json
            copa2026/dados/rostos_creditos.json
            copa2026/dados/selecoes.json
            copa2026/dados/terceiros_map.json
            copa2026/dados/transmissoes.json
            copa2026/img/header-copa26-formula-do-gol.png
          )

          COPA_IMAGE_DIRS=(
            copa2026/img/bolas
            copa2026/img/jogadores
            copa2026/img/mascotes
            copa2026/img/palcos
          )

          for item in "${PUBLIC_ROOT[@]}" "${PUBLIC_CSS[@]}" "${PUBLIC_JS[@]}" "${PUBLIC_DATA[@]}"; do
            if [[ ! -f "$item" ]]; then
              echo "ERRO: arquivo público obrigatório ausente: $item"
              exit 1
            fi
            cp -a "$item" "_site/$item"
          done

          if [[ ! -d img ]]; then
            echo "ERRO: diretório público img ausente."
            exit 1
          fi
          cp -a img _site/

          if [[ ! -d analises ]] || [[ ! -f analises/index.html ]]; then
            echo "ERRO: seção pública de análises ausente."
            exit 1
          fi
          cp -a analises _site/

          for route in "${PUBLIC_ROUTES[@]}"; do
            if [[ ! -f "$route/index.html" ]]; then
              echo "ERRO: rota pública obrigatória ausente: $route/index.html"
              exit 1
            fi
            mkdir -p "_site/$route"
            cp -a "$route/index.html" "_site/$route/index.html"
          done

          for item in "${COPA_PUBLIC_FILES[@]}"; do
            if [[ ! -f "$item" ]]; then
              echo "ERRO: arquivo público da Copa ausente: $item"
              exit 1
            fi
            mkdir -p "_site/$(dirname "$item")"
            cp -a "$item" "_site/$item"
          done

          for item in "${COPA_IMAGE_DIRS[@]}"; do
            if [[ ! -d "$item" ]]; then
              echo "ERRO: diretório público da Copa ausente: $item"
              exit 1
            fi
            cp -a "$item" "_site/$(dirname "$item")/"
          done

          touch _site/.nojekyll

          # Estado do próprio deploy, publicado no artefato para o diagnóstico operacional.
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          site = Path('_site')
          digest = hashlib.sha256()
          for rel in ('tabela.json', 'resultados.json', 'jogos.json', 'espn_eventos.json'):
              path = site / rel
              digest.update(rel.encode('utf-8'))
              if path.exists():
                  digest.update(path.read_bytes())
          run_url = ''
          if os.environ.get('GITHUB_REPOSITORY') and os.environ.get('GITHUB_RUN_ID'):
              run_url = f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com').rstrip('/')}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          payload = {
              'schema_version': 1,
              'site': 'Fórmula do Gol',
              'workflow': 'Deploy GitHub Pages',
              'status': 'ok',
              'nivel': 'normal',
              'publicado_em': datetime.now(timezone(timedelta(hours=-3))).replace(microsecond=0).isoformat(),
              'snapshot_hash_artefato': digest.hexdigest(),
              'source_commit': os.environ.get('GITHUB_SHA', ''),
              'run_url': run_url,
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
          }
          target = site / 'dados-br' / 'status-deploy.json'
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Gerar lastmod dos sitemaps (Acurácia v3)
        run: |
          echo "DEPLOY_SCHEMA=acuracia-v3-2026-08-08"
          # O lastmod é derivado dos timestamps reais dos arquivos de dados que
          # cada página consome, e não da data do deploy. Assim o sinal enviado
          # ao Google é verdadeiro: páginas de dados diários mudam de data todo
          # dia; páginas históricas (museu) mantêm a data real da última revisão.
          python - <<'PY'
          import glob
          import json
          import pathlib
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone

          NS = "http://www.sitemaps.org/schemas/sitemap/0.9"
          FUSO_BR = timezone(timedelta(hours=-3))
          CAMPOS_DATA = ("atualizado_em", "gerado_em")
          site = pathlib.Path("_site")

          # Dependências reais de dados por página, extraídas dos fetch() de cada
          # página e dos seus JS. Se um arquivo for renomeado, o deploy falha aqui
          # em vez de publicar silenciosamente uma data errada.
          DEPS = {
              "https://formuladogol.com.br/": [
                  "tabela.json", "jogos.json", "resultados.json", "espn_eventos.json",
                  "dados-br/probabilidades-jogos.json", "dados-br/ranking-desempenho.json",
              ],
              "https://formuladogol.com.br/agenda.html": [
                  "dados-br/agenda-clubes-br.json", "dados-br/transmissoes-tv.json",
                  "dados-br/transmissoes-aovivo.json",
              ],
              "https://formuladogol.com.br/aovivo.html": [
                  "jogos.json", "espn_eventos.json", "dados-br/agenda-clubes-br.json",
                  "dados-br/probabilidades-jogos.json", "dados-br/probabilidades-brasileirao.json",
                  "dados-br/transmissoes-aovivo.json", "dados-br/transmissoes-tv.json",
              ],
              "https://formuladogol.com.br/estatisticas.html": [
                  "dados-br/probabilidades-brasileirao.json", "dados-br/ranking-desempenho.json",
                  "dados-br/lideres-jogadores.json", "dados-br/estatisticas-competicao.json",
                  "dados-br/probabilidades-por-pontuacao.json", "resultados.json",
              ],
              "https://formuladogol.com.br/acuracia.html": [
                  "dados-br/acuracia-af-previsao.json",
              ],
              "https://formuladogol.com.br/clubes.html": [
                  "dados-br/clubes.json", "dados-br/elencos.json",
                  "dados-br/ranking-desempenho.json", "dados-br/probabilidades-brasileirao.json",
                  "tabela.json", "espn_eventos.json",
              ],
              "https://formuladogol.com.br/museu.html": [
                  "dados-br/museu-brasileirao.json",
              ],
          }

          # Página institucional estática: a data é a revisão real deste conteúdo,
          # não a data de cada deploy automático dos dados esportivos.
          STATIC_LASTMOD = {
              "https://formuladogol.com.br/sobre.html": "2026-08-01",
          }

          analises_manifesto = json.loads((site / "dados-br/analises.json").read_text(encoding="utf-8"))
          artigos_analise = {
              item["url"]: str(item["modificado_em"])[:10]
              for item in (analises_manifesto.get("artigos") or [])
          }
          if not artigos_analise:
              raise SystemExit("ERRO lastmod: manifesto editorial vazio")
          data_hub_analises = max(artigos_analise.values())

          def data_do_arquivo(rel):
              caminho = site / rel
              if not caminho.is_file():
                  raise SystemExit(f"ERRO lastmod: dependência ausente no pacote público: {rel}")
              try:
                  dados = json.loads(caminho.read_text(encoding="utf-8"))
              except Exception as erro:
                  raise SystemExit(f"ERRO lastmod: JSON inválido em {rel}: {erro}")
              if not isinstance(dados, dict):
                  return None
              for campo in CAMPOS_DATA:
                  bruto = str(dados.get(campo) or "").strip()
                  if not bruto:
                      continue
                  try:
                      momento = datetime.fromisoformat(bruto.replace("Z", "+00:00"))
                  except ValueError:
                      continue
                  if momento.tzinfo is None:
                      momento = momento.replace(tzinfo=FUSO_BR)
                  return momento.astimezone(FUSO_BR)
              return None

          agora = datetime.now(FUSO_BR)

          def data_da_pagina(dependencias, rotulo):
              datas = [d for d in (data_do_arquivo(rel) for rel in dependencias) if d]
              if not datas:
                  raise SystemExit(f"ERRO lastmod: nenhuma data válida para {rotulo}")
              # Data futura indica relógio ou dado inconsistente: limita a hoje.
              return min(max(datas), agora).strftime("%Y-%m-%d")

          def aplicar(caminho_sitemap, resolver):
              ET.register_namespace("", NS)
              arvore = ET.parse(caminho_sitemap)
              raiz = arvore.getroot()
              aplicadas = 0
              for no in raiz.findall(f"{{{NS}}}url"):
                  loc = no.find(f"{{{NS}}}loc")
                  if loc is None or not (loc.text or "").strip():
                      raise SystemExit(f"ERRO lastmod: <url> sem <loc> em {caminho_sitemap}")
                  url = loc.text.strip()
                  antigo = no.find(f"{{{NS}}}lastmod")
                  lastmod_existente = (antigo.text or "").strip() if antigo is not None else ""
                  valor = resolver(url, lastmod_existente)
                  if antigo is not None:
                      no.remove(antigo)
                  novo = ET.Element(f"{{{NS}}}lastmod")
                  novo.text = valor
                  no.insert(list(no).index(loc) + 1, novo)
                  aplicadas += 1
                  print(f"  {url} -> {valor}")
              ET.indent(raiz, space="  ")
              arvore.write(caminho_sitemap, encoding="utf-8", xml_declaration=True)
              return aplicadas

          # O módulo da Copa compartilha os mesmos JS e arquivos de dados entre as
          # páginas, então não há como diferenciar por página: usa-se a data mais
          # recente do conjunto de dados do módulo. Calculado primeiro porque as
          # URLs da Copa também constam do sitemap principal.
          arquivos_copa = sorted(glob.glob(str(site / "copa2026/dados/*.json")))
          if not arquivos_copa:
              raise SystemExit("ERRO lastmod: nenhum arquivo de dados da Copa no pacote público")
          datas_copa = []
          for absoluto in arquivos_copa:
              rel = pathlib.Path(absoluto).relative_to(site).as_posix()
              data = data_do_arquivo(rel)
              if data:
                  datas_copa.append(data)
          if not datas_copa:
              raise SystemExit("ERRO lastmod: nenhuma data válida nos dados da Copa")
          data_copa = min(max(datas_copa), agora).strftime("%Y-%m-%d")

          # Fallback de segurança: uma página nova no sitemap nunca deve derrubar
          # todo o Pages só porque seu mapeamento de lastmod ainda não foi cadastrado.
          # Páginas conhecidas continuam usando suas dependências reais; para uma URL
          # raiz .html desconhecida preservamos um lastmod válido já existente e, se
          # ele não existir, usamos o status operacional do site como referência
          # conservadora e emitimos warning visível no log.
          try:
              data_status_global = data_da_pagina(["dados-br/status-atualizacao.json"], "status global")
          except SystemExit:
              data_status_global = agora.strftime("%Y-%m-%d")

          def resolver(url, lastmod_existente=""):
              if url in DEPS:
                  return data_da_pagina(DEPS[url], url)
              if url in STATIC_LASTMOD:
                  return STATIC_LASTMOD[url]
              if url == "https://formuladogol.com.br/analises/":
                  return data_hub_analises
              if url in artigos_analise:
                  return artigos_analise[url]
              if url.startswith("https://formuladogol.com.br/copa2026/"):
                  return data_copa

              if re.fullmatch(r"\d{4}-\d{2}-\d{2}", lastmod_existente or ""):
                  print(f"::warning::lastmod sem mapeamento explícito para {url}; preservando {lastmod_existente}.")
                  return lastmod_existente

              if url.startswith("https://formuladogol.com.br/"):
                  rel = url.removeprefix("https://formuladogol.com.br/").split("?", 1)[0].split("#", 1)[0]
                  if rel and (site / rel).is_file():
                      print(
                          f"::warning::lastmod sem mapeamento explícito para {url}; "
                          f"usando status global {data_status_global}."
                      )
                      return data_status_global

              raise SystemExit(f"ERRO lastmod: URL externa ou inválida sem mapeamento: {url}")

          print("sitemap principal:")
          total_br = aplicar(site / "sitemap.xml", resolver)
          print("sitemap da Copa:")
          total_copa = aplicar(site / "copa2026/sitemap.xml", resolver)

          print(f"OK lastmod aplicado: {total_br} URLs no sitemap principal, {total_copa} no da Copa")

          # O dateModified do Dataset (JSON-LD) usa a mesma data honesta do lastmod
          # da página. Uma data estática viraria mentira no dia seguinte, e o
          # frescor é justamente o diferencial declarado do projeto.
          URL_STATS = "https://formuladogol.com.br/estatisticas.html"
          data_stats = data_da_pagina(DEPS[URL_STATS], URL_STATS)
          pagina_stats = site / "estatisticas.html"
          html_stats = pagina_stats.read_text(encoding="utf-8")
          # Substituição por padrão (e não pela sentinela literal) para o passo ser
          # idempotente: reexecutar apenas reescreve o mesmo valor, em vez de falhar.
          PADRAO_DATA = r'"dateModified": "\d{4}-\d{2}-\d{2}"'
          ocorrencias = len(re.findall(PADRAO_DATA, html_stats))
          if ocorrencias != 1:
              raise SystemExit(
                  "ERRO dateModified: esperado exatamente 1 campo dateModified em "
                  f"estatisticas.html, encontrados {ocorrencias}"
              )
          html_stats = re.sub(PADRAO_DATA, f'"dateModified": "{data_stats}"', html_stats)
          pagina_stats.write_text(html_stats, encoding="utf-8")
          print(f"OK dateModified do Dataset: {data_stats}")
          PY

      # CAUSA RAIZ do "Timeout reached" com status deployment_in_progress:
      # o pacote publicado tem ~181 MB em 1.270 arquivos, e o actions/deploy-pages
      # tem teto RIGIDO de 600000 ms (10 min) para o sincronismo — valores maiores
      # sao reduzidos silenciosamente. Nao ha como esperar mais; a unica saida e
      # entregar menos bytes.
      #
      # A otimizacao roda AQUI, sobre _site, e nao sobre o repositorio: o acervo
      # original em alta resolucao continua versionado e intacto, e o artefato
      # sai leve em toda publicacao, sem depender de ninguem lembrar de rodar o
      # script antes do commit. Custo medido: ~26 s para 1.140 imagens.
      - name: Otimizar imagens do pacote publico
        shell: bash
        run: |
          set -euo pipefail
          # Alguns ambientes marcam o Python do sistema como "externally managed"
          # (PEP 668) e recusam o pip direto. A segunda forma cobre esse caso.
          python3 -m pip install --quiet --disable-pip-version-check pillow \
            || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pillow
          python3 scripts/otimizar_imagens.py --raiz _site --pastas img copa2026/img

      - name: Validar pacote público antes do upload
        shell: bash
        run: |
          set -euo pipefail

          FORBIDDEN=(
            _site/apostas.html
            _site/regras.html
            _site/membros.json
            _site/bolao
            _site/aniversariantes
            _site/docs
            _site/css/br-apostas.css
            _site/js/br-apostas.js
            _site/dados-br/apostas-config.json
            _site/dados-br/apuracao.json
            _site/dados-br/participantes-bolao-classificacao.json
            _site/dados-br/probabilidades-bolao.json
            _site/dados-br/ranking-apostas.json
            _site/copa2026/admin.html
