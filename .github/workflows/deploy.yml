              nav_match = re.search(r'<nav\b[^>]*class="[^"]*\bnav\b[^"]*"[^>]*>(.*?)</nav>', text, flags=re.I | re.S)
              assert nav_match, f"{page_name}: menu editorial ausente"
              nav = " ".join(re.sub(r"<[^>]+>", " ", nav_match.group(1)).split())
