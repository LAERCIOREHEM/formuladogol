          assert '"@type": "Dataset"' in conteudo_stats, "estatisticas.html: JSON-LD sem Dataset"
          conteudo_sobre = (site / "sobre.html").read_text(encoding="utf-8")
          assert '"@type": "AboutPage"' in conteudo_sobre, "sobre.html: JSON-LD sem AboutPage"
          assert "espaços de lazer" in conteudo_sobre, "sobre.html: identidade sem desambiguação explícita"
          print(f"OK JSON-LD: {blocos} blocos, {len(definidos)} entidades, {len(referencias)} referências resolvidas")
          assert not any(any(term in url for term in ("apostas", "bolao", "aniversariantes", "regras", "palpite", "pontos")) for url in urls)

          copa_root = ET.parse(site / "copa2026/sitemap.xml").getroot()
          copa_urls = [node.text for node in copa_root.findall("sm:url/sm:loc", ns)]
          expected_copa_urls = {url for url in expected_urls if "/copa2026/" in url}
          assert set(copa_urls) == expected_copa_urls, f"sitemap da Copa divergente: {copa_urls!r}"

          copa_robots = (site / "copa2026/robots.txt").read_text(encoding="utf-8")
          assert "Sitemap: https://formuladogol.com.br/copa2026/sitemap.xml" in copa_robots
          for route in ("admin.html", "palpite.html", "palpites.html", "pontos.html", "regras.html"):
              assert f"Disallow: /copa2026/{route}" in copa_robots, f"robots da Copa sem bloqueio: {route}"

          resultados_js = (site / "copa2026/js/resultados.js").read_text(encoding="utf-8")
          aovivo_js = (site / "copa2026/js/aovivo.js").read_text(encoding="utf-8")
          assert "copa_revelados" not in resultados_js, "Jogos da Copa ainda consulta dados privados"
          assert "palpites_mata.json" not in resultados_js, "Jogos da Copa ainda carrega dados privados"
          assert "copa_revelados" not in aovivo_js, "Ao vivo da Copa ainda consulta dados privados"
          public_copa_code = resultados_js + "\n" + aovivo_js
          assert not re.search(
              r"\b(palpit\w*|apost\w*|bol[aã]o|cerveja|vinho|pix)\b",
              public_copa_code,
              flags=re.I,
          ), "JavaScript público da Copa contém recurso não informativo"

          redirects = {"jogos": "jogos", "tabela": "tabela", "resultados": "resultados"}
          for route, view in redirects.items():
              text = (site / route / "index.html").read_text(encoding="utf-8")
              assert f"view={view}" in text, f"{route}: redirecionamento divergente"

          print("OK: pacote público, menus, identidade, privacidade, SEO e referências locais conferidos.")
          PY

          if find _site -type l | grep -q .; then
            echo "ERRO: existem symlinks dentro de _site."
            find _site -type l
            exit 1
          fi

          echo "Total de arquivos públicos:"
          find _site -type f | wc -l

          echo "Tamanho total do pacote público:"
          du -sh _site

          # Guarda de peso. Pacote grande alonga a fase de sincronismo do Pages
          # e aumenta a janela em que outra implantação pode cancelar esta.
          BYTES=$(du -sb _site | cut -f1)
          MB=$((BYTES / 1024 / 1024))
          echo "Peso do artefato: ${MB} MB"
          if (( MB > 400 )); then
            echo "ERRO: artefato com ${MB} MB (limite operacional 400 MB)."
            echo "Rode 'python scripts/otimizar_imagens.py' e comite as imagens otimizadas."
            exit 1
          fi
          if (( MB > 120 )); then
            echo "::warning::Artefato com ${MB} MB. Acima de 120 MB o deploy do Pages fica lento; considere rodar scripts/otimizar_imagens.py."
          fi

      # CAUSA RAIZ do erro "Deployment cancelled." logo na primeira consulta de
      # status: existe uma SEGUNDA fonte criando implantações do Pages neste
      # repositório. Quando a origem do Pages está em "Deploy from a branch", o
      # GitHub mantém ativo o workflow embutido "pages build and deployment",
      # que dispara a cada push em main (e os robôs deste repositório commitam
      # em main o tempo todo). As duas implantações disputam a mesma fila serial
      # e o serviço cancela a mais antiga — que é justamente a criada aqui.
      #
      # actions/configure-pages NÃO corrige isso: com enablement padrão ele
      # apenas lê as configurações. Aqui a origem é fixada explicitamente em
      # build_type=workflow, o que desativa o workflow embutido de vez.
      - name: Fixar origem do Pages em GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          atual=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type // "desconhecido"' 2>/dev/null || echo "sem_pages")
          echo "build_type atual: ${atual}"

          if [[ "$atual" == "workflow" ]]; then
            echo "OK: origem já é GitHub Actions. Nenhum workflow embutido concorrendo."
            exit 0
          fi

          echo "::warning::Origem do Pages estava em '${atual}'. Corrigindo para 'workflow'."
          if gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "Origem corrigida para GitHub Actions."
          else
            echo "::warning::Não foi possível alterar automaticamente (o GITHUB_TOKEN pode não ter permissão de administração)."
            echo "::warning::Ajuste manualmente em Settings > Pages > Build and deployment > Source = GitHub Actions."
          fi

      - name: Destravar fila do Pages (cancelar implantações concorrentes)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          # Implantações presas em queued/in_progress bloqueiam a fila serial do
          # Pages e cancelam ou atrasam esta publicação. São canceladas aqui,
          # antes de criarmos a nossa, para que a nossa seja a única na fila.
          LIMITE=$(date -u -d '5 minutes ago' +%s)
          PRESOS=0

          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=30" \
            --jq '.[] | [.id, .sha, .created_at] | @tsv' > /tmp/deployments.tsv || exit 0

          while IFS=$'\t' read -r id sha criado; do
            [[ -z "${id:-}" ]] && continue
            [[ "$sha" == "$GITHUB_SHA" ]] && continue

            estado=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" \
              --jq '.[0].state // "sem_status"' 2>/dev/null || echo "sem_status")

            case "$estado" in
              queued|in_progress|pending|waiting) ;;
              *) continue ;;
            esac

            nascido=$(date -u -d "$criado" +%s 2>/dev/null || echo 0)
            if (( nascido == 0 || nascido > LIMITE )); then
              continue
            fi

            echo "Cancelando implantacao concorrente: id=${id} sha=${sha} estado=${estado} criada_em=${criado}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${sha}/cancel" >/dev/null 2>&1 \
              || echo "  (nao foi possivel cancelar ${sha}; seguindo assim mesmo)"
            PRESOS=$((PRESOS + 1))
          done < /tmp/deployments.tsv

          if (( PRESOS == 0 )); then
            echo "Fila do Pages limpa: nenhuma implantacao concorrente encontrada."
          else
            echo "Implantacoes concorrentes canceladas: ${PRESOS}."
            sleep 20
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

      # O aviso de Node 20 emitido por actions/deploy-pages@v4 é apenas de
      # compatibilidade: o runner do GitHub já executa a action em Node 24.
      # Uma implantação do Pages pode, excepcionalmente, ser cancelada pelo
      # serviço depois de o artefato ser aceito. As duas primeiras tentativas não
      # encerram o job; se isso ocorrer, aguardamos e criamos uma nova
      # implantação usando exatamente o mesmo artefato validado.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 20
          reporting_interval: 5000
        timeout-minutes: 12

      - name: Aguardar antes de repetir deploy cancelado
        if: steps.deployment.outcome == 'failure'
        shell: bash
        run: sleep 60

      - name: Repetir deploy no GitHub Pages
        id: deployment_retry
        continue-on-error: true
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 20
          reporting_interval: 5000
        timeout-minutes: 12

      - name: Aguardar antes da última tentativa de deploy
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        shell: bash
        run: sleep 120

      # Terceira e última tentativa: esta NÃO tem continue-on-error, portanto
      # falha aqui reprova o job e dispara o alerta.
      - name: Última tentativa de deploy no GitHub Pages
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 20
          reporting_interval: 5000
        timeout-minutes: 12

      - name: Confirmar e avisar publicação editorial
        if: success()
        # A publicação já foi concluída pelo passo anterior. Confirmação pública
        # e e-mail são pós-deploy e jamais devem transformar uma publicação
        # válida em falha por ausência de secrets ou indisponibilidade externa.
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO_SUGESTOES }}
          NOTIFICACOES_ANALISE: dados-br/analises-notificacoes.json
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import os
          import smtplib
          import ssl
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from email.message import EmailMessage
          from email.utils import formataddr
          from pathlib import Path

          obrigatorios = ('SMTP_HOST', 'SMTP_PORT', 'SMTP_USER', 'SMTP_PASS', 'EMAIL_DESTINO')
          ausentes = [nome for nome in obrigatorios if not os.environ.get(nome, '').strip()]
          if ausentes:
              print('::warning title=E-mail editorial não enviado::Configure os secrets ' + ', '.join(ausentes) + '. A página foi publicada normalmente.')
              raise SystemExit(0)

          dados = json.loads(Path('dados-br/analises.json').read_text(encoding='utf-8'))
          artigos = dados.get('artigos') or []
          caminho_notificacoes = Path(os.environ['NOTIFICACOES_ANALISE'])
          notificacoes = json.loads(caminho_notificacoes.read_text(encoding='utf-8'))

          def id_editorial(item):
              valor = str(item.get('id_editorial') or '').strip()
              if valor:
                  return valor
              numero = int(item.get('rodada') or 0)
              return f'brasileirao-2026-rodada-{numero}' if numero else ''

          ids_notificados = {id_editorial(item) for item in notificacoes.get('notificacoes') or []}
          pendentes = [item for item in artigos if id_editorial(item) and id_editorial(item) not in ids_notificados]
          pendentes.sort(key=lambda item: (str(item.get('publicado_em') or ''), str(item.get('modificado_em') or '')))
          if not pendentes:
              print('Nenhum editorial novo aguardando e-mail.')
              raise SystemExit(0)

          porta = int(os.environ['SMTP_PORT'])
          contexto = ssl.create_default_context()
          enviados = 0
          for artigo in pendentes:
              editorial_id = id_editorial(artigo)
              rodada = int(artigo.get('rodada') or 0)
              url, titulo = artigo['url'], artigo['titulo']
              assunto = str(artigo.get('email_assunto') or (f'Fórmula do Gol: análise da rodada {rodada} publicada' if rodada else 'Fórmula do Gol: nova análise publicada'))
              chamada = str(artigo.get('email_chamada') or 'Uma nova análise do Fórmula do Gol está no ar.')
              marcador = f'data-fdg-editorial-id="{editorial_id}"'
              confirmado = False
              for tentativa in range(1, 31):
                  try:
                      req = urllib.request.Request(f'{url}?deploy={os.environ.get("GITHUB_RUN_ID", "")}', headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(req, timeout=15) as resposta:
                          confirmado = marcador in resposta.read().decode('utf-8', errors='replace')
                  except urllib.error.URLError as erro:
                      print(f'Verificação pública de {editorial_id} {tentativa}/30: {erro}')
                  if confirmado:
                      break
                  time.sleep(15)
              if not confirmado:
                  print(f'::warning title=Página ainda não confirmada::O marcador {editorial_id} ainda não apareceu em {url}; este e-mail ficou pendente.')
                  continue

              mensagem = EmailMessage()
              mensagem['From'] = formataddr(('Fórmula do Gol', os.environ['SMTP_USER']))
              mensagem['To'] = os.environ['EMAIL_DESTINO']
              mensagem['Subject'] = assunto
              mensagem.set_content(f'{chamada}\n\n{titulo}\n\n{url}')
              mensagem.add_alternative(
                  f'<p>{html.escape(chamada)}</p><p><strong>{html.escape(titulo)}</strong></p><p><a href="{html.escape(url, quote=True)}">Abrir página publicada</a></p>',
                  subtype='html',
              )
              try:
                  if porta == 465:
                      with smtplib.SMTP_SSL(os.environ['SMTP_HOST'], porta, context=contexto, timeout=30) as servidor:
                          servidor.login(os.environ['SMTP_USER'], os.environ['SMTP_PASS'])
                          servidor.send_message(mensagem)
                  else:
                      with smtplib.SMTP(os.environ['SMTP_HOST'], porta, timeout=30) as servidor:
                          servidor.ehlo()
                          servidor.starttls(context=contexto)
                          servidor.ehlo()
                          servidor.login(os.environ['SMTP_USER'], os.environ['SMTP_PASS'])
                          servidor.send_message(mensagem)
              except (OSError, ValueError, smtplib.SMTPException) as erro:
                  print(f'::warning title=E-mail editorial não enviado::{editorial_id}: {erro}. A página foi publicada normalmente.')
                  continue

              registro = {
                  'id_editorial': editorial_id,
                  'tipo': str(artigo.get('tipo') or 'editorial'),
                  'slug': artigo['slug'],
                  'url': url,
                  'notificado_em': datetime.now(timezone(timedelta(hours=-3))).replace(microsecond=0).isoformat(),
              }
              if rodada:
                  registro['rodada'] = rodada
              notificacoes.setdefault('notificacoes', []).append(registro)
              ids_notificados.add(editorial_id)
              enviados += 1
              print(f'Página confirmada e e-mail enviado: {url}')

          if not enviados:
              raise SystemExit(0)
          notificacoes['notificacoes'].sort(key=lambda item: str(item.get('notificado_em') or ''))
          notificacoes['schema_version'] = 2
          notificacoes['total_notificacoes'] = len(notificacoes['notificacoes'])
          caminho_temporario = caminho_notificacoes.with_suffix('.tmp')
          caminho_temporario.write_text(json.dumps(notificacoes, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          caminho_temporario.replace(caminho_notificacoes)
          PY

          if git diff --quiet -- "$NOTIFICACOES_ANALISE"; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$NOTIFICACOES_ANALISE"
          git commit -m "Registrar notificação editorial por e-mail [skip ci]"

          publicado=false
          for tentativa in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              publicado=true
              break
            fi
            echo "Tentativa $tentativa/3 de registrar a notificação não concluiu; tentando novamente."
          done
          if [[ "$publicado" != "true" ]]; then
            echo "::warning title=Registro da notificação pendente::O e-mail foi enviado, mas o registro de deduplicação não pôde ser publicado."
          fi

      - name: Notificar buscadores via IndexNow
        if: success()
        run: |
          # IndexNow avisa Bing, Yandex, Naver e DuckDuckGo em uma única chamada.
          # O Google NÃO suporta o protocolo — o sitemap com lastmod real já
          # cobre o Google. A chave está em 78f8b10d32edcce04827b713eae52df5.txt na raiz do site.
          python - <<'INNER'
          import json, pathlib, urllib.request, urllib.error

          CHAVE = "78f8b10d32edcce04827b713eae52df5"
          HOST  = "formuladogol.com.br"
          URLS  = [
              "https://formuladogol.com.br/",
              "https://formuladogol.com.br/estatisticas.html",
              "https://formuladogol.com.br/aovivo.html",
              "https://formuladogol.com.br/clubes.html",
              "https://formuladogol.com.br/museu.html",
              "https://formuladogol.com.br/copa2026/",
          ]
          manifesto = json.loads(pathlib.Path("dados-br/analises.json").read_text(encoding="utf-8"))
          URLS.append("https://formuladogol.com.br/analises/")
          URLS.extend(item["url"] for item in (manifesto.get("artigos") or [])[-5:])

          payload = json.dumps({
              "host": HOST,
              "key": CHAVE,
              "keyLocation": "https://" + HOST + "/" + CHAVE + ".txt",
              "urlList": URLS,
          }).encode("utf-8")

          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  status = resp.status
          except urllib.error.HTTPError as e:
              status = e.code
          except urllib.error.URLError as e:
              print("IndexNow: erro de rede: " + str(e.reason))
              raise SystemExit(0)

          CODIGOS = {
              200: "OK - URLs aceitas",
              202: "OK - URLs recebidas e serao processadas",
              400: "AVISO - request mal formado",
              403: "AVISO - chave nao corresponde ao arquivo de verificacao",
              422: "AVISO - URLs nao pertencem ao host declarado",
              429: "AVISO - rate limit",
          }
          print("IndexNow: HTTP " + str(status) + " - " + CODIGOS.get(status, "codigo desconhecido"))
          print("URLs submetidas: " + str(len(URLS)))
          for u in URLS:
              print("  " + u)
          if status not in (200, 202):
              print("IndexNow: deploy continua mesmo com este aviso")
          INNER

      - name: Alertar falha de deploy por e-mail
        if: failure()
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO_SUGESTOES }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage
          from email.utils import formataddr

          obrigatorios = ('SMTP_HOST', 'SMTP_PORT', 'SMTP_USER', 'SMTP_PASS', 'EMAIL_DESTINO')
          ausentes = [nome for nome in obrigatorios if not os.environ.get(nome, '').strip()]
          if ausentes:
              print('::warning title=Alerta de deploy não enviado::Secrets SMTP ausentes: ' + ', '.join(ausentes))
              raise SystemExit(0)
          url_execucao = f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
          mensagem = EmailMessage()
          mensagem['From'] = formataddr(('Fórmula do Gol', os.environ['SMTP_USER']))
          mensagem['To'] = os.environ['EMAIL_DESTINO']
          mensagem['Subject'] = 'Fórmula do Gol: falha no deploy do site'
          mensagem.set_content('O deploy do GitHub Pages falhou. A última versão publicada continua no ar.\n\n' + url_execucao)
          try:
              porta = int(os.environ['SMTP_PORT'])
              contexto = ssl.create_default_context()
              if porta == 465:
                  with smtplib.SMTP_SSL(os.environ['SMTP_HOST'], porta, context=contexto, timeout=30) as servidor:
                      servidor.login(os.environ['SMTP_USER'], os.environ['SMTP_PASS'])
                      servidor.send_message(mensagem)
              else:
                  with smtplib.SMTP(os.environ['SMTP_HOST'], porta, timeout=30) as servidor:
                      servidor.ehlo()
                      servidor.starttls(context=contexto)
                      servidor.ehlo()
                      servidor.login(os.environ['SMTP_USER'], os.environ['SMTP_PASS'])
                      servidor.send_message(mensagem)
          except (OSError, ValueError, smtplib.SMTPException) as erro:
              print(f'::warning title=Alerta de deploy não enviado::{erro}')
          PY
