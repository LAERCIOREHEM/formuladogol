name: EDITORIAL-CLOSURE R2 — Operational 36-38 Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-closure-r2-operational-smoke.yml'
  workflow_run:
    workflows:
      - Deploy Orchestrator Worker
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Verify deployed FINAL-driven scheduler, R35 delivery and 36-38 readiness
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          BASE='https://orchestrator.formuladogol.com.br'
          def get(path):
              request=urllib.request.Request(BASE+path+'?r2='+str(int(time.time())),
                headers={'Accept':'application/json','Cache-Control':'no-cache',
                         'User-Agent':'FDG-Editorial-R2-Operational-Smoke'})
              with urllib.request.urlopen(request,timeout=12) as response:
                  assert response.status==200
                  return json.load(response)
          last_error=''
          for attempt in range(1,25):
              try:
                  health=get('/health')
                  status=get('/status')
                  assert health.get('version')=='2.6.0',health
                  assert status.get('version')=='2.6.0','runtime version not deployed'
                  assert status.get('mode')=='active','orchestrator is not active'
                  assert health.get('editorialClosureGuaranteeVersion')==2
                  assert health.get('editorialClosureFinalDriven') is True
                  assert health.get('editorialClosurePublicSiteProof') is True
                  closure=(status.get('hints') or {}).get('editorialClosure') or {}
                  future={int(x['round']):x for x in closure.get('futureRounds') or []}
                  assert all(n in future for n in (36,37,38)),\
                     'future round hints absent: '+str(sorted(future))
                  assert all(future[n].get('scheduledGames')==10 for n in (36,37,38)),\
                     'calendar incomplete: '+str(future)
                  # R36 started on 21/11. The smoke must track actual FINAL
                  # counts, not falsely require 10 pending games forever.
                  for n in (36,37,38):
                      completed=int(future[n].get('concluded') or 0)
                      pending=int(future[n].get('pending') or 0)
                      assert 0<=completed<=10 and 0<=pending<=10 and completed+pending==10,\
                         'inconsistent R'+str(n)+' completion ledger: '+str(future[n])
                      expected_state='armed' if pending else 'final_confirmed'
                      assert future[n].get('state')==expected_state,\
                         'incorrect R'+str(n)+' editorial readiness: '+str(future[n])
                  closure_round=int(closure.get('round') or 0)
                  closure_state=str(closure.get('state') or '')
                  if closure_round==35:
                      assert closure_state in ('site_verified','site_verified_cached'),\
                         'R35 public status not verified: '+str(closure)
                  else:
                      assert closure_round in (36,37,38),\
                         'unexpected editorial round: '+str(closure)
                      assert int(future[closure_round].get('concluded') or 0)==10,\
                         'new round selected before 10 certified FINALs: '+str(closure)
                      assert closure_state in (
                          'generation_pending','delivery_pending','site_verified',
                          'site_verified_cached','delivery_manual_attention'
                      ), 'unexpected editorial state: '+str(closure)
                      if closure_state not in ('site_verified','site_verified_cached'):
                          assert float(closure.get('ageMinutes') or 0)<15,\
                             'editorial delivery outside 15-minute SLO: '+str(closure)
                  assert status.get('lastTickAt'),'cron has not produced a tick'
                  print(json.dumps({
                     'result':'EDITORIAL_CLOSURE_R2_ORCHESTRATOR_VERIFIED',
                     'version':status.get('version'),
                     'mode':status.get('mode'),
                     'lastTickAt':status.get('lastTickAt'),
                     'editorial35':{k:closure.get(k) for k in
                        ('round','state','siteVerified','verifiedAt','ageMinutes','lastFinalAt')},
                     'nextRounds':{n:future[n] for n in (36,37,38)},
                     'attempt':attempt
                  },ensure_ascii=False,indent=2))
                  break
              except Exception as exc:
                  last_error=str(exc)
                  print('EDITORIAL_CLOSURE_R2_WAIT',attempt,last_error[:350])
                  if attempt<24:time.sleep(15)
          else:
              raise RuntimeError('EDITORIAL_CLOSURE_R2_NOT_VERIFIED: '+last_error)
          PY
