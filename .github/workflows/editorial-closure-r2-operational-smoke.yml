name: EDITORIAL-CLOSURE R2 — Operational 36-38 Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-closure-r2-operational-smoke.yml'
  workflow_run:
    workflows:
      - Deploy Orchestrator Worker
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Verify deployed FINAL-driven scheduler, R35 delivery and 36-38 readiness
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          BASE='https://orchestrator.formuladogol.com.br'
          def get(path):
              request=urllib.request.Request(BASE+path+'?r2='+str(int(time.time())),
                headers={'Accept':'application/json','Cache-Control':'no-cache',
                         'User-Agent':'FDG-Editorial-R2-Operational-Smoke'})
              with urllib.request.urlopen(request,timeout=12) as response:
                  assert response.status==200
                  return json.load(response)
          last_error=''
          for attempt in range(1,25):
              try:
                  health=get('/health')
                  status=get('/status')
                  assert health.get('version')=='2.6.0',health
                  assert status.get('version')=='2.6.0','runtime version not deployed'
                  assert status.get('mode')=='active','orchestrator is not active'
                  assert health.get('editorialClosureGuaranteeVersion')==2
                  assert health.get('editorialClosureFinalDriven') is True
                  assert health.get('editorialClosurePublicSiteProof') is True
                  closure=(status.get('hints') or {}).get('editorialClosure') or {}
                  future={int(x['round']):x for x in closure.get('futureRounds') or []}
                  assert all(n in future for n in (36,37,38)),\
                     'future round hints absent: '+str(sorted(future))
                  assert all(future[n].get('scheduledGames')==10 for n in (36,37,38)),\
                     'calendar incomplete: '+str(future)
                  assert all(future[n].get('pending')==10 for n in (36,37,38)),\
                     'future rounds prematurely closed: '+str(future)
                  assert closure.get('state') in ('site_verified','site_verified_cached'),\
                     'R35 public status not verified: '+str(closure)
                  assert int(closure.get('round') or 0)==35
                  assert status.get('lastTickAt'),'cron has not produced a tick'
                  print(json.dumps({
                     'result':'EDITORIAL_CLOSURE_R2_ORCHESTRATOR_VERIFIED',
                     'version':status.get('version'),
                     'mode':status.get('mode'),
                     'lastTickAt':status.get('lastTickAt'),
                     'editorial35':{k:closure.get(k) for k in
                        ('round','state','siteVerified','verifiedAt','ageMinutes','lastFinalAt')},
                     'nextRounds':{n:future[n] for n in (36,37,38)},
                     'attempt':attempt
                  },ensure_ascii=False,indent=2))
                  break
              except Exception as exc:
                  last_error=str(exc)
                  print('EDITORIAL_CLOSURE_R2_WAIT',attempt,last_error[:350])
                  if attempt<24:time.sleep(15)
          else:
              raise RuntimeError('EDITORIAL_CLOSURE_R2_NOT_VERIFIED: '+last_error)
          PY
