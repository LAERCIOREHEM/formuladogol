name: FDG Data Pulse Responsive Intelligence
on:
  workflow_dispatch:
  push:
    paths:
      - 'css/br-data-pulse.css'
      - 'css/br-global.css'
      - 'tests/test-br-table-r37.mjs'
      - 'js/br-data-pulse.js'
      - 'js/br-data-refresh.js'
      - 'js/br-af-core-snapshot.js'
      - 'tests/test-br-data-pulse-*.mjs'
      - 'js/br-estatisticas.js'
      - 'js/br-acuracia.js'
      - 'js/br-acuracia-placares-e4.js'
      - 'index.html'
      - 'estatisticas.html'
      - 'acuracia.html'
      - '.github/workflows/data-pulse-responsive.yml'
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconciliar auditoria documental com o ledger atual (local, sem publicação)
        run: |
          python scripts/auditar_historico_placares_af.py
          python scripts/gerar_resultados_af_e3.py
          python scripts/gerar_acuracia_placares_e4.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test-br-data-pulse-integration.mjs && node tests/test-br-data-pulse-certification.mjs && node tests/test-br-data-pulse-final.mjs && node tests/test-br-data-pulse-ux.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/test-br-data-pulse-responsive.mjs
      - run: node tests/test-br-table-r37.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdg-data-pulse-responsive
          path: artifacts/data-pulse
          retention-days: 7
