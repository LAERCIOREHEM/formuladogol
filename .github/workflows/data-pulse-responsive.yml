name: FDG Data Pulse Responsive Intelligence
on:
  workflow_dispatch:
  push:
    paths:
      - 'css/br-data-pulse.css'
      - 'js/br-data-pulse.js'
      - 'tests/test-br-data-pulse-responsive.mjs'
      - '.github/workflows/data-pulse-responsive.yml'
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/test-br-data-pulse-responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdg-data-pulse-responsive
          path: artifacts/data-pulse
          retention-days: 7
